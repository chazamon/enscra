<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Enscra</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* app feel: no text selection, no pull-to-refresh, no blue tap flash */
  html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  input{-webkit-user-select:text;user-select:text;}
  /* when launched as an installed app, drop the page title banner */
  @media (display-mode: fullscreen), (display-mode: standalone){
    body > h1, body > .sub{display:none;}
    body{padding-top:calc(10px + env(safe-area-inset-top));}
  }
</style>
<style>
  :root{
    --red:#e0473a; --green:#3fae5f; --blue:#3f8ce0; --white:#e6e6e6; --purple:#9a5be0;
    --bg:#0b0c10; --panel:#14151c; --panel2:#1b1d28; --border:#31333f; --text:#eee; --dim:#9aa0aa;
    --gold:#ffd76b;
  }
  *{box-sizing:border-box;}
  body{
    background: radial-gradient(ellipse at 50% -10%, #232538 0%, #0b0c10 55%);
    color:var(--text);font-family:"Segoe UI",Arial,sans-serif;margin:0;padding:10px;
    padding-bottom:calc(52px + env(safe-area-inset-bottom)); /* room for the sticky HUD so it never covers content, plus the gesture-bar safe area on notched phones */
  }

  /* Sticky HUD — always visible at the bottom of the viewport, no scrolling needed */
  #stickyHud{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:linear-gradient(180deg,#0d0e13ee,#0a0a0efa);border-top:2px solid var(--gold);
    padding:6px 14px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
    box-shadow:0 -4px 16px rgba(0,0,0,.5);
  }
  #stickyHud .hudName{font-size:12px;font-weight:700;color:#fff;}
  #stickyHud .hudBadges{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  #stickyHud .hudPhase{font-size:10px;color:var(--gold);font-weight:700;text-transform:uppercase;}
  h1{margin:0 0 1px 0;font-size:17px;letter-spacing:.04em;}
  .sub{color:var(--dim);margin-bottom:6px;font-size:11px;}

  /* Page layout: vertical phase sidebar on the left, everything else in the main column */
  #pageLayout{display:flex;gap:12px;align-items:flex-start;}
  #phaseSidebar{
    width:138px;flex:none;background:#000000cc;border:1px solid var(--border);border-radius:8px;
    padding:6px;display:flex;flex-direction:column;gap:5px;
    /* Not position:sticky — sticky positioning inside an ancestor that has a CSS transform:scale()
       applied (which #fitWrap gets from fitToViewport()) computes its offset against the ancestor's
       unscaled layout size while everything renders at the scaled visual size. That mismatch is what
       was making this sidebar appear to float on top of the board instead of sitting beside it. */
  }
  #mainArea{flex:1;min-width:0;}
  #phaseStepsList{display:flex;flex-direction:column;gap:5px;}
  #phaseSidebar #nextPhaseBtn{width:100%;margin-top:2px;white-space:normal;line-height:1.3;}
  .phaseStep{
    background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:6px 7px;font-size:10.5px;color:#666;font-weight:600;letter-spacing:.03em;
    text-transform:uppercase;transition:all .15s;
  }
  .phaseStep.done{color:#5c6270;border-color:#3a3c48;}
  .phaseStep.active{
    color:#0b0c10;background:linear-gradient(135deg,var(--gold),#e8b93f);border-color:var(--gold);
    box-shadow:0 0 12px rgba(255,215,107,.5);
  }
  .phaseStep .stepNum{
    display:inline-block;width:16px;font-weight:800;margin-right:6px;text-align:center;
  }
  #status{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 12px;
    margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  }
  #status .turnInfo{font-size:13px;font-weight:600;}
  button{cursor:pointer;background:#33354a;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 13px;font-size:13px;}
  button:hover:not(:disabled){background:#43465f;}
  button:disabled{opacity:.3;cursor:not-allowed;}
  button.primary{background:#5a3fd9;border-color:#8a76e8;}
  button.primary:hover:not(:disabled){background:#6c52e8;}
  button.small{padding:4px 9px;font-size:11px;}

  #bigInstruction{
    background:linear-gradient(135deg,#2c2260,#1e2c55);border:2px solid #7a63e8;border-radius:10px;
    padding:8px 14px;margin-bottom:8px;font-size:13px;line-height:1.4;
  }
  #bigInstruction b{color:var(--gold);}
  #bigInstruction .step{color:#8ef0a0;font-weight:700;}

  /* Compact Devotion picker — lives in the sidebar under the phase steps, replacing the old
     full-width horizontal panel. Pick a colour here, then click the target column on the board. */
  #devotionPicker{display:flex;flex-direction:column;gap:5px;}
  .devPickerLabel{font-size:9.5px;color:var(--dim);line-height:1.3;}
  #devColourBtns{display:flex;flex-direction:column;gap:4px;}
  #devColourBtns button{font-size:11px;padding:6px 4px;font-weight:600;border-width:1.5px;width:100%;}
  #devColourBtns button.b-Red{background:#4a1c1c;border-color:var(--red);}
  #devColourBtns button.b-Green{background:#173322;border-color:var(--green);}
  #devColourBtns button.b-Blue{background:#162a45;border-color:var(--blue);}
  #devColourBtns button.b-White{background:#35353c;border-color:var(--white);}
  #devColourBtns button.b-Purple{background:#301c47;border-color:var(--purple);}
  #devColourBtns button:hover:not(:disabled){filter:brightness(1.35);}
  #devColourBtns button.active{outline:2px solid #fff;box-shadow:0 0 8px rgba(255,255,255,.5);}
  .devPickerDone{font-size:11px;color:#8ef0a0;font-weight:700;text-align:center;padding:6px 0;}

  /* Battlefield — ONE shared playmat holding both boards + the Realm zone, like MTG Arena / Master
     Duel: a single continuous surface with a center divider, not two separately-framed panels. */
  #battlefield{
    background: radial-gradient(ellipse at 50% 50%, #171a20 0%, #0d0e12 100%);
    border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin-bottom:6px;
  }
  .board{margin-bottom:4px;}
  .boardHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:8px;}
  .boardHeader .pname{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:#cfd2da;}
  .boardHeader .pname .active-tag{color:var(--gold);margin-left:6px;font-size:11px;}
  .badges{display:flex;gap:6px;align-items:center;}
  .badge{display:flex;align-items:center;gap:4px;background:#00000055;border:1px solid var(--border);border-radius:20px;padding:2px 9px 2px 2px;font-size:11px;}
  .badgeIcon{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex:none;}
  .badge.hpBadge .badgeIcon{background:radial-gradient(circle at 35% 30%,#ff6b6b,#a11f1f);color:#fff;}
  .badge.devBadge .badgeIcon{background:radial-gradient(circle at 35% 30%,#c9a8ff,#5a3fd9);color:#fff;}
  .badge.essenceBadge .badgeIcon{background:radial-gradient(circle at 35% 30%,#ffe08a,#c98a1f);color:#1a1200;}
  .badge.deckBadge .badgeIcon{background:radial-gradient(circle at 35% 30%,#8a8a9a,#3a3a45);color:#fff;font-size:10px;}

  /* Columns are a fixed, card-shaped width (not stretched to fill the row) — otherwise a placed
     Vessel renders far wider than a real card, and the deck/void boxes won't line up with anything. */
  /* The row of 6 columns (5 Vessel zones + Void/Deck) is ~940px wide and won't fit most phone
     widths even after the page-level scale-to-fit shrinks everything else — and on some mobile
     browsers a CSS transform:scale() on an ancestor doesn't reliably shrink what counts toward the
     page's scrollable width, so the overflow was getting silently clipped at the screen edge
     instead of scaled or reachable by scrolling. Making the row scroll horizontally on its own
     (independent of that outer scale calculation) fixes this on any screen width or orientation —
     not just below the mobile breakpoint. */
  .row{
    display:flex;gap:8px;margin-bottom:8px;justify-content:flex-start;
    flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity;padding-bottom:6px;
  }
  .col{flex:0 0 150px;display:flex;flex-direction:column;min-width:0;scroll-snap-align:start;}

  /* Merged column box: Vessel zone (big, top) + Devotion strip (thin, bottom) in ONE bordered box —
     one continuous zone per column instead of two separately-framed rows. */
  .colBox{
    height:190px;border:1.5px dashed #3a3c48;border-radius:8px;overflow:hidden;
    display:flex;flex-direction:column;cursor:default;transition:all .15s;position:relative;
  }
  .colBox.targetable{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,215,107,.35) inset, 0 0 10px rgba(255,215,107,.25);cursor:pointer;}
  .colBox.placeable{border-color:#7ee787;box-shadow:0 0 0 2px rgba(126,231,135,.3) inset, 0 0 10px rgba(126,231,135,.2);cursor:pointer;}
  .vesselZone{
    flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:10px;color:#484a54;position:relative;padding:2px;background:#0000002a;
  }
  .vesselPlaceholder{color:#3d3f49;}
  .zoneOverlay{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;font-weight:800;pointer-events:none;letter-spacing:.02em;}
  .colBox.placeable .zoneOverlay{color:#7ee787;text-shadow:0 0 4px #000;}
  .colBox.targetable .zoneOverlay{color:var(--gold);text-shadow:0 0 4px #000;}

  /* Devotion strip — the bottom sliver of the merged column box. Purely informational, never holds a Vessel. */
  .devStrip{
    flex:none;height:22px;background:#0000006a;border-top:1.5px solid #3a3c48;
    display:flex;align-items:center;justify-content:center;gap:4px;font-size:9.5px;font-weight:700;
    position:relative;padding:0 4px;overflow:hidden;
  }
  .devStripEmpty{color:#555;font-weight:500;text-transform:uppercase;font-size:8px;}
  .queuedTag{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);color:#ffd76b;font-size:8px;font-weight:800;
    max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  /* Void + Deck share the 6th column the same way: Void (face-up, most recent card) on top, Deck
     (face-down pile) as the bottom strip. The Void box itself is just a small peek (click it to open
     the full graveyard browser overlay below — a dropdown here would get clipped by this box's own
     overflow:hidden ancestor, so browsing the whole pile lives in its own overlay instead). */
  .voidDeckBox{border-style:solid;background:linear-gradient(135deg,#241a1a,#160f0f);}
  .voidZoneBig{flex:1;min-height:0;position:relative;padding:0;cursor:pointer;
    height:100%;width:100%;display:flex;align-items:center;justify-content:center;}
  .voidZoneBig .card{font-size:7.5px;} /* fallback base; specific child overrides are defined below with the rest of the card sizing rules */
  .mzLabel{font-size:9px;color:var(--dim);text-transform:uppercase;font-weight:600;}
  .mzCount{font-size:16px;}
  .voidCountBadge{
    position:absolute;bottom:2px;right:2px;background:#000d;border:1px solid #ffffff33;border-radius:4px;
    padding:0 5px;font-size:10px;font-weight:800;color:#e0473a;z-index:5;
  }

  /* Graveyard browser — a full overlay (same pattern as #cardZoomOverlay) rather than an inline
     dropdown, since an inline dropdown here gets clipped by the board row's own overflow:hidden. Every
     card in a player's Void renders as an actual mini card (art, type, full effect text, stats) via the
     same renderCard() every other zone uses, so the zoom button (🔍) and long-press-to-expand both work
     on Void cards exactly like anywhere else, and you can actually read what's in the graveyard instead
     of just a name. */
  #graveyardOverlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:140;
    align-items:center;justify-content:center;padding:20px;
  }
  #graveyardOverlay.open{display:flex;}
  #graveyardInner{
    width:min(640px,100%);max-height:85vh;background:#14151c;border:2px solid var(--border);border-radius:12px;
    display:flex;flex-direction:column;position:relative;
  }
  #graveyardHeader{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);}
  #graveyardTitle{font-size:14px;font-weight:700;color:#fff;}
  #graveyardClose{
    width:30px;height:30px;border-radius:50%;background:#e0473a;color:#fff;border:2px solid #fff;
    font-weight:800;cursor:pointer;font-size:14px;flex:none;
  }
  #graveyardGrid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;
    padding:14px;overflow-y:auto;
  }
  #graveyardGrid .gyCardWrap{position:relative;height:180px;}
  #graveyardGrid .voidRowEligible .card{outline:2px solid var(--gold);box-shadow:0 0 8px #ffd76b88;}
  #graveyardGrid .empty{color:#555;font-style:italic;grid-column:1/-1;text-align:center;padding:20px;}
  #deflectPrompt{background:linear-gradient(135deg,#4a1c1c,#2c1030);border:2px solid var(--red);border-radius:10px;
    padding:8px 14px;margin-bottom:8px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  #deflectPrompt button{background:#7a2f2f;border-color:var(--red);}
  #riteOfferPrompt{background:linear-gradient(135deg,#1c2c4a,#301045);border:2px solid var(--gold);border-radius:10px;
    padding:8px 14px;margin-bottom:8px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  #riteOfferPrompt button{background:#2f5a7a;border-color:var(--gold);}
  #phaseWarningPrompt{background:linear-gradient(135deg,#3a2c14,#241c30);border:2px solid var(--gold);border-radius:10px;
    padding:8px 14px;margin-bottom:8px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  #phaseWarningPrompt button{background:#5a4a1f;border-color:var(--gold);}

  /* Deck strip — a face-down card back with a small count, filling the bottom sliver of the 6th column. */
  .deckStrip{
    flex:none;height:22px;background:#0000006a;border-top:1.5px solid #3a3c48;
    display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;
  }
  .cardBackMini{
    width:13px;height:17px;border-radius:2px;flex:none;
    background:repeating-linear-gradient(45deg,#3a3d52,#3a3d52 3px,#2a2c3a 3px,#2a2c3a 6px);
    border:1px solid #55597a;
  }
  .deckStrip .mzCount{font-size:10px;font-weight:800;color:var(--gold);}

  /* Card zoom-in preview — click the 🔍 on any card (hand, front row, or Void) to enlarge it */
  .card .zoomBtn{
    position:absolute;top:3px;left:4px;background:#000b;border:1px solid #ffffff33;border-radius:4px;
    color:#ddd;font-size:9px;padding:1px 4px;cursor:pointer;z-index:3;line-height:1.4;
  }
  .card .zoomBtn:hover{background:#000e;color:#fff;}
  #cardZoomOverlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:150;
    align-items:center;justify-content:center;
  }
  #cardZoomOverlay.open{display:flex;}
  #cardZoomInner{width:300px;height:420px;position:relative;}
  #cardZoomInner .card{font-size:15px;}
  #cardZoomInner .cardArt{height:80px;font-size:52px;}
  #cardZoomInner .cardHead{font-size:16px;padding:10px 12px;}
  #cardZoomInner .cardHead .costPill{width:26px;height:26px;font-size:14px;}
  #cardZoomInner .cardType{font-size:13px;padding:2px 6px;}
  #cardZoomInner .cardText{font-size:13.5px;line-height:1.45;padding:10px 12px;}
  #cardZoomInner .cardText .inert{font-size:11px;}
  #cardZoomInner .statsBadge{font-size:20px;padding:4px 14px;}
  #cardZoomInner .zoomBtn{display:none;}
  #cardZoomClose{
    position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:36px;height:36px;border-radius:50%;
    background:#e0473a;color:#fff;border:2px solid #fff;font-weight:800;cursor:pointer;z-index:5;font-size:14px;
  }

  /* Inline keyword glossary — a keyword in a card's own rules text (or its SICK/STUNNED/SPENT tag, or
     a Rite's Instant/Main speed word) gets underlined with a small "?" marker; clicking or tapping it
     (works via plain click, so phone taps hit it too) pops up its definition near the tap. */
  .kw{border-bottom:1.5px dotted #ffd76b;cursor:help;}
  .kwMark{font-size:0.75em;color:#ffd76b;vertical-align:super;margin-left:1px;}
  #glossaryPopover{
    display:none;position:fixed;max-width:240px;background:#15151c;border:2px solid var(--gold);
    border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.4;color:#eee;z-index:250;
    box-shadow:0 8px 20px rgba(0,0,0,.6);
  }
  #glossaryPopover .kwTerm{color:#ffd76b;font-weight:800;display:block;margin-bottom:3px;}

  /* Economy-teaching visual cues (task A): a brief glow/flash that plays once, the instant the action
     happens, on the real devotion-strip / essence-badge elements already on the board. */
  @keyframes attuneGlowPulse{
    0%{ box-shadow:0 0 0 0 rgba(255,215,106,.9); background:rgba(255,215,106,.35); }
    100%{ box-shadow:0 0 0 0 rgba(255,215,106,0); background:transparent; }
  }
  .attuneGlowCue{ animation: attuneGlowPulse 1.1s ease-out; border-radius:4px; }
  @keyframes essenceFlashPulse{
    0%{ transform:scale(1.35); background:#ffe08a; color:#1a1200; }
    100%{ transform:scale(1); }
  }
  .essenceFlashCue{ animation: essenceFlashPulse .6s ease-out; }

  /* Guided first-turn walkthrough — a short sequence of small tooltips anchored next to the actual
     UI element each one is talking about (Devotion picker, Essence badge, hand, battlefield, Next
     Phase button), shown one at a time in the order a first turn naturally hits them. Replaces the
     old single "wall of text" overlay explaining Devotion+Essence both at once. */
  #turnGuideTip{
    display:none;position:fixed;z-index:160;width:270px;max-width:calc(100vw - 16px);background:#15151d;border:2px solid var(--gold);
    border-radius:10px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.6);
    /* The tip is anchored next to (sometimes nearly on top of) the exact board element the player needs
       to click next, so the box itself must never intercept clicks meant for what's underneath it — only
       its own Skip/Got it buttons should be clickable. */
    pointer-events:none;
  }
  #turnGuideTip.open{display:block;}
  #turnGuideTip .tgStep{font-size:10px;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:5px;letter-spacing:.03em;}
  #turnGuideTip .tgText{font-size:12px;line-height:1.5;color:#eee;}
  #turnGuideTip .tgButtons{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:8px;}
  #turnGuideTip .tgButtons button{pointer-events:auto;}
  #turnGuideTip .tgButtons button.primary{font-size:11px;padding:4px 10px;}
  #turnGuideTip .tgSkip{background:none;border:none;color:#888;cursor:pointer;font-size:11px;text-decoration:underline;padding:0;}
  #turnGuideTip .tgSkip:hover{color:#ccc;}
  /* The element a tip is currently pointing at gets a soft pulsing outline so it's unambiguous which
     part of the screen the small text box is actually talking about. */
  .turnGuideHighlight{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px;animation:turnGuidePulse 1.4s ease-in-out infinite;}
  @keyframes turnGuidePulse{ 0%,100%{box-shadow:0 0 0 0 rgba(255,215,106,.5);} 50%{box-shadow:0 0 0 5px rgba(255,215,106,0);} }

  /* Shared Realm zone between the two boards — narrower, centered over the middle columns */
  #realmZoneWrap{display:flex;justify-content:center;margin:6px 0 8px;}
  #realmZone{
    background:linear-gradient(135deg,#241a3a,#1a1428);border:2px dashed #5a3fd9;border-radius:10px;
    padding:6px 12px;text-align:center;font-size:11px;color:#b8aee0;width:60%;min-width:280px;
  }
  #realmZone b{color:var(--gold);}

  /* Cards — default sizing is tuned for the taller board vesselZone. Hand cards and the Void
     preview card are smaller fixed boxes, so they get their own scoped overrides below. */
  .card{
    width:100%;height:100%;border-radius:7px;padding:0;font-size:12.5px;
    display:flex;flex-direction:column;
    border:2px solid; position:relative; cursor:pointer;overflow:hidden;
    background:#1a1a22;
  }
  .card.sick{opacity:.55;}
  .cardHead{display:flex;justify-content:space-between;align-items:center;padding:5px 7px;font-weight:700;font-size:12px;background:#00000040;}
  .cardHead .costPill{
    width:20px;height:20px;border-radius:50%;background:#000c;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:var(--gold);flex:none;border:1px solid #ffffff33;
  }
  .cardArt{height:38px;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.85;}
  .cardType{font-size:10px;color:#bbb;text-align:center;padding:0 4px;text-transform:uppercase;letter-spacing:.02em;}
  .cardText{font-size:10.5px;line-height:1.35;color:#d8d8d8dd;font-style:italic;padding:4px 7px;flex:1;overflow:hidden;}
  .cardText .inert{color:#8888;font-style:normal;font-size:9px;display:block;margin-top:2px;}
  .cardFoot{display:flex;justify-content:flex-end;padding:4px 7px;}
  .statsBadge{background:#000c;border:1px solid #ffffff33;border-radius:5px;padding:2px 9px;font-weight:800;font-size:14px;}
  .statsBadgeModified{border-color:#ffd76b !important;box-shadow:0 0 6px #ffd76b88;}
  .card.selected{outline:2px solid #fff;box-shadow:0 0 10px #fff;}
  .card .tag{position:absolute;top:3px;right:4px;font-size:9px;color:#fff;background:#000b;padding:1px 5px;border-radius:4px;z-index:2;}

  /* Hand cards are a bit smaller than board cards, but scaled up alongside them so the hand block
     fills more of the row width and doesn't feel stranded away from the deck box. */
  #handCards .card{font-size:13px;}
  #handCards .cardHead{padding:4px 7px;font-size:13px;}
  #handCards .cardHead .costPill{width:19px;height:19px;font-size:11px;}
  #handCards .cardArt{height:26px;font-size:18px;}
  #handCards .cardType{font-size:10px;}
  #handCards .cardText{font-size:10px;line-height:1.25;padding:3px 6px;}
  #handCards .cardText .inert{font-size:9px;}
  #handCards .cardFoot{padding:3px 6px;}
  #handCards .statsBadge{font-size:13px;padding:2px 8px;}

  /* Void preview card — small, matching the Void zone's compact footprint. */
  .voidZoneBig .cardHead{padding:4px 6px;font-size:11px;}
  .voidZoneBig .cardHead .costPill{width:16px;height:16px;font-size:9px;}
  .voidZoneBig .cardArt{height:26px;font-size:17px;}
  .voidZoneBig .cardType{font-size:8.5px;}
  .voidZoneBig .cardText{font-size:8.5px;line-height:1.25;padding:3px 6px;}
  .voidZoneBig .cardText .inert{font-size:7.5px;}
  .voidZoneBig .statsBadge{font-size:11px;padding:1.5px 6px;}

  .c-Red{border-color:var(--red);} .c-Red .cardHead{background:linear-gradient(90deg,#5a1c1c,#2a1010);} .c-Red .statsBadge{color:var(--red);}
  .c-Green{border-color:var(--green);} .c-Green .cardHead{background:linear-gradient(90deg,#164a28,#0f2418);} .c-Green .statsBadge{color:var(--green);}
  .c-Blue{border-color:var(--blue);} .c-Blue .cardHead{background:linear-gradient(90deg,#123a5c,#0e2338);} .c-Blue .statsBadge{color:var(--blue);}
  .c-White{border-color:var(--white);} .c-White .cardHead{background:linear-gradient(90deg,#3a3a40,#222226);} .c-White .statsBadge{color:var(--white);}
  .c-Purple{border-color:var(--purple);} .c-Purple .cardHead{background:linear-gradient(90deg,#3a1c5c,#201034);} .c-Purple .statsBadge{color:var(--purple);}

  .colDot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px;}
  .dot-Red{background:var(--red);} .dot-Green{background:var(--green);} .dot-Blue{background:var(--blue);}
  .dot-White{background:var(--white);} .dot-Purple{background:var(--purple);}

  /* Hand */
  #handWrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 10px 6px;margin-bottom:6px;}
  #handWrap h3{margin:0;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.03em;}
  /* #handRow is a flex row with default align-items:stretch, so #deckDisplayBig automatically
     matches the FULL height of #handLeft (title + cards) — no hardcoded height to keep in sync. */
  #handRow{display:flex;gap:14px;}
  #handLeft{flex:1;min-width:0;display:flex;flex-direction:column;}
  .handHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
  #handCards{flex:1;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:9px;min-height:142px;padding:6px 0 3px;}
  #handCards .cardWrap{
    width:108px;height:142px;flex:none;transition:transform .15s;transform-origin:bottom center;
  }
  #handCards .cardWrap:hover{transform:translateY(-10px) scale(1.05) !important;z-index:10;}
  #handCards .card{width:100%;height:100%;}

  /* Big deck display, next to the hand — shows the deck's card BACK large and clearly, since the
     back/sleeve design should be easy to see (and show off) digitally, not just a tiny corner icon.
     Stretches to the full height of the hand panel (title + cards); the sleeve itself sits a bit
     smaller than the box so there's breathing room, but still large enough to read the art clearly.
     Matches the 150px column width used across the battlefield so it lines up with the Void box above. */
  #deckDisplayBig{
    flex:none;width:150px;border-radius:10px;border:1.5px solid var(--border);
    background:linear-gradient(135deg,#26283a,#1a1b26);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;padding:10px;
  }
  .deckSleeve{
    width:114px;height:150px;border-radius:8px;flex:none;
    background:repeating-linear-gradient(45deg,#3a3d52,#3a3d52 6px,#2a2c3a 6px,#2a2c3a 12px);
    border:2px solid #6a6f95;box-shadow:0 0 10px rgba(0,0,0,.5) inset, 0 2px 8px rgba(0,0,0,.4);
  }
  .deckDisplayLabel{font-size:10px;color:var(--dim);text-transform:uppercase;font-weight:700;letter-spacing:.03em;}
  .deckDisplayCount{font-size:16px;font-weight:800;color:var(--gold);}

  #controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  /* Log now lives in the sidebar under Next Phase — narrower box, so it wraps more and gets extra height. */
  #log{
    background:#0a0a0e;border:1px solid var(--border);border-radius:8px;padding:6px 8px;height:220px;
    overflow-y:auto;font-size:9.5px;line-height:1.35;color:#a8adba;font-family:Consolas,monospace;
    word-break:break-word;width:100%;
  }
  #log div{margin-bottom:2px;}
  .hint{font-size:11px;color:var(--dim);min-height:15px;}
  #winOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center;flex-direction:column;z-index:99;}
  #winOverlay h2{font-size:34px;}

  /* Lobby — shown on load so you can choose hotseat (this device) or online (two devices, peer-to-peer
     via WebRTC, no server). Sits above everything else until a choice is made / a room connects. */
  #lobbyOverlay{position:fixed;inset:0;background:rgba(5,5,8,.94);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
  #lobbyOverlay.hidden{display:none;}
  #lobbyBox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px 26px;width:320px;text-align:center;}
  #lobbyBox h2{font-size:15px;margin:0 0 14px;color:#fff;}
  #lobbyHotseatBtn,#lobbyAiBtn,#lobbyHostBtn{width:100%;margin-bottom:8px;}
  .lobbyDivider{font-size:10px;color:var(--dim);margin:12px 0 10px;text-transform:uppercase;letter-spacing:.03em;}
  .lobbyOnlineRow{display:flex;gap:6px;margin-bottom:8px;}
  .lobbyOnlineRow input{flex:1;min-width:0;background:#0a0a0e;border:1px solid var(--border);border-radius:6px;color:#fff;padding:6px 8px;font-size:13px;text-transform:uppercase;}
  #lobbyStatus{font-size:11px;color:var(--gold);min-height:16px;margin-top:6px;line-height:1.4;}

  /* Everything that must always fit on screen without scrolling gets scaled as one unit — see
     fitToViewport() in the script. Anchored top-center so it shrinks toward the top of the page. */
  #fitWrap{ transform-origin: top center; }

  /* Face-down card, used for any hand/deck slot representing an opponent's real card we deliberately
     never receive/render in online mode (keeps hidden information actually hidden, not just UI-hidden). */
  .card.hiddenCard{
    background:repeating-linear-gradient(45deg,#3a3d52,#3a3d52 6px,#2a2c3a 6px,#2a2c3a 12px);
    border-color:#55597a;
  }

  /* Mobile layout — below this width the fixed-width desktop board (6 columns + sidebar, ~1100px
     natural width) can't be scaled down far enough by fitToViewport() to stay readable (its floor
     is 55% scale, and this screen needs closer to 35-40%), so instead of shrinking everything
     uniformly we restack: the sidebar moves above the board at full width, the hand stacks
     vertically, and the row of columns becomes its own horizontally-swipeable strip at full,
     readable card size — the same pattern mobile card-game apps use for a board wider than the
     screen. fitToViewport() detects this breakpoint and skips its scale-transform so this plain
     CSS reflow takes over cleanly instead of the two fighting each other. */
  @media (max-width: 700px){
    body{ padding-bottom:calc(74px + env(safe-area-inset-bottom)); } /* a bit extra in case the HUD wraps to two lines on a narrow screen */
    #pageLayout{ flex-direction:column; gap:8px; }
    #phaseSidebar{ width:100%; position:static; top:auto; }
    #phaseStepsList{ flex-direction:row; flex-wrap:wrap; }
    .phaseStep{ flex:1 1 auto; text-align:center; }
    #log{ height:120px; }
    /* .row/.col scrolling is now handled by the base rule above, not just here */
    #realmZoneWrap{ margin:4px 0; }
    #realmZone{ width:100%; min-width:0; }
    #handRow{ flex-direction:column; align-items:center; gap:8px; }
    #deckDisplayBig{ width:100%; flex-direction:row; justify-content:center; padding:8px; }
    #deckDisplayBig .deckSleeve{ width:70px; height:92px; }
    #handCards{ min-height:0; }
  }
</style>

/* Every box that can hold a card is a size container, so a card can always fill it at the true card shape (795:1144) without stretching. */
.vesselZone,.voidZoneBig,#handCards .cardWrap,#graveyardGrid .gyCardWrap,#cardZoomInner{container-type:size;}
.card.ecard{
  width:min(100cqw, calc(100cqh * 795 / 1144)) !important;height:auto !important;aspect-ratio:795/1144;
  container-type:inline-size;border:none !important;border-radius:2.6cqw;background:transparent;
  padding:0;margin:auto;position:relative;display:block;overflow:visible;flex:none;
  font-family:Georgia,'Times New Roman',serif;color:#1e1812;font-size:12px;
  filter:drop-shadow(0 1px 2px #000a);
}
.card.hiddenCard.ecard{border-radius:3cqw;}
.ecArt{position:absolute;left:12.6%;top:11.4%;width:74.8%;height:44.2%;overflow:hidden;
  display:flex;align-items:center;justify-content:center;background:#3a3a3f;}
.ecArt .ecGlyph{font-size:22cqw;opacity:.22;filter:grayscale(.2);line-height:1;}
.c-Red .ecArt{background:radial-gradient(ellipse at 50% 60%,#6b2a22,#2a1210 75%);}
.c-Green .ecArt{background:radial-gradient(ellipse at 50% 60%,#2c5a34,#10241a 75%);}
.c-Blue .ecArt{background:radial-gradient(ellipse at 50% 60%,#24507a,#0e1f33 75%);}
.c-White .ecArt{background:radial-gradient(ellipse at 50% 60%,#6a6d76,#2a2b31 75%);}
.c-Purple .ecArt{background:radial-gradient(ellipse at 50% 60%,#4c2a70,#1c1030 75%);}
.ecFrame{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none;}
.ecGem{position:absolute;left:6.2%;top:5.97%;width:5.45%;aspect-ratio:1;background-size:100% 100%;border-radius:50%;}
.ecName{position:absolute;left:20.5%;width:59%;top:7.52%;transform:translateY(-50%);text-align:center;
  font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;}
.ecCost{position:absolute;left:90.7%;top:7.52%;transform:translate(-50%,-50%);font-weight:700;font-size:5.6cqw;line-height:1;}
.ecType{position:absolute;left:16.1%;top:58.8%;transform:translateY(-50%);font-weight:700;font-size:4.3cqw;line-height:1;white-space:nowrap;}
.ecText{position:absolute;left:16.1%;width:68.6%;top:67%;height:21.5%;overflow:hidden;line-height:1.18;}
.ecText .ecLine{display:block;}
.ecText .ecBullet{display:block;padding-left:1em;text-indent:-1em;}
.ecText .ecRemind,.ecText .ecFlavour{display:block;font-style:italic;color:#4a3a2a;margin-top:.35em;font-size:.9em;}
.ecText .ecFlavour{display:none;}
#cardZoomInner .ecText .ecFlavour{display:block;}
#cardZoomInner .ecText.hasFlav,#cardHoverPreview .ecText.hasFlav{font-size:4.4cqw !important;}
.ecText .ecFlavour{font-size:.86em !important;}
.ecText .inert{display:block;font-size:.8em;color:#7a6a5a;font-style:italic;}
.ecText .kw{border-bottom:1px dotted #7a5418;}
.ecType .kw{border-bottom:1px dotted #7a5418;}

.card.ecard .tag{top:12.5%;right:14.5%;left:auto;font-family:system-ui,sans-serif;}
.card.ecard .zoomBtn{top:12.5%;left:14%;font-family:system-ui,sans-serif;}
.card.ecard.selected{outline:none;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 7px #fff);}

/* Small cards (board, hand, Void peek): nudge text up a touch so it stays legible; open 🔍 or long-press for the full-size card. */
@container (max-width: 170px){
  .ecText{top:66%;height:23%;}
  .ecType{font-size:4.8cqw;}
  .ecCost,.ecStats{font-size:6.6cqw;}
}

.deckSleeve{border:none !important;box-shadow:0 2px 8px rgba(0,0,0,.5) !important;border-radius:6px !important;width:104px !important;height:150px !important;}
.cardBackMini{border:none !important;border-radius:2px !important;width:12px !important;height:17px !important;}
@media (max-width:700px){
  #deckDisplayBig .deckSleeve{width:64px !important;height:92px !important;}
  /* Phone fix: without this the main column grew to the full 6-column board width (~960px), so the whole
     page scrolled sideways and the hand sat off-screen. Now only the board row swipes, as intended. */
  #mainArea,#battlefield,#handWrap{min-width:0;max-width:100%;}
}
#handCards .cardWrap{width:99px !important;height:142px !important;}
#handCards{min-height:142px !important;}
#cardZoomInner{width:300px !important;height:432px !important;}

#cardHoverPreview{position:fixed;z-index:160;width:270px;height:389px;pointer-events:none;display:none;container-type:size;}
#cardHoverPreview.show{display:block;}
#cardHoverPreview .card.ecard{filter:drop-shadow(0 6px 18px #000c);}
#cardHoverPreview .zoomBtn,#cardHoverPreview .tag{display:none;}
#cardHoverPreview .ecText .ecFlavour{display:block;}

  {name:"The Emberwastes", colour:"Red", cost:2, effect:"All Red Vessels gain +1/+0. All Green Vessels lose -1/-0. (both players)", copies:2},
];

const TIDEWIND_RITES = [
  {name:"Crosswind", colour:"White", cost:1, speed:"Instant", effect:"Target Vessel gets -2/-0 until end of turn.", copies:4},
  {name:"Undertow",  colour:"Blue",  cost:2, speed:"Instant", effect:"Return target Vessel to its owner's hand.", copies:2},
  {name:"Deflect",   colour:"White", cost:2, speed:"Instant", effect:"Change the target of an attack to a different Vessel you control.", copies:2},
  {name:"Foresight", colour:"Blue",  cost:2, speed:"Instant", effect:"Draw a card.", copies:3},
  {name:"Reattune",  colour:"White", cost:2, speed:"Main",    effect:"Change target column's devotion colour (level unchanged).", copies:3},
];
const TIDEWIND_REALMS = [
  {name:"The Stormspire", colour:"Blue", cost:2, effect:"All Blue Vessels gain +1/+0. All White Vessels lose -1/-0. (both players)", copies:2},
];

// --- Card mechanics -------------------------------------------------------------------------------
// Every card's printed effect text is wired up here rather than scattering name checks through the
// combat/placement code. Bastion Warden's printed wording ("Other Green Vessels in this column") hit
// a wall — each column only ever holds one Vessel — so its text was changed to "Adjacent Green Vessels
// gain +0/+2", which the 5-column board can actually support (adjacentAura below). Zephyr Tactician's
// "cannot be targeted by enemy Rites" used to be flagged inert because Rites didn't exist at all; now
// that they do, it's real (protectedFromEnemyRites below) — same one-Vessel-per-column limit as Bastion
// Warden just means it only ever protects itself, never a neighbour.
const CARD_MECHANICS = {
  "Cinder Runner":        { onDestroyInCombat: { damagePlayer: 1 } },
  "Stoneskin Tender":     { onSurviveCombat: { gainLife: 1 } },
  "Flame Zealot":         { trampleToPlayer: true },
  "Magma Drifter":        { onPlay: { damageAnyVessel: 1 } },
  "Wildfire Avatar":      { trampleToPlayer: true, cannotBeBlockedByGrade1: true },
  "Bastion Warden":       { adjacentAura: { colour:"Green", atk:0, def:2 } },
  "Mountainheart Colossus": { globalAura: { colour:"Green", atk:0, def:1 } },
  "Current Adept":        { onPlay: { moveFriendlyAdjacent: true } },
  "Whisperwind Page":     { onPlay: { debuffTargetVessel: { atk:-1, def:0 } } },
  "Riptide Caller":       { onPlay: { drawThenDiscard: true } },
  "Zephyr Tactician":     { riteShieldOnPlay: true },
  "Stormcrown Avatar":    { onPlay: { stunTargetVessel: true } },
  "Abyssal Leviathan":    { onPlay: { bounceTargetEnemyVessel: true } },
  // Rites — cast from hand, resolve once, go to the Void. riteEffect keys reuse the same vocabulary as
  // Vessel onPlay effects wherever the shape matches, so they resolve through the same target-picking
  // machinery (startOnPlayEffect / resolvePendingEffectZoneClick).
  "Searing Strike": { riteEffect: { debuffTargetVessel: { atk:2, def:0 } } },
  "Molten Burst":   { riteEffect: { damageAnyVessel: 2 } },
  // "Prevent the next 3 damage" has no damage-accumulation model to hook into here (combat is an
  // instant ATK-vs-DEF comparison, not a running damage total) — simplified to the defensive-equivalent
  // +0/+3 until end of turn, same mechanism as every other temporary buff/debuff in this build.
  "Bulwark":        { riteEffect: { debuffTargetVessel: { atk:0, def:3 } } },
  "Second Wind":    { riteEffect: { returnGrade1FromVoid: true } },
  "Overgrowth":     { riteEffect: { permBuffTargetVessel: { atk:0, def:3 } } },
  "Crosswind":      { riteEffect: { debuffTargetVessel: { atk:-2, def:0 } } },
  "Undertow":       { riteEffect: { bounceAnyVessel: true } },
  "Deflect":        { riteEffect: { redirectAttack: true } }, // not cast normally — see resolveAttack()/offerDeflect()
  "Foresight":      { riteEffect: { drawCard: true } },
  "Reattune":       { riteEffect: { reattuneColumn: true } },
  // Realms — one shared zone, only one active at a time (see playRealm()). "Both players" is literal:
  // the aura applies by Vessel colour regardless of who controls the Vessel.
  "The Emberwastes": { realmAura: { buffColour:"Red",  buffMod:{atk:1,def:0}, debuffColour:"Green", debuffMod:{atk:-1,def:0} } },
  "The Stormspire":  { realmAura: { buffColour:"Blue", buffMod:{atk:1,def:0}, debuffColour:"White", debuffMod:{atk:-1,def:0} } },
};
function mech(cardName){ return CARD_MECHANICS[cardName] || {}; }
// Nothing is flagged mechanically inert any more — Bastion Warden and Zephyr Tactician (the two
// previously-flagged cards) both got real implementations above once the board model / Rites existed
// to support them.
function isMechanicallyInert(name){ return false; }

// A Vessel's live ATK/DEF after auras (column/adjacent/global/realm) and temporary "until end of turn"
// / permanent (Overgrowth) modifiers all apply. Used for both display (renderCard) and combat/damage
// math, so the numbers on screen always match what actually happens. Breakthrough (Wildfire Avatar, Flame
// Zealot) isn't applied here either — it doesn't change either Vessel's stats, it's a separate
// excess-damage-to-player step that runs after combat is resolved (see executeAttack).
function getEffectiveStats(playerIdx, colIdx){
  const p = state.players[playerIdx];
  const v = p.front[colIdx];
  if(!v) return null;
  let atk = v.atk, def = v.def;
  p.front.forEach((other,i)=>{
    if(!other) return;
    const m = mech(other.name);
    if(m.columnAura && other!==v && i===colIdx && v.colour===m.columnAura.colour){
      atk += m.columnAura.atk||0; def += m.columnAura.def||0;
    }
    if(m.adjacentAura && other!==v && Math.abs(i-colIdx)===1 && v.colour===m.adjacentAura.colour){
      atk += m.adjacentAura.atk||0; def += m.adjacentAura.def||0;
    }
    if(m.globalAura && v.colour===m.globalAura.colour){
      atk += m.globalAura.atk||0; def += m.globalAura.def||0;
    }
  });
  if(state.realm){
    const ra = mech(state.realm.name).realmAura;
    if(ra){
      if(v.colour===ra.buffColour){ atk += ra.buffMod.atk||0; def += ra.buffMod.def||0; }
      if(v.colour===ra.debuffColour){ atk += ra.debuffMod.atk||0; def += ra.debuffMod.def||0; }
    }
  }
  atk += v.tempAtkMod||0; def += v.tempDefMod||0;
  atk += v.permAtkMod||0; def += v.permDefMod||0;
  return { atk: Math.max(0,atk), def: Math.max(0,def) };
}

// Zephyr Tactician: "Friendly Vessels in this column cannot be targeted by enemy Rites." Only ever
// protects itself under this board model (see the CARD_MECHANICS note above).
function isProtectedFromEnemyRite(zonePlayerIdx, colIdx, casterIdx){
  const v = state.players[zonePlayerIdx].front[colIdx];
  // Zephyr Tactician: shielded from enemy Rites from the moment it's played until its owner's next turn starts.
  return !!(v && v.riteShielded && zonePlayerIdx!==casterIdx);
}

// Non-combat "deal N to a Vessel" (Magma Drifter). This prototype has no persistent damage-counter
// system — combat resolves instantly by comparing ATK to DEF — so a ping like this destroys the
// target only if the damage meets or exceeds its current effective DEF; anything it doesn't kill has
// no lasting mark, same as the rest of the game's combat model.
function damageVessel(playerIdx, colIdx, amount, sourceName){
  const p = state.players[playerIdx];
  const v = p.front[colIdx];
  if(!v) return;
  const eff = getEffectiveStats(playerIdx, colIdx);
  if(amount >= eff.def){
    const fromRect = captureCardRect(v.id); // the caller (resolvePendingEffectZoneClick) calls render() right after this returns, synchronously — by the time this rAF fires, the new top-of-Void cardEl already exists
    p.front[colIdx] = null;
    p.void.push(v);
    playSfx('discard');
    log(`${sourceName} deals ${amount} to ${v.name} (DEF ${eff.def}) — destroyed, sent to the Void.`);
    if(fromRect){
      if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>animateCardFlip(v.id, fromRect, {fade:true}));
      else animateCardFlip(v.id, fromRect, {fade:true});
    }
  } else {
    log(`${sourceName} deals ${amount} to ${v.name} (DEF ${eff.def}) — not enough to destroy it.`);
  }
}

function drawCardEffect(playerIdx, sourceName){
  const p = state.players[playerIdx];
  if(p.deck.length===0){ log(`${sourceName}: no cards left in ${p.name}'s deck to draw.`); return false; }
  const card = p.deck.pop();
  p.hand.push(card);
  log(`${sourceName}: ${p.name} draws ${card.name}.`);
  playSfx('draw'); // effect draws (Riptide Caller, Foresight) sound the same as a Draw Phase draw
  return true;
}

// Kicks off an on-play effect right after a Vessel is placed. Effects that need the player to pick a
// target set state.pendingEffect and wait for a follow-up click (see resolvePendingEffectZoneClick /
// resolvePendingDiscard); effects with nothing to target resolve immediately.
function startOnPlayEffect(onPlay, playerIdx, colIdx, sourceName, fromRite){
  if(onPlay.damageAnyVessel){
    state.pendingEffect = { kind:'damageAnyVessel', amount:onPlay.damageAnyVessel, sourceName, playerIdx, fromRite };
  } else if(onPlay.debuffTargetVessel){
    state.pendingEffect = { kind:'debuffTargetVessel', atk:onPlay.debuffTargetVessel.atk||0, def:onPlay.debuffTargetVessel.def||0, sourceName, playerIdx, fromRite };
  } else if(onPlay.stunTargetVessel){
    state.pendingEffect = { kind:'stunTargetVessel', sourceName, playerIdx, fromRite };
  } else if(onPlay.bounceTargetEnemyVessel){
    state.pendingEffect = { kind:'bounceTargetEnemyVessel', sourceName, playerIdx, fromRite };
  } else if(onPlay.bounceAnyVessel){
    state.pendingEffect = { kind:'bounceAnyVessel', sourceName, playerIdx, fromRite };
  } else if(onPlay.permBuffTargetVessel){
    state.pendingEffect = { kind:'permBuffTargetVessel', atk:onPlay.permBuffTargetVessel.atk||0, def:onPlay.permBuffTargetVessel.def||0, sourceName, playerIdx, fromRite };
  } else if(onPlay.reattuneColumn){
    state.pendingEffect = { kind:'reattuneColumn', stage:'selectColour', sourceName, playerIdx, fromRite };
  } else if(onPlay.returnGrade1FromVoid){
    const p = state.players[playerIdx];
    if(!p.void.some(c=>c.type==='Vessel' && c.grade===1)){
      log(`${sourceName}: no Grade 1 Vessel in ${p.name}'s Void to return.`);
    } else {
      state.pendingEffect = { kind:'returnFromVoid', sourceName, playerIdx, fromRite };
    }
  } else if(onPlay.drawCard){
    drawCardEffect(playerIdx, sourceName);
  } else if(onPlay.moveFriendlyAdjacent){
    state.pendingEffect = { kind:'moveFriendlyAdjacent', stage:'selectSource', sourceName, playerIdx, optional:true, fromRite };
  } else if(onPlay.drawThenDiscard){
    const drew = drawCardEffect(playerIdx, sourceName);
    if(drew){ state.pendingEffect = { kind:'discardFromEffect', sourceName, playerIdx, fromRite }; }
  }
  render();
}

// Resolves a pending on-play effect that targets a board zone (all of them except the discard/void
// steps, which target a hand or Void card instead — see resolvePendingDiscard/voidCardClick). Called
// from zoneClick() before any of the normal phase-based handling, so a pending effect always takes
// priority over everything else. Zephyr Tactician's "cannot be targeted by enemy Rites" is enforced
// here uniformly for every Rite-originated, single-Vessel-targeting kind.
function resolvePendingEffectZoneClick(playerIdx, colIdx){
  const pe = state.pendingEffect;
  if(!pe) return;
  const p = state.players[playerIdx];
  const v = p.front[colIdx];
  const riteBlocked = pe.fromRite && isProtectedFromEnemyRite(playerIdx, colIdx, pe.playerIdx);

  if(pe.kind==='damageAnyVessel'){
    if(!v || riteBlocked) return;
    damageVessel(playerIdx, colIdx, pe.amount, pe.sourceName);
    state.pendingEffect = null; render(); return;
  }
  if(pe.kind==='debuffTargetVessel'){
    if(!v || riteBlocked) return;
    v.tempAtkMod = (v.tempAtkMod||0) + pe.atk;
    v.tempDefMod = (v.tempDefMod||0) + pe.def;
    log(`${pe.sourceName}: ${v.name} gets ${pe.atk>=0?'+':''}${pe.atk}/${pe.def>=0?'+':''}${pe.def} until end of turn.`);
    state.pendingEffect = null; render(); return;
  }
  if(pe.kind==='permBuffTargetVessel'){
    if(!v || riteBlocked) return;
    v.permAtkMod = (v.permAtkMod||0) + pe.atk;
    v.permDefMod = (v.permDefMod||0) + pe.def;
    log(`${pe.sourceName}: ${v.name} permanently gets ${pe.atk>=0?'+':''}${pe.atk}/${pe.def>=0?'+':''}${pe.def}.`);
    state.pendingEffect = null; render(); return;
  }
  if(pe.kind==='stunTargetVessel'){
    if(!v || riteBlocked) return;
    v.stunTurns = (v.stunTurns||0) + 1;
    log(`${pe.sourceName}: ${v.name} cannot attack next turn.`);
    state.pendingEffect = null; render(); return;
  }
  if(pe.kind==='bounceTargetEnemyVessel'){
    if(!v || playerIdx===pe.playerIdx || riteBlocked) return; // must be an ENEMY Vessel
    const fromRect = captureCardRect(v.id);
    p.front[colIdx] = null;
    p.hand.push({ id:v.id, type:'Vessel', name:v.name, colour:v.colour, grade:v.grade, atk:v.atk, def:v.def, effect:v.effect });
    playSfx('discard');
    log(`${pe.sourceName}: ${v.name} is returned to ${p.name}'s hand.`);
    state.pendingEffect = null; render();
    if(fromRect){
      if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>animateCardFlip(v.id, fromRect));
      else animateCardFlip(v.id, fromRect);
    }
    return;
  }
  if(pe.kind==='bounceAnyVessel'){
    if(!v || riteBlocked) return;
    const fromRect = captureCardRect(v.id);
    p.front[colIdx] = null;
    p.hand.push({ id:v.id, type:'Vessel', name:v.name, colour:v.colour, grade:v.grade, atk:v.atk, def:v.def, effect:v.effect });
    playSfx('discard');
    log(`${pe.sourceName}: ${v.name} is returned to ${p.name}'s hand.`);
    state.pendingEffect = null; render();
    if(fromRect){
      if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>animateCardFlip(v.id, fromRect));
      else animateCardFlip(v.id, fromRect);
    }
    return;
  }
  if(pe.kind==='reattuneColumn'){
    if(playerIdx!==pe.playerIdx || pe.stage!=='selectColumn') return; // colour is picked via the sidebar panel, not a zone click
    const col = p.columns[colIdx];
    if(!col.colour) return; // must already be attuned to something
    const oldColour = col.colour;
    col.colour = pe.selectedColour;
    log(`${pe.sourceName}: column ${colIdx+1} changed from ${oldColour} to ${pe.selectedColour} (grade unchanged).`);
    state.pendingEffect = null; render(); return;
  }
  if(pe.kind==='redirectAttack'){
    if(playerIdx!==pe.playerIdx || !v) return;
    const pa = state.pendingAttack;
    if(!pa || colIdx===pa.targetColIdx) return; // must be a DIFFERENT Vessel
    const attacker = state.players[state.current].front[pa.attackerColIdx];
    if(attacker && mech(attacker.name).cannotBeBlockedByGrade1 && v.grade===1) return;
    pa.targetColIdx = colIdx;
    state.pendingEffect = null;
    log(`Deflect redirects the attack onto ${v.name}.`);
    state.pendingAttack = null;
    executeAttack(pa.targetColIdx, false);
    return;
  }
  if(pe.kind==='moveFriendlyAdjacent'){
    if(playerIdx!==pe.playerIdx) return; // only your own board
    if(pe.stage==='selectSource'){
      if(!v) return;
      const hasEmptyNeighbour = (colIdx>0 && !p.front[colIdx-1]) || (colIdx<4 && !p.front[colIdx+1]);
      if(!hasEmptyNeighbour){ log(`${pe.sourceName}: ${v.name} has no empty adjacent column to move into.`); return; }
      pe.stage = 'selectDest'; pe.moveSourceColIdx = colIdx; render(); return;
    }
    if(pe.stage==='selectDest'){
      const src = pe.moveSourceColIdx;
      if(Math.abs(colIdx-src)!==1 || p.front[colIdx]) return; // must be adjacent and empty
      p.front[colIdx] = p.front[src]; p.front[src] = null;
      log(`${pe.sourceName}: moved ${p.front[colIdx].name} from column ${src+1} to column ${colIdx+1}.`);
      state.pendingEffect = null; render(); return;
    }
  }
}

// Second Wind's "return a Grade 1 Vessel from your Void to your hand" targets a Void card, not a board
// zone, so it gets its own click handler (wired from the Void list instead of zoneClick).
// Shared by two callers: the "already cast, pendingEffect is live" path (kept for the redirectAttack-
// style flow), and the new "select then click the Void target" path in voidCardClick below, which pays
// the cost and resolves in the same click — same validate-before-spending pattern as castRiteAtZone.
function resolveReturnFromVoid(playerIdx, cardId){
  const pe = state.pendingEffect;
  if(!pe || pe.kind!=='returnFromVoid' || pe.playerIdx!==playerIdx) return false;
  const p = state.players[playerIdx];
  const idx = p.void.findIndex(c=>c.id===cardId);
  if(idx<0) return false;
  const card = p.void[idx];
  if(!(card.type==='Vessel' && card.grade===1)) return false; // only Grade 1 Vessels are eligible
  p.void.splice(idx,1);
  p.hand.push(card);
  log(`${pe.sourceName}: ${card.name} returned from ${p.name}'s Void to hand.`);
  state.pendingEffect = null;
  return true;
}

function voidCardClick(playerIdx, cardId){
  if(state.pendingPhaseWarning) return;
  if(resolveReturnFromVoid(playerIdx, cardId)){ render(); return; }
  // Casting Second Wind: it must be selected first (one click, like every other Rite), then clicking
  // an eligible Grade 1 Vessel in your own Void pays the cost and resolves the return in the same
  // click. If the clicked card isn't a legal target, nothing is spent — it just falls through to the
  // normal zoom-in preview below.
  if(isMyActionableTurn() && playerIdx===state.current && state.selectedCardId!=null && !state.pendingEffect && !state.pendingAttack){
    const p = cur();
    const selCard = p.hand.find(c=>c.id===state.selectedCardId);
    if(selCard && selCard.type==='Rite'){
      const m = mech(selCard.name);
      if(m.riteEffect && m.riteEffect.returnGrade1FromVoid && canPlayCard(state.current, selCard)){
        const target = p.void.find(c=>c.id===cardId);
        if(target && target.type==='Vessel' && target.grade===1){
          castSpellCard(selCard.id); // pays cost, moves Second Wind to Void, sets state.pendingEffect
          resolveReturnFromVoid(state.current, cardId); // resolve immediately against the already-validated target
          render();
          return;
        }
      }
    }
  }
  zoomCard(cardId);
}

// Reattune's colour choice comes from the sidebar panel (selectReattuneColour), not a zone click —
// this just advances the pendingEffect to its column-targeting stage.
function selectReattuneColour(colour){
  const pe = state.pendingEffect;
  if(!pe || pe.kind!=='reattuneColumn' || pe.stage!=='selectColour') return;
  pe.selectedColour = colour;
  pe.stage = 'selectColumn';
  render();
}

// Reattune's NEW pre-payment flow: the card is selected first (like every other Rite), the colour is
// picked here in the sidebar with nothing spent yet, and only the follow-up column click (see
// castReattuneAtColumn, wired from zoneClick) actually pays the cost and applies the change.
function selectReattuneStagingColour(colour){
  if(!isMyActionableTurn()) return;
  const p = cur();
  const card = p.hand.find(c=>c.id===state.selectedCardId);
  if(!card || card.name!=='Reattune') return;
  state.reattuneStaging = { cardId: card.id, colour };
  render();
}

// Pays Reattune's cost and applies the reattune in one atomic step, once both the colour (sidebar) and
// the target column (board click) are known. Bypasses the pendingEffect machinery entirely — there's
// nothing left to ask the player once we reach this point.
function castReattuneAtColumn(cardId, colIdx){
  const p = cur();
  const card = p.hand.find(c=>c.id===cardId);
  if(!card) return false;
  if(!canPlayCard(state.current, card)) return false;
  const colour = state.reattuneStaging && state.reattuneStaging.colour;
  if(!colour) return false;
  const col = p.columns[colIdx];
  if(!col.colour) return false; // must already be attuned to something
  const oldColour = col.colour;
  const iAmActing = net.isOnline && net.connected && net.mySeat===state.current;
  const fromRect = captureCardRect(card.id);
  p.essence -= card.cost;
  flashEssenceSpend(state.current);
  p.hand = p.hand.filter(c=>c.id!==card.id);
  p.void.push(card);
  state.selectedCardId = null;
  state.reattuneStaging = null;
  col.colour = colour;
  log(`${p.name} casts ${card.name} (${card.colour}, ${card.cost} Attune): column ${colIdx+1} changed from ${oldColour} to ${colour} (grade unchanged).`);
  if(iAmActing) net.sendAction({type:'castSpell', cardId: card.id});
  render();
  if(fromRect){
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>animateCardFlip(card.id, fromRect, {fade:true}));
    else animateCardFlip(card.id, fromRect, {fade:true});
  }
  return true;
}

function resolvePendingDiscard(cardId){
  const pe = state.pendingEffect;
  const p = state.players[pe.playerIdx];
  const card = p.hand.find(c=>c.id===cardId);
  if(!card) return;
  const fromRect = captureCardRect(cardId);
  p.hand = p.hand.filter(c=>c.id!==cardId);
  p.void.push(card);
  playSfx('discard');
  log(`${pe.sourceName}: ${p.name} discards ${card.name} — sent to the Void.`);
  state.pendingEffect = null; render();
  if(fromRect){
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>animateCardFlip(cardId, fromRect, {fade:true}));
    else animateCardFlip(cardId, fromRect, {fade:true});
  }
}

function skipPendingEffect(){
  const pe = state.pendingEffect;
  if(!pe || !pe.optional) return;
  log(`${pe.sourceName}: effect declined.`);
  state.pendingEffect = null; render();
}

// "Until end of turn" modifiers (Whisperwind Page) shouldn't outlive the turn they were applied on —
// clearing them at the top of every startTurn(), for either player, guarantees that regardless of
// whose turn it currently is.
function clearEndOfTurnEffects(){
  state.players.forEach(p=>{ p.front.forEach(v=>{ if(v){ v.tempAtkMod=0; v.tempDefMod=0; } }); });
}

let globalUid = 0;
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function buildDeck(deckList){
  let deck = [];
  for(const card of deckList){
    for(let i=0;i<card.copies;i++){
      const inst = {id: globalUid++, type:card.type, name:card.name, colour:card.colour, effect:card.effect};
      if(card.type==='Vessel'){ inst.grade=card.grade; inst.atk=card.atk; inst.def=card.def; }
      else { inst.cost=card.cost; if(card.type==='Rite') inst.speed=card.speed; }
      deck.push(inst);
    }
  }
  return shuffle(deck);
}

function newPlayer(name, vesselList, riteList, realmList, isStartingPlayer){
  const deckColours = [...new Set(vesselList.map(c=>c.colour))];
  const fullList = [
    ...vesselList.map(c=>({...c, type:'Vessel'})),
    ...riteList.map(c=>({...c, type:'Rite'})),
    ...realmList.map(c=>({...c, type:'Realm'})),
  ];
  const deck = buildDeck(fullList); // 24 Vessels + 14 Rites + 2 Realms = 40, the canonical structure-deck size
  const hand = deck.splice(0,5); // Opening Hand: 5 cards
  return {
    // devotion/devotionTotal: spent ONLY on attuning columns (permanent, grade-based). essence/essenceTotal:
    // a completely separate per-turn pool spent ONLY on casting Rites/Realms (and paying Deflect) — the two
    // never share a number, so spending your whole devotion pool attuning never touches what you have to cast with.

// Persisted via localStorage so the mute choice survives a reload; falls back to enabled if storage
// is unavailable (private browsing, etc.) or holds anything other than the literal string "off".
const sfxEnabled = { value: (()=>{ try{ return localStorage.getItem('enscraSfxOff')!=='1'; }catch(e){ return true; } })() };
function toggleSfx(){
  sfxEnabled.value = !sfxEnabled.value;
  try{ localStorage.setItem('enscraSfxOff', sfxEnabled.value ? '0' : '1'); }catch(e){}
  const btn = document.getElementById('sfxToggleBtn');
  if(btn) btn.textContent = sfxEnabled.value ? '🔊 Sound' : '🔇 Sound';
  if(sfxEnabled.value) playSfx('draw'); // quick audible confirmation that sound is back on
}

// First-launch (and reopenable) Devotion/Essence teaching overlay. Persisted the same way as the
// sound-mute choice (localStorage, falls back to "show it" if storage is unavailable) so it's shown
// automatically exactly once per device, but the ❓ "How to Play" button can always reopen it later.
// Kept as a harmless no-op (the overlay it used to hide no longer exists) purely so nothing that
// still calls it as a "dismiss onboarding first" step breaks.
function hideEconomyOverlay(){
  const el = document.getElementById('economyOverlay');
  if(el) el.classList.remove('open');
}

// --- Guided first-turn walkthrough --------------------------------------------------------------
// Replaces the old single "wall of text" overlay (Devotion + Essence explained together in one big
// modal) with a short sequence of small tooltips, each anchored right next to the actual UI element
// it's talking about, shown one at a time in the order a first turn naturally reaches them.
// Each step is gated to its phase AND has its own resolve() that returns either the {anchor, text}
// to show right now, or null if the step doesn't actually apply yet (wrong phase, nothing to point
// at, or — for the action-prompting steps — nothing the player can actually do: e.g. no affordable
// card, no eligible attacker). renderTurnGuide() skips forward past any step whose resolve() comes
// back null, so a prompt is never shown for an action that isn't currently possible.
const TURN_GUIDE_STEPS = [
  { phase:'Devotion',
    resolve(){
      const el = document.querySelector('#devotionPicker');
      if(!el) return null;
      return { anchor: el, text:'Pick a colour, then click one of your columns below to devote it. This is <b>Devotion</b> — it refreshes every turn and readies columns for the Vessels you want to play.' };
    } },
  { phase:'Main1',
    resolve(){
      const el = document.querySelector('.board#board-0 .essenceBadge');
      if(!el) return null;
      return { anchor: el, text:'<b>Attune</b> pays for actually playing a card — a Vessel costs Attune equal to its Grade, and a Rite or Realm costs the number printed on it. It never touches Devotion, and vice versa.' };
    } },
  { phase:'Main1',
    // Points at a real card you can actually afford right now, reading its cost/Attack/Defense off
    // the card itself, so those numbers click with something concrete instead of staying abstract.
    // Falls back to a generic "click a card" tip if nothing affordable happens to be a Vessel, and
    // skips entirely (resolve() -> null) if nothing in hand is playable at all this turn.
    resolve(){
      const p = state.players[0];
      const playableVessel = p.hand.find(c => c.type==='Vessel' && canPlayCard(0, c));
      if(playableVessel){
        const el = document.getElementById('cardEl-'+playableVessel.id);
        if(el){
          return { anchor: el,
            text:`The number top-right is <b>${playableVessel.name}</b>'s cost — pay <b>${playableVessel.grade} Attune</b> to play it, into a column already devoted to ${playableVessel.colour} Grade ${playableVessel.grade}+. The numbers at the bottom (<b>${playableVessel.atk} / ${playableVessel.def}</b>) are Attack and Defense — Attack is the damage it deals attacking, Defense is how much it can take before it dies.` };
        }
      }
      if(!hasAnyPlayableHandCard(0)) return null; // nothing playable this turn — nothing to point at
      const el = document.querySelector('#handCards');
      if(!el) return null;
      return { anchor: el, text:'Click a card in your hand you can afford, then click a glowing column of the matching colour and Grade to play it.' };
    } },
  { phase:'Battle',
    // Unlike the other action-prompting steps, this one always shows rather than skipping when there's
    // nothing to attack with — which on an actual turn 1 is EVERY time (any Vessel just played has
    // summoning sickness, see p.front[..].sick in placeSelected, so nothing can attack the turn it's
    // played). Skipping outright like the card/attacker gating elsewhere would mean the lesson on how
    // combat works could never show up on a real first turn at all. So it still teaches Attack/Defense
    // either way, but only tells the player to click something when that's actually possible right now.
    resolve(){
      const el = document.querySelector('#battlefield');
      if(!el) return null;
      const combatRule = 'Higher Attack than their Defense destroys it; if your Defense is lower than their Attack, yours dies instead.';
      if(hasAnyEligibleAttacker(0)){
        return { anchor: el, text:`Click one of your Vessels to attack with it, then click an enemy Vessel (or their face, if their front row is empty) to hit them. ${combatRule}` };
      }
      return { anchor: el, text:`Nothing can attack this turn — a Vessel can't attack the same turn it's played. ${combatRule} Click Next Phase to continue; you'll be able to attack starting next turn.` };
    } },
  { phase:'End',
    resolve(){
      const el = document.querySelector('#nextPhaseBtn');
      if(!el) return null;
      return { anchor: el, text:"That's a full turn! Discard down to 6 cards if you're over the limit, then click here to end your turn." };
    } },
];
let turnGuideActive = false;
let turnGuideStepIdx = 0;
let turnGuideHighlightEl = null; // the element currently wearing .turnGuideHighlight, so render can clear it

function maybeStartTurnGuideOnFirstLaunch(){
  let seen = false;
  try{ seen = localStorage.getItem('enscraSeenTurnGuide')==='1'; }catch(e){}
  if(seen) return;
  turnGuideActive = true;
  turnGuideStepIdx = 0;
}
function restartTurnGuide(){
  turnGuideActive = true;
  turnGuideStepIdx = 0;
  renderTurnGuide();
}
function dismissTurnGuideStep(){
  turnGuideStepIdx += 1;
  renderTurnGuide();
}
function endTurnGuide(){
  turnGuideActive = false;
  if(turnGuideHighlightEl){ turnGuideHighlightEl.classList.remove('turnGuideHighlight'); turnGuideHighlightEl = null; }
  const el = document.getElementById('turnGuideTip');
  if(el) el.classList.remove('open');
  try{ localStorage.setItem('enscraSeenTurnGuide', '1'); }catch(e){}
}
// Rebuilds/repositions the tutorial tooltip from scratch on every render() — exactly like
// renderDeflectPrompt()/renderRiteOfferPrompt() do for their own always-recomputed overlays — so it
// naturally tracks whatever phase the player is actually in without needing its own event wiring.
function renderTurnGuide(){
  const el = document.getElementById('turnGuideTip');
  if(!el) return;
  if(turnGuideHighlightEl){ turnGuideHighlightEl.classList.remove('turnGuideHighlight'); turnGuideHighlightEl = null; }
  if(!turnGuideActive){ el.classList.remove('open'); return; }
  // Only ever during the human's (seat 0, "Emberroot") very first turn — a one-time walkthrough, not
  // a recurring feature of every turn.
  if(state.current!==0 || state.players[0].turnCount!==1 || !isMyActionableTurn()){ el.classList.remove('open'); return; }
  if(typeof document.querySelector !== 'function'){ el.classList.remove('open'); return; } // test harness stub — no real DOM to query/highlight
  const phase = PHASES[state.phaseIdx];
  // Walk forward through steps: skip any whose phase the player has already moved past (e.g. they
  // clicked Next Phase before dismissing a tip), and skip any whose resolve() says it doesn't apply
  // right now — either its phase hasn't arrived yet, or (for the action-prompting steps) there's
  // nothing to point at this turn, e.g. no affordable card or no eligible attacker. Either way the
  // guide only ever narrates something the player can actually do right now, never blocks real play.
  let resolved = null;
  while(turnGuideStepIdx < TURN_GUIDE_STEPS.length){
    const step = TURN_GUIDE_STEPS[turnGuideStepIdx];
    if(PHASES.indexOf(step.phase) < PHASES.indexOf(phase)){ turnGuideStepIdx += 1; continue; }
    if(step.phase !== phase) break; // this step's moment hasn't arrived yet — wait for it, don't skip it
    resolved = step.resolve();
    if(resolved) break;
    turnGuideStepIdx += 1; // this step's phase is here, but it doesn't apply right now — move on
  }
  if(turnGuideStepIdx >= TURN_GUIDE_STEPS.length){ endTurnGuide(); return; }
  if(!resolved){ el.classList.remove('open'); return; } // next applicable step's phase hasn't arrived yet
  const anchor = resolved.anchor;

  const isLast = turnGuideStepIdx === TURN_GUIDE_STEPS.length-1;
  el.innerHTML = `<div class="tgStep">Step ${turnGuideStepIdx+1} of ${TURN_GUIDE_STEPS.length}</div>
    <div class="tgText">${resolved.text}</div>
    <div class="tgButtons">
      <button class="tgSkip" onclick="endTurnGuide()">Skip</button>
      <button class="primary" onclick="dismissTurnGuideStep()">${isLast?'Got it':'Got it →'}</button>
    </div>`;
  el.classList.add('open');
  anchor.classList.add('turnGuideHighlight');
  turnGuideHighlightEl = anchor;

  if(typeof window!=='object' || typeof window.innerWidth!=='number') return; // test harness — no real layout to position against
  const rect = anchor.getBoundingClientRect();
  const tipWidth = el.offsetWidth || 270;
  let left = rect.left + rect.width/2 - tipWidth/2;
  left = Math.max(8, Math.min(left, window.innerWidth - tipWidth - 8));
  let top = rect.bottom + 10;
  const tipHeight = el.offsetHeight || 120;
  if(top + tipHeight > window.innerHeight - 8) top = Math.max(8, rect.top - tipHeight - 10); // flip above if no room below
  el.style.left = left + 'px';
  el.style.top = top + 'px';
}

// Phones only let a page make sound from INSIDE a tap, and iPhones also block each brand-new <audio>
// element that wasn't started by a tap. Most game sounds fire outside a tap (the AI's turn, phase
// changes, combat after an animation), so the old `new Audio().play()` was silently refused on phones.
// Fix: one Web Audio context, switched on by the player's first tap, with every clip decoded once into
// memory. After that any sound can play at any time, instantly, on phone and desktop alike.
const sfxAudio = { ctx:null, buffers:{}, gain:null, decoding:false };
function sfxDataUriToArrayBuffer(uri){
  const b64 = uri.slice(uri.indexOf(',')+1);
  const bin = atob(b64); const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}
function unlockSfxAudio(){
  try{
    // iPhone: treat game sound as media playback, so it isn't muted by the ring/silent switch
    if(navigator.audioSession && navigator.audioSession.type!=='playback') navigator.audioSession.type = 'playback';
  }catch(e){}
  try{
    if(!sfxAudio.ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      sfxAudio.ctx = new AC();
      sfxAudio.gain = sfxAudio.ctx.createGain(); sfxAudio.gain.gain.value = 0.55; sfxAudio.gain.connect(sfxAudio.ctx.destination);
    }
    const ctx = sfxAudio.ctx;
    if(ctx.state!=='running' && ctx.resume) ctx.resume();
    // play one silent sample inside the tap — older iPhones need this to fully unlock
    const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1,1,22050); s.connect(ctx.destination); s.start(0);
    if(!sfxAudio.decoding){
      sfxAudio.decoding = true;
      for(const [name, uri] of Object.entries(SFX_SOURCES)){
        const data = sfxDataUriToArrayBuffer(uri);
        const done = b => { sfxAudio.buffers[name] = b; };
        const p = ctx.decodeAudioData(data, done, ()=>{}); // callback form for older Safari
        if(p && typeof p.then==='function') p.then(done).catch(()=>{});
      }
    }
  }catch(e){ /* sound must never break the game */ }
}
// Re-run on every tap/click/key (cheap once unlocked) — phones suspend audio when the tab is backgrounded
['touchend','pointerdown','mousedown','keydown'].forEach(ev => document.addEventListener(ev, unlockSfxAudio, {capture:true, passive:true}));
function playSfx(name){
  if(!sfxEnabled.value) return;
  const src = SFX_SOURCES[name];
  if(!src) return;
  try{
    const ctx = sfxAudio.ctx, buf = sfxAudio.buffers[name];
    if(ctx && buf){
      if(ctx.state!=='running' && ctx.resume) ctx.resume();
      const s = ctx.createBufferSource(); s.buffer = buf; s.connect(sfxAudio.gain); s.start(0);
      return;
    }
    // Not unlocked yet (no tap so far) — fall back to the old way, which works on desktop
    const a = new Audio(src);
    a.volume = 0.55;
    const p = a.play();
    if(p && typeof p.catch==='function') p.catch(()=>{});
  }catch(e){ /* a sound failure must never break the game */ }
}

let state = {
  players:[
    newPlayer("Player 1 — Emberroot (Red/Green)", EMBERROOT_VESSELS, EMBERROOT_RITES, EMBERROOT_REALMS, true),
    newPlayer("Player 2 — Tidewind (White/Blue)", TIDEWIND_VESSELS, TIDEWIND_RITES, TIDEWIND_REALMS, false)
  ],
  current: 0,
  phaseIdx: 0,
  selectedCardId: null,
  selectedAttackerZone: null,
  selectedAttuneColour: null,
  gameOver:false,
  pendingEffect: null, // a card's on-play effect awaiting a target click — see startOnPlayEffect()
  pendingAttack: null, // an attack staged awaiting the defender's Deflect decision — see resolveAttack()
  pendingRiteOffer: null, // { targetColIdx, directPlayer, attackerColIdx, accepted } — attacker offered a chance to cast an Instant Rite before the attack resolves — see resolveAttack()/offerRiteBeforeAttack()
  pendingPhaseWarning: null, // truthy while "you still have a playable card — advance anyway?" is showing — see requestNextPhase()/confirmAdvancePhaseAnyway()
  attuneFlash: null, // {playerIdx, colIdx} for exactly one render() after attuneColumn() — see flashAttune()/renderBoard()
  essenceFlash: null, // {playerIdx} for exactly one render() after essence is spent — see flashEssenceSpend()/renderBoard()
  realm: null, // the one shared active Realm card, if any — see playRealm()
  reattuneStaging: null, // { cardId, colour } — Reattune's colour choice, picked BEFORE any cost is paid (see selectReattuneStagingColour)
};

// --- Online multiplayer (Trystero, peer-to-peer, no server) ---------------------------------------
// Default is hotseat (net.isOnline=false) — everything below is inert until the lobby starts a room.
// When online, the OPPONENT's hand/deck in `state` are replaced with placeholder objects (maskOpponent)
// so this device's memory never actually holds the opponent's real cards — not just UI-hidden.
let net = { isOnline:false, connected:false, mySeat:0, room:null, sendAction:null };

// --- AI opponent (heuristic, non-ML, hotseat-only) -------------------------------------------------
// ai.active is false until "Play vs AI" is chosen from the lobby. ai.seat is fixed to Tidewind (seat
// 1) — the human always plays Emberroot (seat 0) in this build. Who takes the FIRST turn is decided
// by a d6 roll (see rollForStartingPlayer), independent of which deck each side plays.
let ai = { active:false, seat:1 };
function aiOpponentActive(){ return ai.active; }
let aiTimer = null;

let phUid = -1;
function placeholderCard(){
  return {id: phUid--, hidden:true, name:'', colour:null, grade:0, atk:0, def:0, effect:''};
}
function maskOpponent(seatIdx){
  const p = state.players[seatIdx];
  p.hand = p.hand.map(()=>placeholderCard());
  p.deck = p.deck.map(()=>placeholderCard());
}
function isMyActionableTurn(){
  if(aiOpponentActive() && state.current===ai.seat) return false; // block human input during the AI's own turn
  return !net.isOnline || !net.connected || state.current===net.mySeat;
}

function log(msg){
  const l = document.getElementById('log');
  const d = document.createElement('div');
  d.textContent = msg;
  l.appendChild(d);
  l.scrollTop = l.scrollHeight;
}

function opp(i){ return i===0?1:0; }
function cur(){ return state.players[state.current]; }
function curOpp(){ return state.players[opp(state.current)]; }
function devotionForTurn(n){ return Math.min(3, n); }

function startTurn(){
  clearEndOfTurnEffects(); // Whisperwind Page's -1/-0 (and any other "until end of turn" mod) expires here
  const p = cur();
  p.turnCount += 1;
  p.devotion = devotionForTurn(p.turnCount);
  p.devotionTotal = p.devotion; // fixed record of this turn's full pool — p.devotion itself drains as it's spent
  p.essence = devotionForTurn(p.turnCount); // same 1/2/3-capped-at-3 schedule, but a totally separate pool
  p.essenceTotal = p.essence;
  state.phaseIdx = 0;
  playSfx('phase'); // new turn opens on the Devotion phase
  state.selectedCardId = null;
  state.selectedAttackerZone = null;
  p.front.forEach(v=>{
    if(!v) return;
    v.sick = false; v.attacked = false; v.riteShielded = false;
    // Stormcrown Avatar's "cannot attack next turn": stunTurns was set when the effect resolved: the
    // very next time this Vessel's owner starts a turn, it sits out (stunned) that turn, then is back
    // to normal from the turn after.
    if(v.stunTurns && v.stunTurns>0){ v.stunned = true; v.stunTurns -= 1; }
    else { v.stunned = false; }
  });
  log(`— ${p.name}'s turn ${p.turnCount} begins. Devotion: ${p.devotion}, Attune: ${p.essence} —`);
  render();
}

function doDrawPhase(){
  const p = cur();
  if(p.isStartingPlayer && p.turnCount===1){
    log(`${p.name} is the starting player — no draw on turn 1.`);
    return null;
  }
  if(p.deck.length===0){
    state.gameOver = true;
    document.getElementById('winOverlay').style.display='flex';
    document.getElementById('winText').textContent = `${curOpp().name} Wins!`;
    log(`*** ${p.name} has no cards left to draw and loses! ${curOpp().name} wins. ***`);
    return null;
  }
  const card = p.deck.pop();
  p.hand.push(card);
  log(`${p.name} draws ${card.name}. (Deck: ${p.deck.length} left, Hand: ${p.hand.length})`);
  return card.id;
}

// A Vessel/Rite/Realm in hand that canPlayCard() says is legal RIGHT NOW, in the current phase — used
// both by the "you still have a playable card" confirmation below and by skipToEndPhase()'s "is there
// truly nothing left to do" check.
function hasAnyPlayableHandCard(playerIdx){
  return state.players[playerIdx].hand.some(c => canPlayCard(playerIdx, c));
}

// A front-row Vessel that could still declare an attack this turn (not sick/spent/stunned). This is a
// deliberately simple, conservative check — it doesn't verify a LEGAL target exists for every edge case
// (e.g. a cannotBeBlockedByGrade1 attacker facing only Grade-1 blockers truly has no legal target, but
// that's rare enough that treating it as "might still have an attack" is the safe direction: it only
// ever means the Skip button stays hidden one turn too cautiously, never that a real action gets skipped).
function hasAnyEligibleAttacker(playerIdx){
  return state.players[playerIdx].front.some(v => v && !v.sick && !v.attacked && !v.stunned);
}

// Jumps straight to the End Phase, bypassing Battle/Main2 entirely — offered only when nothing playable
// or attackable remains this turn (see renderStickyHud's skipToEndBtn visibility), so it never skips a
// real decision, just the clicking-through-empty-phases tedium of getting to End Phase to close the turn.
function skipToEndPhase(){
  if(state.gameOver || state.pendingAttack || state.pendingEffect || state.pendingRiteOffer || state.pendingPhaseWarning) return;
  if(!isMyActionableTurn()) return;
  const endIdx = PHASES.indexOf('End');
  if(state.phaseIdx >= endIdx) return;
  log(`${cur().name} skips ahead to End Phase — nothing left to play or attack with this turn.`);
  state.phaseIdx = endIdx;
  playSfx('phase');
  state.selectedCardId = null;
  state.selectedAttackerZone = null;
  render();
}

function confirmAdvancePhaseAnyway(){
  if(!state.pendingPhaseWarning) return;
  state.pendingPhaseWarning = null;
  nextPhase();
}

function cancelAdvancePhase(){
  if(!state.pendingPhaseWarning) return;
  state.pendingPhaseWarning = null;
  render();
}

// The "Next Phase →" button's own handler ONLY — this is where the "you still have something you can
// do" confirmation belongs, because it's specifically about a human about to click past an opportunity
// without noticing. Internal callers (aiDoMain/aiDoBattle/aiDoEnd/aiDoDevotion finishing their own
// heuristic turn, the AI's own aiStep dispatch, and a 'nextPhase' message replicating what the OTHER
// networked player already decided) call nextPhase() directly below and must never be blocked on this
// prompt — those are already-made decisions, not a click that might be advancing past something by
// accident.
function requestNextPhase(){
  if(state.gameOver || state.pendingAttack || state.pendingEffect || state.pendingRiteOffer) { nextPhase(); return; }
  if(!state.pendingPhaseWarning){
    const curPhase = PHASES[state.phaseIdx];
    if(isMainPhase(curPhase) && hasAnyPlayableHandCard(state.current)){
      state.pendingPhaseWarning = { reason:'playable' };
      render();
      return;
    }
