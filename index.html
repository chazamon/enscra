    if(curPhase==='Battle' && hasAnyEligibleAttacker(state.current)){
      state.pendingPhaseWarning = { reason:'attacker' };
      render();
      return;
    }
  }
  nextPhase();
}

function nextPhase(){
  if(state.gameOver) return;
  if(state.pendingAttack){
    log(`Resolve the pending Deflect decision before continuing.`);
    render();
    return;
  }
  if(state.pendingEffect){
    log(`Resolve the pending effect (or click Skip, if available) before continuing.`);
    render();
    return;
  }
  proceedToNextPhase();
}

function proceedToNextPhase(){
  const iAmActing = net.isOnline && net.connected && net.mySeat===state.current;
  const p = cur();
  const phaseName = PHASES[state.phaseIdx];

  if(phaseName === "End"){
    if(p.hand.length > 6){
      log(`Hand cap is 6 — discard down before ending your turn.`);
      render();
      return;
    }
    if(iAmActing) net.sendAction({type:'nextPhase'});
    state.current = opp(state.current);
    startTurn();
    return;
  }

  state.phaseIdx++;
  playSfx('phase');
  state.selectedCardId = null;
  state.selectedAttackerZone = null;

  let drawnCardId = null;
  const drawingPlayerIdx = state.current;
  if(PHASES[state.phaseIdx] === "Draw"){
    drawnCardId = doDrawPhase();
  }
  render();
  if(iAmActing) net.sendAction({type:'nextPhase'});
  if(drawnCardId!==null){
    playSfx('draw');
    // Animate on the next frame so the drawn card has already been laid out in its resting hand position.
    if(typeof requestAnimationFrame === 'function'){
      requestAnimationFrame(()=>animateDraw(drawingPlayerIdx, drawnCardId));
    } else {
      animateDraw(drawingPlayerIdx, drawnCardId);
    }
  }
}

// Devotion is a per-turn POOL (1 on turn 1, 2 on turn 2, 3 from turn 3 on — see devotionForTurn), not a
// single "one attune per turn" token. You can spend it across as many attune actions as it covers in the
// same Devotion Phase — one column up to a higher grade, or several columns to Grade 1 each, however you
// split it. Each attune action only ever raises a column's grade by exactly 1 (see attuneTargetGrade —
// re-attuning the same colour bumps +1, any other colour/unattuned column starts fresh at 1), so it only
// ever costs 1 devotion, however high the resulting grade number reads. Charging the full target grade
// again here was the bug: it double-charged every bump past Grade 1 (e.g. G1→G2 cost 2 more on top of
// the 1 already spent reaching G1, when the whole point of a turn's pool is that 1 point = 1 bump).
function attuneCost(colIdx, colour, grade){
  const p = cur();
  const col = p.columns[colIdx];
  const prevGrade = (col.colour===colour) ? col.grade : 0;
  return Math.max(1, grade - prevGrade);
}

function canAttune(colIdx, grade, colour){
  const p = cur();
  const cost = colour!==undefined ? attuneCost(colIdx, colour, grade) : grade;
  if(p.devotion < cost) return false;
  return true;
}

// Visual-cue helpers for the economy-teaching overlay (task A): a one-render glow on the column just
// attuned, and a one-render flash on the essence badge just spent from. Each is a transient flag
// consumed (and cleared) by the very next render() — see renderBoard() — so it only ever plays once
// per action, never lingering across later unrelated renders.
function flashAttune(playerIdx, colIdx){ state.attuneFlash = { playerIdx, colIdx }; }
function flashEssenceSpend(playerIdx){ state.essenceFlash = { playerIdx }; }

function attuneColumn(colIdx, colour, grade){
  const p = cur();
  const cost = attuneCost(colIdx, colour, grade);
  if(!canAttune(colIdx, grade, colour)) return;
  const iAmActing = net.isOnline && net.connected && net.mySeat===state.current;
  p.devotion -= cost;
  p.columns[colIdx] = {colour, grade};
  log(`${p.name} devotes column ${colIdx+1} to ${colour} Grade ${grade} (-${cost} devotion, ${p.devotion} left this turn).`);
  flashAttune(state.current, colIdx);
  playSfx('devotion');
  if(iAmActing) net.sendAction({type:'attune', colIdx, colour, grade});
  render();
}

// The compact Devotion picker (sidebar) works like card placement: pick a colour, then click the
// column on the board you want to attune. The grade is computed per-column (re-attuning the same
// colour bumps the grade by 1, up to 3; any other colour/unattuned column starts at grade 1).
function attuneTargetGrade(playerIdx, colIdx, colour){
  const col = state.players[playerIdx].columns[colIdx];
  return col.colour===colour ? Math.min(3, col.grade+1) : 1;
}

function selectAttuneColour(colour){
  if(!isMyActionableTurn()) return;
  state.selectedAttuneColour = (state.selectedAttuneColour===colour) ? null : colour;
  render();
}

function canPlace(playerIdx, colIdx, card){
  // Board-legality ONLY — whether this zone is a valid home for the card at all (colour/grade match).
  // Whether the player can actually AFFORD it (essence) is a separate check — see canPlayCard — kept
  // apart so the two failure reasons ("wrong zone" vs "can't afford it") stay distinguishable.
  const p = state.players[playerIdx];
  const col = p.columns[colIdx];
  if(!col.colour || col.colour !== card.colour) return false;
  if(col.grade < card.grade) return false;
  return true;
}

function placeSelected(colIdx){
  if(state.pendingEffect) return; // resolve the current effect before playing another card
  const p = cur();
  const card = p.hand.find(c=>c.id===state.selectedCardId);
  if(!card) return;
  if(card.type!=='Vessel') return; // Rites/Realms never place onto a board zone — see castRiteAtZone/castReattuneAtColumn
  if(!canPlace(state.current, colIdx, card)) return; // illegal target zone — no feedback needed, the zone just wasn't highlighted
  if(p.front[colIdx]) return;
  // The zone itself is legal (right colour/grade, empty) but essence might still be short — give the
  // same clear feedback Rites/Realms already get instead of silently doing nothing.
  if(!canPlayCard(state.current, card)){ logWhyCardCantPlay(p, card); render(); return; }
  const iAmActing = net.isOnline && net.connected && net.mySeat===state.current;
  const fromRect = captureCardRect(card.id); // where it's sitting in the hand right now, before render() moves it
  // Attuning the column only unlocks where this Vessel can go — the Vessel itself still costs essence
  // (= its grade), same pool as Rites/Realms.
  p.essence -= card.grade;
  flashEssenceSpend(state.current);
  p.front[colIdx] = {...card, sick:true, riteShielded: !!mech(card.name).riteShieldOnPlay};
  p.hand = p.hand.filter(c=>c.id!==card.id);
  state.selectedCardId = null;
  log(`${p.name} plays ${card.name} (${card.colour} G${card.grade}) to column ${colIdx+1} (-${card.grade} Attune).`);
  playSfx('play');
  if(iAmActing) net.sendAction({type:'place', colIdx, card});
  render();
  if(fromRect){
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>animateCardFlip(card.id, fromRect));
    else animateCardFlip(card.id, fromRect);
  }
  // Card mechanics: fires after the placement itself (and its render) so a targeting prompt appears
  // cleanly on top of the just-placed Vessel. Online multiplayer note: this resolves locally on the
  // acting player's device only — interactive on-play targeting isn't mirrored to the opponent's
  // device over the network in this pass (only attune/place/discard/attack/nextPhase are synced).
  const m = mech(card.name);
  if(m.onPlay) startOnPlayEffect(m.onPlay, state.current, colIdx, card.name);
}

// Single source of truth for "can this card legally be played right now", used both to dim/enable
// hand cards (renderHand) and to gate the actual play attempt (castSpellCard/placeSelected). Attuning a
// column only unlocks WHERE a Vessel can go; every card type (Vessel/Rite/Realm) spends essence (cost =
// printed cost for Rites/Realms, grade for Vessels) from the same pool. Main-speed Rites are restricted
// to Main Phase 1/2, Instant-speed ones are also playable during your own Battle Phase (the "own turn
// only" simplification of true instant speed — see the summary notes).
function canPlayCard(playerIdx, card){
  // isMyActionableTurn() exists to block HUMAN input during the AI's own turn — but the AI's own
  // decision-making (aiFindPlacementColumn -> placeSelected, and the Rite-affordability filter in
  // aiDoMain) also calls canPlayCard(), and that same block would make it silently fail on every one
  // of its own legal plays, forever (placeSelected's canPlayCard check fails -> it logs-and-returns ->
  // render()'s scheduleAi() queues another identical attempt 650ms later -> repeat). This carve-out
  // keeps every human-blocking case intact (isMyActionableTurn() already covers them) while letting
  // the AI's own evaluation of its own turn see the real, correct answer.
  const aiActingForItself = aiOpponentActive() && state.current===ai.seat;
  if(playerIdx!==state.current || (!aiActingForItself && !isMyActionableTurn()) || state.pendingEffect || state.pendingAttack) return false;
  // While an attack is staged awaiting the Rite-offer decision, only Instant Rites remain playable —
  // everything else (Vessels, Realms) must wait for the offer to conclude. The offer's own "is there a
  // playable Rite" check (in resolveAttack) deliberately runs BEFORE pendingRiteOffer is set, so it
  // isn't short-circuited by this line.
  if(state.pendingRiteOffer && card.type!=='Rite') return false;
  // The "you still have a playable card — advance anyway?" prompt forces an explicit Proceed/Cancel
  // choice before anything else can happen — Cancel is what lets the player go back and actually play it.
  if(state.pendingPhaseWarning) return false;
  const p = state.players[playerIdx];
  const phase = PHASES[state.phaseIdx];
  // Vessels now also spend essence (cost = grade) — attuning a column only unlocks WHERE a Vessel can
  // go, it no longer pays for the Vessel itself. Essence is the one pool that's spent playing any card.
  if(card.type==='Vessel') return isMainPhase(phase) && hasEligibleColumn(playerIdx, card) && p.essence>=card.grade;
  if(card.name==='Deflect') return false; // reactive-only — offered automatically when you're attacked
  if(card.type==='Rite'){
    if(p.essence < card.cost) return false;
    return card.speed==='Instant' ? (isMainPhase(phase)||phase==='Battle') : isMainPhase(phase);
  }
  if(card.type==='Realm'){
    return p.essence>=card.cost && isMainPhase(phase);
  }
  return false;
}

// Casts a Rite or Realm from hand: pays its essence cost, moves it out of hand (Rites resolve then go
// to the Void; Realms take the shared Realm Zone), and kicks off its effect via the same pendingEffect
// machinery Vessel on-play effects use. Unlike Vessels, this resolves on a single click — there's no
// separate "select, then click a zone" step for the CARD itself, only for its target (if it needs one).
// Shared "why can't this be cast right now" messaging — pulled out so castRiteAtZone can give the
// same feedback castSpellCard always has. Without this, a board-targeted Rite (Searing Strike, Molten
// Burst, etc.) that you can't actually afford/play right now would fail COMPLETELY SILENTLY when you
// clicked its target zone: castRiteAtZone short-circuits on canPlayCard() before ever reaching
// castSpellCard's own messaging, so nothing was logged and nothing re-rendered — it just looked broken.
function logWhyCardCantPlay(p, card){
  if(card.type==='Vessel'){
    if(!hasEligibleColumn(state.current, card)) log(`${card.name}: no column devoted to ${card.colour} Grade ${card.grade} (or higher) with room for it.`);
    else if(p.essence < card.grade) log(`${card.name}: not enough Attune (needs ${card.grade}, you have ${p.essence}).`);
    else log(`${card.name} can't be played right now.`);
    return;
  }
  if(p.essence < card.cost) log(`${card.name}: not enough Attune (needs ${card.cost}, you have ${p.essence}).`);
  else if(card.type==='Rite' && card.speed!=='Instant') log(`${card.name} is Main-speed — only playable during Main Phase 1 or 2.`);
  else if(card.type==='Rite') log(`${card.name} can only be played during your own Main or Battle Phase.`);
  else if(card.type==='Realm') log(`${card.name}: Realms are Main-speed — only playable during Main Phase 1 or 2.`);
  else log(`${card.name} can't be played right now.`);
}

function castSpellCard(cardId){
  const p = cur();
  const card = p.hand.find(c=>c.id===cardId);
  if(!card) return;
  if(card.name==='Deflect'){
    log(`Deflect can only be played in reaction to an incoming attack — it's offered automatically when you're attacked.`);
    render(); return;
  }
  if(!canPlayCard(state.current, card)){
    logWhyCardCantPlay(p, card);
    render(); return;
  }
  const iAmActing = net.isOnline && net.connected && net.mySeat===state.current;
  const fromRect = captureCardRect(card.id); // hand position, before render() moves it to the Void/Realm Zone
  p.essence -= card.cost;
  flashEssenceSpend(state.current);
  p.hand = p.hand.filter(c=>c.id!==card.id);
  state.selectedCardId = null;
  playSfx('play'); // Rite cast or Realm played
  if(card.type==='Realm'){
    playRealm(card);
  } else {
    p.void.push(card); // Rites resolve once, then go to the Void
    log(`${p.name} casts ${card.name} (${card.colour}, ${card.cost} Attune).`);
    const m = mech(card.name);
    // Online multiplayer note, same caveat as Vessel on-play effects: this resolves locally on the
    // acting player's device only — interactive targeting isn't mirrored to the opponent's device.
    if(m.riteEffect) startOnPlayEffect(m.riteEffect, state.current, null, card.name, true);
    else render();
  }
  // Realms don't render as a cardEl in the Realm Zone (text only — see renderRealmZone), so this is a
  // silent no-op for those; Rites land on top of the Void, which DOES render with a matching cardEl id.
  if(fromRect){
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>animateCardFlip(card.id, fromRect, {fade:true}));
    else animateCardFlip(card.id, fromRect, {fade:true});
  }
  if(iAmActing) net.sendAction({type:'castSpell', cardId: card.id});
}

// Realms share one zone — playing a new one retires whichever was active (to its owner's Void).
function playRealm(card){
  if(state.realm && state.realm.cardRef){
    const oldOwner = state.players[state.realm.ownerIdx];
    oldOwner.void.push(state.realm.cardRef);
    log(`${state.realm.name} is retired to ${oldOwner.name}'s Void.`);
  }
  state.realm = { name:card.name, ownerIdx: state.current, cardRef: card };
  log(`${cur().name} plays the Realm ${card.name}.`);
  render();
}

// Does this Rite's effect target a single Vessel already on the board (as opposed to a Void card,
// a colour+column pair, or nothing at all)? Used to decide whether a selected Rite should light up
// board zones and resolve via a zone click (castRiteAtZone) rather than some other confirm gesture.
function riteEffectWantsBoardZone(m){
  if(!m || !m.riteEffect) return false;
  const re = m.riteEffect;
  return !!(re.damageAnyVessel || re.debuffTargetVessel || re.permBuffTargetVessel || re.stunTargetVessel || re.bounceTargetEnemyVessel || re.bounceAnyVessel);
}

// Is the clicked zone a LEGAL target for this Rite's effect? Checked before any cost is paid, so a
// click on an illegal zone (empty column, or a Zephyr Tactician-protected Vessel) just does nothing
// instead of spending the card on a target it can't actually affect.
function riteZoneTargetValid(re, zonePlayerIdx, colIdx, casterIdx){
  const v = state.players[zonePlayerIdx].front[colIdx];
  if(!v) return false;
  if(isProtectedFromEnemyRite(zonePlayerIdx, colIdx, casterIdx)) return false;
  if(re.bounceTargetEnemyVessel && zonePlayerIdx===casterIdx) return false; // must be an ENEMY Vessel
  return true;
}

// Casts a board-targeted Rite (Searing Strike, Molten Burst, Bulwark, Overgrowth, Crosswind, Undertow)
// against a specific zone in a single click, once it's already selected: validate the target FIRST,
// then pay the cost/move the card/resolve the effect atomically, so an illegal click never spends the
// card and a legal click never leaves an orphaned pendingEffect waiting on a target we already know.
function castRiteAtZone(cardId, zonePlayerIdx, colIdx){
  const p = cur();
  const card = p.hand.find(c=>c.id===cardId);
  if(!card || card.type!=='Rite') return false;
  if(!canPlayCard(state.current, card)){
    logWhyCardCantPlay(p, card); // e.g. "not enough essence" — see logWhyCardCantPlay's comment for why this matters here specifically
    render();
    return false;
  }
  const m = mech(card.name);
  if(!riteEffectWantsBoardZone(m)) return false;
  if(!riteZoneTargetValid(m.riteEffect, zonePlayerIdx, colIdx, state.current)) return false;
  castSpellCard(cardId); // pays cost, moves the Rite to the Void, sets state.pendingEffect via startOnPlayEffect
  resolvePendingEffectZoneClick(zonePlayerIdx, colIdx); // resolve immediately against the already-validated target
  return true;
}

// Selecting a card in hand. Vessels: click to select/deselect, then click a lit-up board zone to
// place them (unchanged). Rites/Realms: click ONLY selects them now — nothing is paid or moved yet.
// From there, how a selected Rite/Realm actually gets cast depends on what it targets:
//   - no target at all (Realms, and Foresight's draw-a-card) — click the SAME card again to confirm.
//   - a Vessel already on the board — click that Vessel's zone (see castRiteAtZone, wired into zoneClick).
//   - a Grade 1 Vessel in your own Void (Second Wind) — click it in the Void list (see voidCardClick).
//   - a colour then a column (Reattune) — pick the colour in the sidebar, then click a column (see
//     selectReattuneStagingColour / castReattuneAtColumn, wired into zoneClick).
// This mirrors Vessels' own select-then-target-click pattern instead of casting on the very first
// click, which previously spent a card the instant you clicked it just to look at it.
function selectCard(cardId){
  if(!isMyActionableTurn()) return;
  if(state.pendingPhaseWarning) return;
  if(state.pendingEffect && state.pendingEffect.kind==='discardFromEffect'){
    resolvePendingDiscard(cardId);
    return;
  }
  if(state.pendingEffect) return; // a board-targeting effect is pending — resolve that first
  if(state.pendingRiteOffer){
    // Only selecting/deselecting an Instant Rite is meaningful while the offer is open, and only once
    // accepted — everything else about hand-card selection (Deflect's message, Realm/no-target casts,
    // Vessel selection) is irrelevant mid-combat and left alone.
    if(!state.pendingRiteOffer.accepted) return;
    const card = cur().hand.find(c=>c.id===cardId);
    if(!card || card.type!=='Rite') return;
    state.selectedCardId = (state.selectedCardId===cardId) ? null : cardId;
    render();
    return;
  }
  const phase = PHASES[state.phaseIdx];
  if(phase==='End'){
    // Only actually discard while over the 6-card cap — otherwise clicking a hand card in End phase
    // should do nothing (there's nothing to resolve yet), matching the "OVER CAP" hint text that's
    // already gated the same way.
    if(cur().hand.length > 6) discardCard(cardId);
    return;
  }
  const p = cur();
  const card = p.hand.find(c=>c.id===cardId);
  if(card && card.name==='Deflect'){
    log(`Deflect can only be played in reaction to an incoming attack — it's offered automatically when you're attacked.`);
    render(); return;
  }
  if(card && (card.type==='Rite' || card.type==='Realm')){
    const alreadySelected = state.selectedCardId===cardId;
    const needsNoFollowUpTarget = card.type==='Realm' || (mech(card.name).riteEffect && mech(card.name).riteEffect.drawCard);
    if(alreadySelected && needsNoFollowUpTarget){
      castSpellCard(cardId); // second deliberate click on a no-target card confirms the cast
      return;
    }
    if(!alreadySelected) state.reattuneStaging = null; // switching selection clears any staged Reattune colour
    state.selectedCardId = alreadySelected ? null : cardId;
    state.selectedAttackerZone = null;
    render();
    return;
  }
  state.selectedCardId = (state.selectedCardId===cardId) ? null : cardId;
  state.selectedAttackerZone = null;
  state.reattuneStaging = null;
  render();
}

// --- Drag and drop: click-and-hold a hand card, drag it over a lit-up zone, release to place it. ---
// Vessels only — Rites/Realms resolve on a single click (castSpellCard), nothing to drag onto a zone.
let draggingCardId = null;

function dragStartCard(ev, cardId){
  if(!isMyActionableTurn()){ ev.preventDefault(); return; }
  const p = cur();
  const phase = PHASES[state.phaseIdx];
  const card = p.hand.find(c=>c.id===cardId);
  if(!isMainPhase(phase) || !card || card.type!=='Vessel'){ ev.preventDefault(); return; }
  // Always allow the pickup, even if this card can't be afforded/placed right now —
  // silently refusing to drag gives zero feedback. Instead we explain why nothing lights up.
  draggingCardId = cardId;
  state.selectedCardId = cardId;
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain', String(cardId)); }catch(e){}
  const instrEl = document.getElementById('bigInstruction');
  if(instrEl) instrEl.innerHTML = explainCardSelection(card);
  highlightPlaceableZones(card); // placement is free — zones light up based on colour/grade match only
}

function dragEndCard(ev){
  draggingCardId = null;
  clearZoneHighlights();
  render(); // safe now that the drag session has ended — resyncs selection state, hand, and instructions
}

function highlightPlaceableZones(card){
  const p = cur();
  for(let i=0;i<5;i++){
    if(!p.front[i] && canPlace(state.current,i,card)){
      const z = document.getElementById(`zone-${state.current}-${i}-front`);
      if(z){ z.classList.add('placeable'); z.insertAdjacentHTML('beforeend', '<div class="zoneOverlay drag-overlay">▸ DROP HERE</div>'); }
    }
  }
}

function clearZoneHighlights(){
  document.querySelectorAll('.drag-overlay').forEach(o=>o.remove());
  document.querySelectorAll('.zone.placeable').forEach(z=>z.classList.remove('placeable'));
}

function dropOnZone(ev, playerIdx, colIdx){
  ev.preventDefault();
  if(draggingCardId===null) return;
  if(playerIdx !== state.current){ draggingCardId=null; clearZoneHighlights(); return; }
  state.selectedCardId = draggingCardId;
  draggingCardId = null;
  placeSelected(colIdx); // no-ops safely if invalid; calls render() either way
}

function discardCard(cardId){
  const p = cur();
  const card = p.hand.find(c=>c.id===cardId);
  if(!card) return;
  const iAmActing = net.isOnline && net.connected && net.mySeat===state.current;
  const fromRect = captureCardRect(cardId);
  p.hand = p.hand.filter(c=>c.id!==cardId);
  p.void.push(card);
  playSfx('discard');
  log(`${p.name} discards ${card.name} (hand cap) — sent to the Void.`);
  if(iAmActing) net.sendAction({type:'discard', card});
  render();
  if(fromRect){
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>animateCardFlip(cardId, fromRect, {fade:true}));
    else animateCardFlip(cardId, fromRect, {fade:true});
  }
}

// --- Remote replay: applies an action a peer already validated & performed on their own device.
// Only ever touches OUR mirrored copy of THEIR player object, using their placeholder hand as a
// stand-in (any placeholder will do — they're interchangeable until revealed) and the REAL card
// data they sent along with the reveal (place/discard are the only actions that expose a real card).
function applyRemotePlace(colIdx, card){
  const p = cur();
  const idx = p.hand.findIndex(c=>c.hidden);
  if(idx>=0) p.hand.splice(idx,1);
  p.front[colIdx] = {...card, sick:true, riteShielded: !!mech(card.name).riteShieldOnPlay};
  log(`${p.name} plays ${card.name} (${card.colour} G${card.grade}) to column ${colIdx+1}.`);
  playSfx('play');
  render();
}
function applyRemoteDiscard(card){
  const p = cur();
  const idx = p.hand.findIndex(c=>c.hidden);
  if(idx>=0) p.hand.splice(idx,1);
  p.void.push(card);
  playSfx('discard');
  log(`${p.name} discards ${card.name} (hand cap) — sent to the Void.`);
  render();
}
function handleRemoteAction(msg){
  if(!msg || !msg.type) return;
  switch(msg.type){
    case 'attune': attuneColumn(msg.colIdx, msg.colour, msg.grade); break;
    case 'place': applyRemotePlace(msg.colIdx, msg.card); break;
    case 'discard': applyRemoteDiscard(msg.card); break;
    case 'attack':
      state.selectedAttackerZone = String(msg.aCol);
      resolveAttack(msg.targetColIdx, msg.directPlayer);
      break;
    case 'nextPhase': nextPhase(); break;
  }
}

function selectAttacker(colIdx){
  if(state.pendingPhaseWarning) return;
  const p = cur();
  const v = p.front[colIdx];
  if(!v || v.sick || v.attacked || v.stunned) return;
  const key = String(colIdx);
  state.selectedAttackerZone = (state.selectedAttackerZone===key) ? null : key;
  render();
}

// ignoreGrade1: Wildfire Avatar's "cannot be blocked by Grade 1 Vessels" — when true, Grade-1 Vessels
// don't count as a reason the opponent is protected from a direct attack.
function frontRowHasVessels(playerIdx, ignoreGrade1){
  return state.players[playerIdx].front.some(v=>v && (!ignoreGrade1 || v.grade>1));
}

// Deflect ("change the target of an attack to a different Vessel you control") needs a pause between
// the attack being declared and it actually resolving, so the defender gets a chance to react. This
// wrapper is the pause point: if the defender holds a playable Deflect and has another Vessel to
// redirect onto, it stages state.pendingAttack and shows the reaction prompt instead of resolving
// immediately; otherwise it falls straight through to executeAttack(), same as before Rites existed.
// Hotseat only: online, each device runs this off its own copy of state (the opponent's hand is masked
// on the attacker's device, real on the defender's), so a Deflect decision made on one device would
// never reach the other and the two devices' game states would silently diverge. Skipping the pause
// online means Deflect just doesn't trigger there — same "not fully synced" limitation every other
// interactive on-play/Rite effect already has, rather than a new way for online games to desync.
function resolveAttack(targetColIdx, directPlayer){
  if(state.gameOver) return;
  // Before anything else: if the attacking player has a playable Instant Rite in hand, offer them the
  // chance to cast it on this combat before it resolves (requested flow — see offerRiteBeforeAttack()).
  // canPlayCard() alone correctly excludes Deflect (not a Rite), Main-speed Rites during Battle, and
  // unaffordable Rites, so no extra checks are needed here. Never offered when the AI is the attacker —
  // this prompt is a human decision point with no corresponding AI logic, so the AI just attacks
  // straight through (it has its own, separate Rite-casting logic during its Main Phase instead).
  const attackerIsAi = aiOpponentActive() && state.current===ai.seat;
  if(!net.isOnline && !attackerIsAi && cur().hand.some(c=>c.type==='Rite' && canPlayCard(state.current, c))){
    offerRiteBeforeAttack(targetColIdx, directPlayer, Number(state.selectedAttackerZone));
    return;
  }
  proceedWithAttack(targetColIdx, directPlayer);
}

// The original body of resolveAttack(), extracted so the Rite-offer step above can defer straight into
// it once the player accepts/declines/finishes casting Rites.
function proceedWithAttack(targetColIdx, directPlayer){
  const defenderIdx = opp(state.current);
  const defender = state.players[defenderIdx];
  const deflectCard = (!directPlayer && !net.isOnline) ? defender.hand.find(c=>c.name==='Deflect') : null;
  const hasOtherTarget = !directPlayer && defender.front.some((v,i)=> v && i!==targetColIdx);
  if(deflectCard && defender.essence>=deflectCard.cost && hasOtherTarget){
    state.pendingAttack = { targetColIdx, directPlayer, attackerColIdx: Number(state.selectedAttackerZone) };
    render();
    return;
  }
  executeAttack(targetColIdx, directPlayer);
}

// --- Rite-before-combat offer -----------------------------------------------------------------------
// Requested flow: on declaring an attack, if the attacker has an Instant Rite they could play, ask
// "use a Rite for this combat?" first instead of resolving straight away. Accepting lets them cast any
// number of affordable Instant Rites (reusing the existing free-form Rite-selection/targeting flow),
// then they explicitly click "Resolve Attack Now" when done. Declining (or finishing) falls through to
// the normal Deflect-check-then-execute path via proceedWithAttack().
function offerRiteBeforeAttack(targetColIdx, directPlayer, attackerColIdx){
  state.pendingRiteOffer = { targetColIdx, directPlayer, attackerColIdx, accepted:false };
  render();
}

function acceptRiteOffer(){
  if(!state.pendingRiteOffer) return;
  state.pendingRiteOffer.accepted = true;
  render();
}

function declineRiteOffer(){
  finishRiteOfferAndAttack();
}

function resolveAttackNowFromOffer(){
  finishRiteOfferAndAttack();
}

function finishRiteOfferAndAttack(){
  const ro = state.pendingRiteOffer;
  if(!ro) return;
  state.pendingRiteOffer = null;
  // Selecting a Rite card (via selectCard) clears state.selectedAttackerZone as a side effect — restore
  // it before handing off to proceedWithAttack, which reads it to know who's attacking.
  state.selectedAttackerZone = String(ro.attackerColIdx);
  state.selectedCardId = null;
  proceedWithAttack(ro.targetColIdx, ro.directPlayer);
}

function declineDeflect(){
  const pa = state.pendingAttack;
  if(!pa) return;
  state.pendingAttack = null;
  executeAttack(pa.targetColIdx, pa.directPlayer);
}

function offerDeflect(cardId){
  const pa = state.pendingAttack;
  if(!pa) return;
  const defenderIdx = opp(state.current);
  const defender = state.players[defenderIdx];
  const card = defender.hand.find(c=>c.id===cardId && c.name==='Deflect');
  if(!card){ return; }
  if(defender.essence < card.cost){ log(`Not enough Attune to play Deflect.`); render(); return; }
  defender.essence -= card.cost;
  flashEssenceSpend(defenderIdx);
  defender.hand = defender.hand.filter(c=>c.id!==card.id);
  defender.void.push(card);
  log(`${defender.name} plays Deflect!`);
  playSfx('play');
  state.pendingEffect = { kind:'redirectAttack', sourceName:'Deflect', playerIdx: defenderIdx };
  render();
}

function executeAttack(targetColIdx, directPlayer){
  const p = cur();
  const o = curOpp();
  if(!state.selectedAttackerZone) return;
  const aCol = parseInt(state.selectedAttackerZone);
  const attacker = p.front[aCol];
  if(!attacker) return;
  const iAmActing = net.isOnline && net.connected && net.mySeat===state.current;

  // Cosmetic-only lunge toward the target, fired before any state mutation so it plays regardless of
  // what's about to happen (survive, trade, destroy) — it never gates the actual combat resolution.
  const mySeatNow = net.isOnline ? net.mySeat : 0;
  const defenderIdxForLunge = opp(state.current);
  const lungeTargetEl = directPlayer
    ? document.getElementById(defenderIdxForLunge===mySeatNow ? 'board-0' : 'board-1')
    : document.getElementById(`zone-${defenderIdxForLunge}-${targetColIdx}-front`);
  animateAttackLunge(attacker.id, lungeTargetEl);
  playSfx('combat'); // the attack swing itself — fires regardless of outcome, same as the lunge it pairs with
  // Captured only when relevant (Vessel-vs-Vessel below) — used after render() at the bottom of this
  // function to flip a destroyed Vessel from its board cell into its owner's Void.
  let attackerFromRect = null, defenderFromRect = null, defenderDiedId = null, attackerDiedId = null;

  if(directPlayer){
    // Unblocked direct attack — this is the only path where a player takes combat damage by default.
    const ignoreG1 = mech(attacker.name).cannotBeBlockedByGrade1; // Wildfire Avatar
    if(frontRowHasVessels(opp(state.current), ignoreG1)) return;
    const attackerEff = getEffectiveStats(state.current, aCol);
    o.hp = Math.max(0, o.hp - attackerEff.atk);
    log(`${attacker.name} attacks ${o.name} directly for ${attackerEff.atk} damage! (${o.name} HP: ${o.hp})`);
    attacker.attacked = true;
  } else {
    // Vessel-vs-Vessel combat is a mutual trade: each Vessel deals its ATK to the other's DEF at the
    // same time. A Vessel is destroyed if the damage it receives is >= its own DEF. Players take NO
    // combat damage from Vessel-vs-Vessel fights by default — that only happens via direct attacks,
    // a card effect that explicitly says so (Wildfire Avatar's Breakthrough), or an on-destroy/on-survive
    // trigger (Cinder Runner, Stoneskin Tender).
    const defender = o.front[targetColIdx];
    if(!defender) return;
    if(mech(attacker.name).cannotBeBlockedByGrade1 && defender.grade===1) return; // defense-in-depth; UI already excludes these as targets

    // Stats computed (and auras applied) BEFORE anything is removed from the board, while both
    // Vessels are still in their columns for getEffectiveStats() to see.
    const attackerEff = getEffectiveStats(state.current, aCol);
    const defenderEff = getEffectiveStats(opp(state.current), targetColIdx);
    const defenderDies = attackerEff.atk >= defenderEff.def;
    const attackerDies = defenderEff.atk >= attackerEff.def;
    if(defenderDies){ defenderFromRect = captureCardRect(defender.id); defenderDiedId = defender.id; o.front[targetColIdx] = null; o.void.push(defender); playSfx('discard'); }
    if(attackerDies){ attackerFromRect = captureCardRect(attacker.id); attackerDiedId = attacker.id; p.front[aCol] = null; p.void.push(attacker); playSfx('discard'); }

    if(defenderDies && attackerDies){
      log(`${attacker.name} (ATK${attackerEff.atk}/DEF${attackerEff.def}) and ${defender.name} (ATK${defenderEff.atk}/DEF${defenderEff.def}) trade — both destroyed, sent to the Void. No damage to either player.`);
    } else if(defenderDies){
      log(`${attacker.name} (ATK${attackerEff.atk}) destroys ${defender.name} (DEF${defenderEff.def}) — sent to the Void. ${attacker.name} survives (took ${defenderEff.atk} vs its DEF${attackerEff.def}). No damage to either player.`);
    } else if(attackerDies){
      log(`${defender.name} (DEF${defenderEff.def}) survives and its ATK${defenderEff.atk} destroys the attacking ${attacker.name} (DEF${attackerEff.def}) — sent to the Void. No damage to either player.`);
    } else {
      log(`${attacker.name} (ATK${attackerEff.atk}) attacks ${defender.name} (DEF${defenderEff.def}) — absorbed, neither destroyed. No damage to either player.`);
    }

    // Wildfire Avatar / Flame Zealot: "Breakthrough damage always hits the player" — only the AMOUNT
    // BEYOND what was needed to destroy the defender carries through; it does nothing if the defender
    // survives, and doesn't change whether either Vessel lives or dies, which is still decided by the
    // normal ATK-vs-DEF math above.
    if(defenderDies && mech(attacker.name).trampleToPlayer){
      const excess = attackerEff.atk - defenderEff.def;
      if(excess>0){
        o.hp = Math.max(0, o.hp - excess);
        log(`${attacker.name}'s Breakthrough damage carries through for ${excess} more to ${o.name}! (${o.name} HP: ${o.hp})`);
      }
    }
    // Cinder Runner: "When this destroys a Vessel in combat, deal 1 to the player." — checked on
    // whichever side actually did the destroying, since Cinder Runner can be the attacker OR the one
    // defending and still be the Vessel that landed the kill.
    if(defenderDies && mech(attacker.name).onDestroyInCombat){
      const dmg = mech(attacker.name).onDestroyInCombat.damagePlayer;
      o.hp = Math.max(0, o.hp - dmg);
      log(`${attacker.name}'s ability deals ${dmg} to ${o.name} for destroying a Vessel! (${o.name} HP: ${o.hp})`);
    }
    if(attackerDies && mech(defender.name).onDestroyInCombat){
      const dmg = mech(defender.name).onDestroyInCombat.damagePlayer;
      p.hp = Math.max(0, p.hp - dmg);
      log(`${defender.name}'s ability deals ${dmg} to ${p.name} for destroying a Vessel! (${p.name} HP: ${p.hp})`);
    }
    // Stoneskin Tender: "When this survives combat, gain 1 life."
    if(!attackerDies && mech(attacker.name).onSurviveCombat){
      const heal = mech(attacker.name).onSurviveCombat.gainLife;
      p.hp += heal;
      log(`${attacker.name}'s ability heals ${p.name} for ${heal}! (${p.name} HP: ${p.hp})`);
    }
    if(!defenderDies && mech(defender.name).onSurviveCombat){
      const heal = mech(defender.name).onSurviveCombat.gainLife;
      o.hp += heal;
      log(`${defender.name}'s ability heals ${o.name} for ${heal}! (${o.name} HP: ${o.hp})`);
    }

    // Only mark it "attacked/spent" if it survived — a destroyed attacker is gone, not spent.
    if(p.front[aCol]===attacker) attacker.attacked = true;
  }
  state.selectedAttackerZone = null;
  if(iAmActing) net.sendAction({type:'attack', aCol, targetColIdx, directPlayer});
  checkWin();
  render();
  // Flip whichever Vessel(s) died from their board cell into their owner's Void — captured above,
  // before the mutation, and played once render() has laid out the new top-of-Void card at the same id.
  if(defenderDiedId!==null && defenderFromRect){
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>animateCardFlip(defenderDiedId, defenderFromRect, {fade:true}));
    else animateCardFlip(defenderDiedId, defenderFromRect, {fade:true});
  }
  if(attackerDiedId!==null && attackerFromRect){
    if(typeof requestAnimationFrame==='function') requestAnimationFrame(()=>animateCardFlip(attackerDiedId, attackerFromRect, {fade:true}));
    else animateCardFlip(attackerDiedId, attackerFromRect, {fade:true});
  }
}

function checkWin(){
  state.players.forEach((p,i)=>{
    if(p.hp<=0 && !state.gameOver){
      state.gameOver = true;
      document.getElementById('winOverlay').style.display='flex';
      document.getElementById('winText').textContent = `${state.players[opp(i)].name} Wins!`;
      log(`*** ${state.players[opp(i)].name} wins! ${p.name}'s HP reached 0. ***`);
    }
  });
}

function zoneClick(playerIdx, colIdx){
  if(state.gameOver) return;
  if(!isMyActionableTurn()) return;
  if(state.pendingPhaseWarning) return;
  // While an attack is staged awaiting a Deflect decision, zone clicks are inert except the one that
  // actually resolves Deflect's redirect target (handled below via the normal pendingEffect route).
  if(state.pendingAttack && !(state.pendingEffect && state.pendingEffect.kind==='redirectAttack')) return;
  if(state.pendingEffect){
    resolvePendingEffectZoneClick(playerIdx, colIdx);
    return;
  }
  // While the attacker is being offered the chance to cast a Rite before this combat resolves, zone
  // clicks are limited to casting a selected Instant Rite (handled below) — nothing else (selecting a
  // new attacker, resolving the staged attack directly, etc.) should fire until the offer concludes via
  // the prompt's own buttons. Before the offer is accepted, zone clicks are inert entirely.
  if(state.pendingRiteOffer){
    if(!state.pendingRiteOffer.accepted) return;
    const selCard = cur().hand.find(c=>c.id===state.selectedCardId);
    if(selCard && selCard.type==='Rite'){
      const m = mech(selCard.name);
      if(riteEffectWantsBoardZone(m)) castRiteAtZone(selCard.id, playerIdx, colIdx);
    }
    return;
  }
  const phase = PHASES[state.phaseIdx];
  const isOwn = playerIdx === state.current;

  if(phase==='Devotion' && isOwn && state.selectedAttuneColour){
    const colour = state.selectedAttuneColour;
    const grade = attuneTargetGrade(playerIdx, colIdx, colour);
    state.selectedAttuneColour = null;
    if(canAttune(colIdx, grade, colour)){
      attuneColumn(colIdx, colour, grade); // attuneColumn() re-renders internally
    } else {
      render();
    }
    return;
  }
  // A selected Reattune with its colour already staged in the sidebar: this column click is the final
  // step — it pays the cost and applies the change in one atomic action (see castReattuneAtColumn).
  if(isMainPhase(phase) && isOwn && state.reattuneStaging && state.selectedCardId===state.reattuneStaging.cardId){
    castReattuneAtColumn(state.reattuneStaging.cardId, colIdx);
    return;
  }
  // A selected board-targeted Rite (Searing Strike, Molten Burst, Bulwark, Overgrowth, Crosswind,
  // Undertow): this zone click IS the cast — see castRiteAtZone for the validate-then-pay sequence.
  // An illegal target (empty zone, protected Vessel) is a no-op rather than falling through to
  // placeSelected, which would otherwise try to interpret the Rite as a Vessel placement.
  // Also allowed during Battle phase, not just Main — Instant-speed Rites (Searing Strike, Molten
  // Burst, Bulwark, Crosswind) are legal there per canPlayCard(), which castRiteAtZone checks itself;
  // this must come BEFORE the Battle-phase selectAttacker/resolveAttack branches below, otherwise a
  // click on your own zone during Battle would always be read as "select this attacker" and a selected
  // Instant Rite could never actually be cast there (it would just silently never fire).
  if((isMainPhase(phase) || phase==='Battle') && state.selectedCardId!==null){
    const selCard = cur().hand.find(c=>c.id===state.selectedCardId);
    if(selCard && selCard.type==='Rite'){
      const m = mech(selCard.name);
      if(riteEffectWantsBoardZone(m)) castRiteAtZone(selCard.id, playerIdx, colIdx);
      return; // whether or not the target was legal, this click has been handled — never fall through
    }
  }
  if(isMainPhase(phase) && isOwn && state.selectedCardId!==null){
    placeSelected(colIdx);
    return;
  }
  if(phase==='Battle' && isOwn){
    selectAttacker(colIdx);
    return;
  }
  if(phase==='Battle' && !isOwn && state.selectedAttackerZone){
    resolveAttack(colIdx, false);
    return;
  }
}

function enemyFaceClick(){
  if(state.gameOver) return;
  if(!isMyActionableTurn()) return;
  if(state.pendingRiteOffer) return; // the attack is already staged — only the offer prompt's own buttons move it forward
  if(state.pendingPhaseWarning) return;
  const phase = PHASES[state.phaseIdx];
  if(phase==='Battle' && state.selectedAttackerZone){
    resolveAttack(null, true);
  }
}

// --- Inline keyword glossary ------------------------------------------------------------------
// Two kinds of entry:
//  - regexMatch:true  — the phrase literally appears in a card's printed effect text (verified via
//    grep across every card's effect string), so markupKeywords() finds and wraps it automatically,
//    longest phrase first so e.g. "Breakthrough damage" isn't partially eaten by a shorter overlap.
//  - regexMatch:false — short, common words (SICK/STUNNED/SPENT, Instant/Main) that never appear in
//    effect prose but DO appear in their own fixed UI spots (the status tag, the Rite type line);
//    those are hand-wrapped at render time instead of regex-matched, so a word like "Main" doesn't
//    get falsely highlighted every time it shows up elsewhere.
const GLOSSARY = [
  { key:'excessDamage', term:'Breakthrough damage', regexMatch:true,
    def:'When this Vessel destroys the Vessel it\'s fighting, any of its ATK left over after covering the defender\'s DEF carries through as direct damage to the opposing player.' },
  { key:'untilEndOfTurn', term:'until end of turn', regexMatch:true,
    def:'This change only lasts until the current turn ends — it wears off automatically and does not carry into the next turn.' },
  { key:'cannotAttackNext', term:'cannot attack next turn', regexMatch:true,
    def:'That Vessel is skipped during its controller\'s next Battle Phase, even if it would otherwise be eligible to attack.' },
  { key:'untilNextTurn', term:'until your next turn', regexMatch:true,
    def:'Lasts through your opponent\'s whole turn and wears off when your own next turn begins.' },
  { key:'devotionColour', term:'devotion colour', regexMatch:true,
    def:'The colour a column is currently devoted to. Only Vessels of that colour (at or below the column\'s Grade) can be placed there.' },
  { key:'permanently', term:'permanently', regexMatch:true,
    def:'Unlike an "until end of turn" effect, this change does NOT wear off — it stays in effect for the rest of the game (or until something else changes it).' },
  { key:'void', term:'Void', regexMatch:true,
    def:'Your discard pile — destroyed Vessels, used Rites, and discarded cards all end up here. Some cards can interact with cards already in the Void.' },
  { key:'grade', term:'Grade', regexMatch:true,
    def:'A Vessel\'s power level (1–3). A column can only hold a Vessel whose Grade is at or below that column\'s current devotion Grade.' },
  { key:'sick', term:'SICK', regexMatch:false,
    def:'This Vessel was just played and has summoning sickness — it can\'t attack this turn. It\'s ready again on your next turn.' },
  { key:'stunned', term:'STUNNED', regexMatch:false,
    def:'This Vessel has been stunned and can\'t attack right now — some card effects cause this directly (separate from ordinary summoning sickness).' },
  { key:'spent', term:'SPENT', regexMatch:false,
    def:'This Vessel has already attacked this turn and can\'t attack again until your next turn.' },
  { key:'instant', term:'Instant', regexMatch:false,
    def:'An Instant-speed Rite can be cast any time you have priority — including during combat, in response to an attack.' },
  { key:'main', term:'Main', regexMatch:false,
    def:'A Main-speed Rite can only be cast during one of your own Main Phases, not in response to something mid-combat.' },
];
const GLOSSARY_MAP = Object.fromEntries(GLOSSARY.map(g => [g.key, g]));
// Longest term first, so "Breakthrough damage" is matched whole rather than some shorter entry
// (if any existed) eating part of it first.
const GLOSSARY_REGEX_ENTRIES = GLOSSARY.filter(g => g.regexMatch).sort((a,b) => b.term.length - a.term.length);

function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// Wraps every glossary phrase that literally appears in `text` with a clickable <span class="kw">.
// Case-sensitive on purpose (card text is already consistently cased) and skips re-wrapping text
// that's already inside an earlier wrap, by operating on one combined alternation pass rather than
// one regex per term (which would double-wrap on overlapping/adjacent matches).
function markupKeywords(text){
  if(!text) return text;
  if(GLOSSARY_REGEX_ENTRIES.length===0) return text;
  const pattern = new RegExp(GLOSSARY_REGEX_ENTRIES.map(g => escapeRegExp(g.term)).join('|'), 'g');
  return text.replace(pattern, (match) => {
    const entry = GLOSSARY_REGEX_ENTRIES.find(g => g.term===match);
    return wrapKw(match, entry.key);
  });
}
// Deliberately does NOT stopPropagation(): a keyword sits inline inside a card's own clickable
// text, and swallowing the click there would mean clicking a keyword no longer also selects/targets
// the card underneath it — a real regression caught by re-running the existing click-driven
// verification scripts after this feature went in (several started failing to select a Rite whose
// effect text happens to contain a wrapped phrase). Letting the click bubble normally means the
// card's own onclick (selectCard/zoneClick/etc.) still fires exactly as if the keyword wasn't there;
// justOpenedGlossaryPopover is how the popover survives that same bubbling click reaching the
// document-level "click anywhere closes it" listener a few lines below.
let justOpenedGlossaryPopover = false;
function wrapKw(displayText, key){
  return `<span class="kw" data-kw="${key}" onclick="showGlossaryPopover(event,'${key}')">${displayText}<span class="kwMark">?</span></span>`;
}

function showGlossaryPopover(e, key){
  const entry = GLOSSARY_MAP[key];
  if(!entry) return;
  const el = document.getElementById('glossaryPopover');
  if(!el) return;
  el.innerHTML = `<span class="kwTerm">${entry.term}</span>${entry.def}`;
  el.style.display = 'block';
  justOpenedGlossaryPopover = true;
  // Position near the tap/click, nudged on-screen so it doesn't run off the right/bottom edge.
  if(typeof window!=='object' || typeof window.innerWidth!=='number') return; // test harness — no real layout to position against
  const maxLeft = window.innerWidth - 250;
  const maxTop = window.innerHeight - 100;
  el.style.left = Math.max(8, Math.min(e.clientX, maxLeft)) + 'px';
  el.style.top = Math.max(8, Math.min(e.clientY + 12, maxTop)) + 'px';
}
function hideGlossaryPopover(){
  const el = document.getElementById('glossaryPopover');
  if(el) el.style.display = 'none';
}

// Every card rendered anywhere (hand, front row, Void) gets registered here by id so the
// zoom-in preview can look it up from a plain onclick="zoomCard(id)" attribute.
let cardRegistry = {};
function registerCard(c){ if(c && c.id!==undefined) cardRegistry[c.id] = c; }

// domId: normally omitted, so the card's own id is used for its DOM element id ("cardEl-<id>") like
// everywhere else. Pass an override when the SAME card needs to be rendered twice at once (e.g. the
// Void's small "most recent card" peek AND that same card appearing again in the full expanded Void
// list right below it) — two elements can never legally share one id. The override still gets the
// "cardEl-" prefix (so long-press-to-expand keeps finding it) and still starts with the real numeric
// card id (so parseInt() on it recovers that id correctly even with an extra suffix character).
const ELEMENT_NAME = {Red:"Fire",Green:"Earth",Blue:"Water",White:"Wind",Purple:"Shadow"};
// What's PRINTED on the card face. Most cards just print their game effect text; these few differ:
// vanilla Vessels had designer notes in their effect field ("Early wall" etc.) that were never meant
// to appear on the card, Bulwark prints what this engine actually does with it, and Realms get the
// bullet-point layout used on the printed cards.
const CARD_FACE_TEXT = {
  "Ember Acolyte":"", "Rootling Guard":"", "Tide Skirmisher":"", "Gale Herald":"", "Wavebreak Sentinel":"",
  "Bulwark":"Target Vessel gains +0/+3 until end of turn.",
};
const CARD_FLAVOUR = {
  "Bastion Warden":"A statue, lost to time. Its silence has fooled many men. They are silent now too.",
};
function cardFaceTextHtml(v){
  const m = mech(v.name);
  if(v.type==='Realm' && m.realmAura){
    const a = m.realmAura;
    const fmt = mod => `${mod.atk>=0?'+':''}${mod.atk}/${mod.def>=0?'+':''}${mod.def}`;
    const verb = mod => (mod.atk<0||mod.def<0) ? 'get' : 'gain';
    return `<span class="ecBullet">• All ${a.buffColour} Vessels ${verb(a.buffMod)} ${fmt(a.buffMod)}.</span>`
         + `<span class="ecBullet">• All ${a.debuffColour} Vessels ${verb(a.debuffMod)} ${fmt(a.debuffMod)}.</span>`
         + `<span class="ecRemind">Affects both players.</span>`;
  }
  const txt = Object.prototype.hasOwnProperty.call(CARD_FACE_TEXT, v.name) ? CARD_FACE_TEXT[v.name] : (v.effect||'');
  return txt ? markupKeywords(txt) : '';
}
function cardFaceTextSize(v){
  // Effect box is a fixed size, so longer text gets a slightly smaller font (in card-width units, so it
  // scales with the card everywhere it's shown — board, hand, Void, zoom).
  const len = (v.type==='Realm') ? 70 : (Object.prototype.hasOwnProperty.call(CARD_FACE_TEXT, v.name) ? CARD_FACE_TEXT[v.name] : (v.effect||'')).length;
  return Math.max(4.1, Math.min(5.6, Math.sqrt(2500/Math.max(len,1)))).toFixed(2);
}
function renderCard(v, extraClass='', statsOverride=null, domId=null){
  if(!v) return '';
  const elId = domId!=null ? domId : v.id;
  if(v.hidden){
    // A placeholder standing in for a real opponent card we deliberately never received — render
    // a plain face-down back, nothing else (no name/stats exist locally to leak even by accident).
    return `<div class="card ecard hiddenCard ${extraClass}" id="cardEl-${elId}"></div>`;
  }
  registerCard(v);
  const nameSize = Math.min(5.4, 5.4*16/Math.max(16, v.name.length)).toFixed(2);
  let typeLine, cost, statsHtml = '', tag = '', inertNote = '';
  if(v.type==='Rite'){
    typeLine = `Rite · ${v.speed ? wrapKw(v.speed, v.speed.toLowerCase()) : ''}`;
    cost = v.cost;
  } else if(v.type==='Realm'){
    typeLine = 'Realm';
    cost = v.cost;
  } else {
    typeLine = `Vessel · ${ELEMENT_NAME[v.colour]||v.colour}`;
    cost = v.grade;
    tag = v.stunned ? `<span class="tag">${wrapKw('STUNNED','stunned')}</span>`
      : (v.sick ? `<span class="tag">${wrapKw('SICK','sick')}</span>` : (v.attacked ? `<span class="tag">${wrapKw('SPENT','spent')}</span>` : ''));
    const atk = statsOverride ? statsOverride.atk : v.atk;
    const def = statsOverride ? statsOverride.def : v.def;
    // A stat that differs from the printed value (buffed OR debuffed) is shown in yellow.
    const sCls = (now, base) => now>base ? ' statMod statUp' : (now<base ? ' statMod statDown' : '');
    statsHtml = `<div class="ecStats"><span class="statNum${sCls(atk,v.atk)}">${atk}</span> / <span class="statNum${sCls(def,v.def)}">${def}</span></div>`;
    if(isMechanicallyInert(v.name)) inertNote = `<span class="inert">(this effect can't function in this prototype — see notes)</span>`;
  }
  const flavour = CARD_FLAVOUR[v.name] ? `<span class="ecFlavour">${CARD_FLAVOUR[v.name]}</span>` : '';
  return `<div class="card ecard c-${v.colour} ${extraClass}" id="cardEl-${elId}" title="${v.name}">
    <div class="ecArt"><span class="ecGlyph">${ART[v.colour]||''}</span></div>
    <div class="ecFrame"></div>
    <div class="ecGem gem-${v.colour}"></div>
    <div class="ecName" style="font-size:${nameSize}cqw">${v.name}</div>
    <div class="ecCost">${cost}</div>
    <div class="ecType">${typeLine}</div>
    <div class="ecText${CARD_FLAVOUR[v.name]?' hasFlav':''}" style="font-size:${cardFaceTextSize(v)}cqw">${cardFaceTextHtml(v)}${inertNote}${flavour}</div>
    ${statsHtml}${tag}
    <button class="zoomBtn" onclick="event.stopPropagation();zoomCard(${v.id})" title="Enlarge card">🔍</button>
  </div>`;
}

function zoomCard(id){
  const card = cardRegistry[id];
  if(!card) return;
  const inner = document.getElementById('cardZoomInner');
  // A Vessel on the board is shown with its live stats (auras, Realm, temp buffs), same as on the board.
  let eff = null;
  if(card.type==='Vessel' && state && state.players){
    state.players.forEach((p,pi)=>{ (p.front||[]).forEach((v,ci)=>{ if(v && v.id===card.id) eff = getEffectiveStats(pi,ci); }); });
  }
  inner.innerHTML = renderCard(card, '', eff);
  document.getElementById('cardZoomOverlay').classList.add('open');
}
function hideCardZoom(){
  document.getElementById('cardZoomOverlay').classList.remove('open');
}

// Graveyard browser — which player's Void the overlay is currently showing, or null when closed. Kept
// outside `state` (like longPressCardId / justOpenedGlossaryPopover) since it's purely local UI, not
// game state that needs to sync in an online game.
let graveyardOpenPlayerIdx = null;

function showGraveyard(playerIdx){
  graveyardOpenPlayerIdx = playerIdx;
  renderGraveyardOverlay();
  document.getElementById('graveyardOverlay').classList.add('open');
}
function hideGraveyard(){
  graveyardOpenPlayerIdx = null;
  document.getElementById('graveyardOverlay').classList.remove('open');
}
// Rebuilds the graveyard overlay's content from the current game state. Called when it's opened, and
// again from render() on every subsequent render while it's left open, so it stays live — e.g. a new
// card lands in the Void mid-browse, or Second Wind's "eligible" highlight comes or goes as the current
// player selects/deselects it — exactly like renderDeflectPrompt()/renderRiteOfferPrompt() do for their
// own always-rendered-but-usually-hidden overlays.
function renderGraveyardOverlay(){
  if(graveyardOpenPlayerIdx===null) return; // closed — nothing to refresh
  const playerIdx = graveyardOpenPlayerIdx;
  const p = state.players[playerIdx];
  document.getElementById('graveyardTitle').textContent = `${p.name}'s Void — ${p.void.length} card${p.void.length===1?'':'s'}`;

  // Same "is Second Wind armed, targeting THIS player's Void" logic renderBoard() used to compute for
  // the old inline dropdown — replicated standalone since this overlay renders outside renderBoard().
  const curP = state.players[state.current];
  const selectedCard = state.selectedCardId!==null ? curP.hand.find(c=>c.id===state.selectedCardId) : null;
  let secondWindSelected = false;
  if(selectedCard && selectedCard.type==='Rite'){
    const swm = mech(selectedCard.name);
    if(swm.riteEffect && swm.riteEffect.returnGrade1FromVoid && canPlayCard(state.current, selectedCard)) secondWindSelected = true;
  }
  const voidReturnPending = (state.pendingEffect && state.pendingEffect.kind==='returnFromVoid' && state.pendingEffect.playerIdx===playerIdx) || (secondWindSelected && playerIdx===state.current);

  const grid = p.void.length
    ? p.void.slice().reverse().map(c=>{
        const eligible = voidReturnPending && c.type==='Vessel' && c.grade===1;
        // domId 'v'-suffixed: the most recent card also renders in the Void box's small peek (same
        // card id) — this overlay copy needs its own distinct DOM id so the two never collide (see
        // renderCard's domId param).
        return `<div class="gyCardWrap ${eligible?'voidRowEligible':''}" onclick="voidCardClick(${playerIdx},${c.id})">${renderCard(c, '', null, c.id+'v')}</div>`;
      }).join('')
    : `<div class="empty">Void is empty</div>`;
  document.getElementById('graveyardGrid').innerHTML = grid;
}

// Draw animation: a lightweight FLIP — the drawn card is already sitting in its resting spot in the
// hand (render() just laid it out there). We measure the gap between the deck pile and that resting
// spot, snap the card back to the deck's position with zero transition, then release the transform so
// it transitions to its real spot — reading visually as "pulled from the deck into the hand".
function animateDraw(playerIdx, cardId){
  const deckEl = document.getElementById('deckPile-'+playerIdx);
  const cardEl = document.getElementById('cardEl-'+cardId);
  if(!deckEl || !cardEl) return;
  if(typeof deckEl.getBoundingClientRect!=='function' || typeof cardEl.getBoundingClientRect!=='function') return; // not a real browser (e.g. test harness) — skip safely
  const deckRect = deckEl.getBoundingClientRect();
  const cardRect = cardEl.getBoundingClientRect();
  if(deckRect.width===0 && deckRect.height===0) return; // deck pile off-screen/not laid out — nothing sensible to animate from
  const dx = (deckRect.left + deckRect.width/2) - (cardRect.left + cardRect.width/2);
  const dy = (deckRect.top + deckRect.height/2) - (cardRect.top + cardRect.height/2);

  cardEl.style.transition = 'none';
  cardEl.style.zIndex = '90';
  cardEl.style.transform = `translate(${dx}px, ${dy}px) scale(.42) rotate(-10deg)`;
  cardEl.style.opacity = '0.25';

  // Force a reflow so the browser commits the "start" state above before we animate to the end state.
  void cardEl.offsetWidth;

  cardEl.style.transition = 'transform .5s cubic-bezier(.22,.8,.28,1), opacity .4s ease-out';
  cardEl.style.transform = 'translate(0,0) scale(1) rotate(0deg)';
  cardEl.style.opacity = '1';

  const cleanup = () => {
    cardEl.style.transition = '';
    cardEl.style.zIndex = '';
    cardEl.removeEventListener('transitionend', cleanup);
  };
  cardEl.addEventListener('transitionend', cleanup);
}

// Captures a card's current on-screen rect (call this BEFORE the state mutation that will move/remove
// it, so the "from" position is still real). Returns null safely outside a real browser, or if the
// card isn't currently laid out (e.g. it's the AI's hidden hand, or it's off-screen).
function captureCardRect(cardId){
  const el = document.getElementById('cardEl-'+cardId);
  if(!el || typeof el.getBoundingClientRect!=='function') return null;
  const r = el.getBoundingClientRect();
  if(r.width===0 && r.height===0) return null;
  return r;
}

// General-purpose FLIP move-in animation, generalized from animateDraw above to take an arbitrary
// starting rect instead of always the deck pile: the card is already sitting in its NEW resting spot
// (render() just put it there — hand, board, Void, wherever it ended up), we snap it back to fromRect
// with zero transition, then release so it eases into its real spot. Covers hand->board (placement),
// hand->Void (casting a Rite, discarding), board->Void (a Vessel destroyed in combat), and board->hand
// (a bounced Vessel) — anywhere the SAME card id re-appears with a new cardEl-<id> after a render().
// No-ops safely if fromRect is null, or the card's new location was never rendered with a cardEl id
// (e.g. a played Realm — the Realm Zone shows text, not a card, so there's nothing to animate into).
function animateCardFlip(cardId, fromRect, opts){
  opts = opts || {};
  if(!fromRect) return;
  const cardEl = document.getElementById('cardEl-'+cardId);
  if(!cardEl || typeof cardEl.getBoundingClientRect!=='function') return;
  const toRect = cardEl.getBoundingClientRect();
  if(toRect.width===0 && toRect.height===0) return;
  const dx = (fromRect.left + fromRect.width/2) - (toRect.left + toRect.width/2);
  const dy = (fromRect.top + fromRect.height/2) - (toRect.top + toRect.height/2);
  const scale = opts.scale!==undefined ? opts.scale : 1;
  const rotate = opts.rotate!==undefined ? opts.rotate : 0;

  cardEl.style.transition = 'none';
  cardEl.style.zIndex = '90';
  cardEl.style.transform = `translate(${dx}px, ${dy}px) scale(${scale}) rotate(${rotate}deg)`;
  cardEl.style.opacity = opts.fade ? '0.3' : '1';
  void cardEl.offsetWidth; // force a reflow so the browser commits the "start" state above before animating

  cardEl.style.transition = 'transform .4s cubic-bezier(.22,.8,.28,1), opacity .3s ease-out';
  cardEl.style.transform = 'translate(0,0) scale(1) rotate(0deg)';
  cardEl.style.opacity = '1';

  const cleanup = () => {
    cardEl.style.transition = '';
    cardEl.style.zIndex = '';
    cardEl.removeEventListener('transitionend', cleanup);
  };
  cardEl.addEventListener('transitionend', cleanup);
}

// A short, non-blocking "lunge" toward a target element and back, for attacks. Doesn't move the card
// to a new DOM location (it's still in its own board cell before and after) and never delays the
// actual combat resolution — it's fired right before executeAttack() mutates state, purely cosmetic,
// using the Web Animations API so it plays independently of whatever render() does a moment later.
function animateAttackLunge(cardId, targetEl){
  const cardEl = document.getElementById('cardEl-'+cardId);
  if(!cardEl || !targetEl || typeof cardEl.getBoundingClientRect!=='function' || typeof cardEl.animate!=='function') return;
  const from = cardEl.getBoundingClientRect();
  const to = targetEl.getBoundingClientRect();
  if((from.width===0 && from.height===0) || (to.width===0 && to.height===0)) return;
  const dx = (to.left + to.width/2 - (from.left + from.width/2)) * 0.55; // lunge partway, not all the way to the target
  const dy = (to.top + to.height/2 - (from.top + from.height/2)) * 0.55;
  try{
    cardEl.animate([
      { transform:'translate(0,0)' },
      { transform:`translate(${dx}px, ${dy}px)` },
      { transform:'translate(0,0)' }
    ], { duration:320, easing:'ease-in-out' });
  }catch(e){}
}

// Highlights board zones that are valid click targets for the current state.pendingEffect (an
// on-play effect awaiting a target). Returns {cls, overlay} to merge into a zone's rendering, or
// null if this zone isn't a valid target for the current pending effect.
function pendingEffectZoneOverlay(pe, zonePlayerIdx, colIdx, v){
  const riteBlocked = pe.fromRite && isProtectedFromEnemyRite(zonePlayerIdx, colIdx, pe.playerIdx);
  if(pe.kind==='damageAnyVessel' || pe.kind==='debuffTargetVessel' || pe.kind==='stunTargetVessel' || pe.kind==='permBuffTargetVessel'){
    if(!v || riteBlocked) return null;
    return { cls:'targetable', overlay:'<div class="zoneOverlay">▸ TARGET</div>' };
  }
  if(pe.kind==='bounceTargetEnemyVessel'){
    if(!v || zonePlayerIdx===pe.playerIdx || riteBlocked) return null;
    return { cls:'targetable', overlay:'<div class="zoneOverlay">▸ BOUNCE</div>' };
  }
  if(pe.kind==='bounceAnyVessel'){
    if(!v || riteBlocked) return null;
    return { cls:'targetable', overlay:'<div class="zoneOverlay">▸ BOUNCE</div>' };
  }
  if(pe.kind==='reattuneColumn'){
    if(zonePlayerIdx!==pe.playerIdx || pe.stage!=='selectColumn') return null;
    const col = state.players[zonePlayerIdx].columns[colIdx];
    if(!col.colour) return null;
    return { cls:'targetable', overlay:'<div class="zoneOverlay">▸ REATTUNE</div>' };
  }
  if(pe.kind==='redirectAttack'){
    if(zonePlayerIdx!==pe.playerIdx) return null;
    const pa = state.pendingAttack;
    if(!pa || !v || colIdx===pa.targetColIdx) return null;
    const attacker = state.players[state.current].front[pa.attackerColIdx];
    if(attacker && mech(attacker.name).cannotBeBlockedByGrade1 && v.grade===1) return null;
    return { cls:'targetable', overlay:'<div class="zoneOverlay">▸ REDIRECT HERE</div>' };
  }
  if(pe.kind==='moveFriendlyAdjacent'){
    if(zonePlayerIdx!==pe.playerIdx) return null;
    if(pe.stage==='selectSource'){
      if(!v) return null;
      const p = state.players[zonePlayerIdx];
      const hasEmptyNeighbour = (colIdx>0 && !p.front[colIdx-1]) || (colIdx<4 && !p.front[colIdx+1]);
      if(!hasEmptyNeighbour) return null;
      return { cls:'targetable', overlay:'<div class="zoneOverlay">▸ MOVE THIS</div>' };
    }
    if(pe.stage==='selectDest'){
      if(colIdx===pe.moveSourceColIdx) return { cls:'selected', overlay:'' };
      if(v || Math.abs(colIdx-pe.moveSourceColIdx)!==1) return null;
      return { cls:'targetable', overlay:'<div class="zoneOverlay">▸ MOVE HERE</div>' };
    }
  }
  return null;
}

function renderBoard(playerIdx, mirrored, domId){
  const p = state.players[playerIdx];
  const isCurrent = playerIdx===state.current;
  const phase = PHASES[state.phaseIdx];
  const hostEl = document.getElementById(domId); if(hostEl) hostEl.classList.toggle('activeSide', isCurrent); // Arena skin: lights up whose side it is

  // Economy-teaching visual cue: a one-render flash on the essence badge the moment essence is spent
  // (see flashEssenceSpend()) — consumed and cleared here so it only ever plays once per spend.
  const essenceFlashing = !!(state.essenceFlash && state.essenceFlash.playerIdx===playerIdx);
  if(essenceFlashing) state.essenceFlash = null;

  let header = `<div class="boardHeader">
    <div class="pname">${p.name}${isCurrent?'<span class="active-tag">● ACTIVE</span>':''}</div>
    <div class="badges">
      <div class="badge hpBadge"><span class="badgeIcon">HP</span>${p.hp}</div>
      <div class="badge devBadge" title="${p.devotionTotal-p.devotion} of ${p.devotionTotal} devotion spent on columns this turn"><span class="badgeIcon">D</span>${p.devotion}/${p.devotionTotal}</div>
      <div class="badge essenceBadge${essenceFlashing?' essenceFlashCue':''}" title="${p.essenceTotal-p.essence} of ${p.essenceTotal} Attune spent playing cards this turn"><span class="badgeIcon">A</span>${p.essence}/${p.essenceTotal}</div>
      <div class="badge deckBadge"><span class="badgeIcon">✋</span>${p.hand.length} in hand</div>
    </div>
  </div>`;

  // Each column is ONE merged box: the Vessel zone on top (placement/combat), a thin Devotion strip
  // on the bottom (attunement info, read-only) — one continuous zone per column instead of two
  // separately-framed rows. Void + Deck share the 6th column the same way (big/strip split).
  const selectedCard = state.selectedCardId!==null ? p.hand.find(c=>c.id===state.selectedCardId) : null;
  let rowHtml = `<div class="row">`;
  for(let i=0;i<5;i++){
    const v = p.front[i];
    const col = p.columns[i];
    let boxCls='colBox'+(col.colour?' devoted dev-'+col.colour:'')+(v?'':' isEmpty'); let overlay=''; // devoted/isEmpty: styling hooks only
    const onclick = `zoneClick(${playerIdx},${i})`;

    if(isMainPhase(phase) && isCurrent && selectedCard && selectedCard.type==='Vessel'){
      // canPlayCard() here matters for the same reason it does for Rites below: without it, a Vessel
      // you can't actually afford (not enough essence) would still light up a legal-looking zone.
      if(!v && canPlace(playerIdx,i,selectedCard) && canPlayCard(state.current,selectedCard)){ boxCls+=' placeable'; overlay='<div class="zoneOverlay">▸ PLACE HERE</div>'; }
    }
    // A selected board-targeted Rite lights up legal Vessel targets on EITHER board (own or enemy) —
    // mirrors pendingEffectZoneOverlay below, but before anything's been paid (see castRiteAtZone).
    // The canPlayCard() check matters here specifically: without it, a Rite you can't actually afford
    // right now would still show "▸ TARGET" on a legal-looking zone, inviting a click that then does
    // nothing (castRiteAtZone would just log why and bail) — don't light up a target you can't hit.
    // Also allowed during Battle phase for Instant-speed Rites (Searing Strike, Molten Burst, Bulwark,
    // Crosswind are all legal to cast then — see canPlayCard) — zoneClick() routes a click to the Rite
    // cast first in that case too (see its comment), so this flag is computed once and used below to
    // make sure the Battle-phase "▸ SELECT"/"▸ ATTACK" overlays don't paint over it on the same zone.
    const riteTargetingNow = (isMainPhase(phase) || phase==='Battle') && selectedCard && selectedCard.type==='Rite'
      && canPlayCard(state.current, selectedCard) && riteEffectWantsBoardZone(mech(selectedCard.name))
      && riteZoneTargetValid(mech(selectedCard.name).riteEffect, playerIdx, i, state.current);
    if(riteTargetingNow){
      boxCls+=' targetable'; overlay='<div class="zoneOverlay">▸ TARGET</div>';
    }
    // A selected Reattune with its colour already staged: light up this player's own attuned columns.
    if(isMainPhase(phase) && isCurrent && state.reattuneStaging && state.selectedCardId===state.reattuneStaging.cardId && col.colour){
      boxCls+=' targetable'; overlay='<div class="zoneOverlay">▸ REATTUNE</div>';
    }
    if(phase==='Battle' && !riteTargetingNow && !state.pendingRiteOffer && isCurrent && v && !v.sick && !v.attacked && !v.stunned){ boxCls+=' placeable'; overlay='<div class="zoneOverlay">▸ SELECT</div>'; }
    if(phase==='Battle' && !riteTargetingNow && !state.pendingRiteOffer && isCurrent && state.selectedAttackerZone===String(i)) boxCls+=' targetable';
    if(phase==='Battle' && !riteTargetingNow && !state.pendingRiteOffer && !isCurrent && state.selectedAttackerZone){
      const attacker = state.players[state.current].front[Number(state.selectedAttackerZone)];
      const ignoreG1 = attacker && mech(attacker.name).cannotBeBlockedByGrade1;
      if(v && !(ignoreG1 && v.grade===1)){ boxCls+=' targetable'; overlay='<div class="zoneOverlay">▸ ATTACK</div>'; }
    }
    // redirectAttack (Deflect) is the one pendingEffect whose actor is the DEFENDER, not state.current —
    // everything else is cast on your own turn so pe.playerIdx===state.current always holds for those.
    if(state.pendingEffect && (state.pendingEffect.playerIdx===state.current || state.pendingEffect.kind==='redirectAttack')){
      const peOverlay = pendingEffectZoneOverlay(state.pendingEffect, playerIdx, i, v);
      if(peOverlay){ boxCls+=' '+peOverlay.cls; overlay=peOverlay.overlay; }
    }
    if(phase==='Devotion' && isCurrent && state.selectedAttuneColour){
      const grade = attuneTargetGrade(playerIdx, i, state.selectedAttuneColour);
      const cost = attuneCost(i, state.selectedAttuneColour, grade);
      if(canAttune(i, grade, state.selectedAttuneColour)){ boxCls+=' placeable'; overlay=`<div class="zoneOverlay">▸ DEVOTE G${grade} (-${cost})</div>`; }
    }

    let queuedTag = '';
    if(isMainPhase(phase) && isCurrent && selectedCard && selectedCard.type==='Vessel' && !v && canPlace(playerIdx,i,selectedCard) && canPlayCard(state.current,selectedCard)){
      queuedTag = `<span class="queuedTag">▸${selectedCard.name}</span>`;
    }
    const devStripContent = col.colour
      ? `<span class="colDot dot-${col.colour}"></span><span>${col.colour} G${col.grade}</span>`
      : `<span class="devStripEmpty">undevoted</span>`;

    // Economy-teaching visual cue: a one-render glow on the column strip the instant it's attuned
    // (see flashAttune()) — consumed and cleared here so it only ever plays once per attunement.
    const attuneGlowing = !!(state.attuneFlash && state.attuneFlash.playerIdx===playerIdx && state.attuneFlash.colIdx===i);
    if(attuneGlowing) state.attuneFlash = null;

    const effStats = v ? getEffectiveStats(playerIdx, i) : null;
    rowHtml += `<div class="col"><div id="zone-${playerIdx}-${i}-front" class="${boxCls}" onclick="${onclick}" ondragover="event.preventDefault()" ondrop="dropOnZone(event,${playerIdx},${i})">
      <div class="vesselZone">${v?renderCard(v, state.selectedAttackerZone===String(i)?'selected':'', effStats):'<span class="vesselPlaceholder">FRONT</span>'}${overlay}</div>
      <div class="devStrip${attuneGlowing?' attuneGlowCue':''}">${devStripContent}${queuedTag}</div>
    </div></div>`;
  }

  // Void + Deck share the 6th column: Void (face-up, most recent card) on top, Deck (face-down) as the
  // strip. The Void box is just a peek — click it (anywhere but its own 🔍 button) to open the full
  // graveyard browser overlay (renderGraveyardOverlay/showGraveyard, defined near that overlay's HTML),
  // which is where the whole pile actually gets browsed; see that overlay for why it's a separate
  // full-screen modal rather than a dropdown living in this same clipped box.
  const topVoidCard = p.void.length ? p.void[p.void.length-1] : null;
  rowHtml += `<div class="col"><div class="colBox voidDeckBox">
      <div class="voidZoneBig" onclick="showGraveyard(${playerIdx})">
          ${topVoidCard
            ? renderCard(topVoidCard) + `<span class="voidCountBadge">${p.void.length}</span>`
            : `<span class="mzLabel">Void</span><span class="mzCount">0</span>`}
      </div>
      <div class="deckStrip" id="deckPile-${playerIdx}"><div class="cardBackMini"></div><span class="mzCount">${p.deck.length}</span></div>
    </div></div>`;
  rowHtml += `</div>`;

  const body = rowHtml;

  if(playerIdx!==state.current && PHASES[state.phaseIdx]==='Battle' && state.selectedAttackerZone){
    const atkV = state.players[state.current].front[Number(state.selectedAttackerZone)];
    const ignoreG1Direct = atkV && mech(atkV.name).cannotBeBlockedByGrade1;
    const extraBtn = `<div style="text-align:center;margin-top:4px;">
      <button onclick="enemyFaceClick()" ${frontRowHasVessels(playerIdx, ignoreG1Direct) ? 'disabled':''}>
        Attack ${p.name} directly (only if no front-row Vessels${ignoreG1Direct?' above Grade 1':''})
      </button></div>`;
    document.getElementById(domId).innerHTML = header + body + extraBtn;
  } else {
    document.getElementById(domId).innerHTML = header + body;
  }
}

function hasEligibleColumn(playerIdx, card){
  const p = state.players[playerIdx];
  // A column only counts if it's actually EMPTY, not just the right colour/grade — otherwise a Vessel
  // whose only matching column is already occupied still shows up fully lit/clickable in hand, inviting
  // a play that placeSelected() then silently blocks (it already checks p.front[colIdx] itself).
  return p.columns.some((col,i) => col.colour===card.colour && col.grade>=card.grade && !p.front[i]);
}

function renderHand(){
  // Online: this panel is always MY OWN hand, regardless of whose turn it is — the opponent's hand
  // never gets rendered here at all (it lives, masked, in state.players[opp(mySeat)] and is never read).
  // Same idea vs the AI: always show the human's own seat, never the AI's hand, even during its turn.
  const seat = net.isOnline ? net.mySeat : (aiOpponentActive() ? opp(ai.seat) : state.current);
  const p = state.players[seat];
  const phase = PHASES[state.phaseIdx];
  const pendingDiscard = state.pendingEffect && state.pendingEffect.kind==='discardFromEffect' && state.pendingEffect.playerIdx===seat;
  // Broadened from "Main phase only" so Instant-speed Rites are still clickable during your own Battle
  // Phase — see canPlayCard() for the actual per-card legality (phase + essence + speed) that decides
  // whether a click does anything.
  const generalClickWindow = isMyActionableTurn() && !state.pendingEffect && !state.pendingAttack && (isMainPhase(phase) || phase==='Battle');
  document.getElementById('handTitle').textContent = `${p.name}'s Hand — ${p.hand.length}/6${phase==='End'&&p.hand.length>6&&isMyActionableTurn()?' (OVER CAP — click a card to discard)':(pendingDiscard?' (click a card to discard for the pending effect)':'')}`;

  // Big deck display next to the hand — a large, clearly-visible card BACK (sleeve design), not
  // just the small corner icon in the Void/Deck column. Purely a visual showcase, no interaction.
  const deckDisplayEl = document.getElementById('deckDisplayBig');
  if(deckDisplayEl){
    deckDisplayEl.innerHTML = `<div class="deckSleeve"></div><span class="deckDisplayLabel">Deck</span><span class="deckDisplayCount">${p.deck.length}</span>`;
  }

  const el = document.getElementById('handCards');
  const n = p.hand.length;
  const mid = (n-1)/2;
  el.innerHTML = p.hand.map((c,i)=>{
    const playable = canPlayCard(seat, c);
    const canDiscard = (phase==='End' && p.hand.length>6 && isMyActionableTurn() && !state.pendingEffect) || pendingDiscard;
    // Cards are ALWAYS clickable while in their legal window, even if unaffordable/mismatched right
    // now — clicking explains why, instead of doing nothing (see castSpellCard/explainCardSelection).
    const clickable = generalClickWindow || canDiscard;
    const cls = (c.id===state.selectedCardId?'selected':'');
    const offset = i-mid;
    const rotate = offset*3.5;
    const lift = -Math.abs(offset)*3;
    return `<div class="cardWrap" draggable="${playable && c.type==='Vessel'}" ondragstart="dragStartCard(event,${c.id})" ondragend="dragEndCard(event)"
        style="transform:rotate(${rotate}deg) translateY(${-lift}px);opacity:${(clickable&&!playable&&!canDiscard)?.5:1}" onclick="${clickable?`selectCard(${c.id})`:''}">
      ${renderCard(c, cls)}
    </div>`;
  }).join('');
}

function renderPhaseTracker(){
  const el = document.getElementById('phaseStepsList');
  const idx = state.phaseIdx;
  const untapStep = `<div class="phaseStep done"><span class="stepNum">✓</span>${UNTAP_LABEL}</div>`;
  const steps = PHASES.map((ph,i)=>{
    const cls = i===idx ? 'active' : (i<idx ? 'done' : '');
    const marker = i<idx ? '✓' : (i+1);
    return `<div class="phaseStep ${cls}"><span class="stepNum">${marker}</span>${PHASE_LABELS[ph]}</div>`;
  }).join('');
  el.innerHTML = untapStep + steps;
}

// Compact Devotion picker — lives in the sidebar under Next Phase instead of a big horizontal panel.
// Pick a colour here, then click the target column on the board (which lights up to show the
// resulting grade for each column) — the same select-then-click-a-zone pattern as playing a card.
function renderDevotionPanel(){
  const picker = document.getElementById('devotionPicker');
  const p = cur();
  const phase = PHASES[state.phaseIdx];
  const pe = state.pendingEffect;
  // Reattune's colour choice is picked here too (reusing the same panel) — the sidebar being the one
  // place a colour gets picked regardless of what triggered it.
  if(pe && pe.kind==='reattuneColumn' && pe.stage==='selectColour' && isMyActionableTurn()){
    picker.style.display='flex';
    document.getElementById('devPickerLabelText').textContent = `${pe.sourceName}: pick the new colour for the target column:`;
    document.getElementById('devColourBtns').innerHTML = p.deckColours.map(c=>
