      `<button class="b-${c}" onclick="selectReattuneColour('${c}')">${c}</button>`
    ).join('');
    return;
  }
  // Reattune's NEW pre-payment flow: selected but not yet cast — nothing has been spent, so this is
  // just picking which colour to stage before the follow-up column click (see castReattuneAtColumn).
  const selReattuneCard = !pe && !state.pendingAttack && state.selectedCardId!=null && isMyActionableTurn()
    ? p.hand.find(c=>c.id===state.selectedCardId) : null;
  if(selReattuneCard && selReattuneCard.name==='Reattune' && canPlayCard(state.current, selReattuneCard)){
    picker.style.display='flex';
    document.getElementById('devPickerLabelText').textContent = `Reattune: pick the new colour for the target column:`;
    document.getElementById('devColourBtns').innerHTML = p.deckColours.map(c=>{
      const active = (state.reattuneStaging && state.reattuneStaging.colour===c) ? 'active' : '';
      return `<button class="b-${c} ${active}" onclick="selectReattuneStagingColour('${c}')">${c}</button>`;
    }).join('');
    return;
  }
  if(phase!=='Devotion' || !isMyActionableTurn()){ picker.style.display='none'; state.selectedAttuneColour=null; return; }
  picker.style.display='flex';
  // Devotion is a per-turn pool, not a one-shot token — keep the picker open and show what's left to
  // spend, so it's clear you can attune several columns (or bump one further) in the same turn.
  document.getElementById('devPickerLabelText').textContent = `Devote a colour, then click a column — ${p.devotionTotal-p.devotion} of ${p.devotionTotal} devotion spent this turn (${p.devotion} left):`;
  const btnsEl = document.getElementById('devColourBtns');
  if(p.devotion<=0){
    btnsEl.innerHTML = `<div class="devPickerDone">✓ All ${p.devotionTotal} devotion spent this turn</div>`;
    return;
  }
  btnsEl.innerHTML = p.deckColours.map(c=>{
    const active = state.selectedAttuneColour===c ? 'active' : '';
    const affordable = p.devotion>=1 ? '' : 'disabled';
    return `<button class="b-${c} ${active}" ${affordable} onclick="selectAttuneColour('${c}')">${c}</button>`;
  }).join('');
}

function explainCardSelection(card){
  const p = cur();
  if(!card) return '';
  const label = PHASE_LABELS[PHASES[state.phaseIdx]] || 'Main Phase';
  if(card.type==='Rite' || card.type==='Realm'){
    if(!canPlayCard(state.current, card)){
      if(p.essence < card.cost) return `<span class="step">${label}</span> — <b>${card.name}</b> needs ${card.cost} Attune, you have ${p.essence}. Click the card again to deselect it.`;
      if(card.type==='Rite' && card.speed!=='Instant') return `<span class="step">${label}</span> — <b>${card.name}</b> is Main-speed — only playable during Main Phase 1 or 2. Click it again to deselect.`;
      if(card.type==='Rite') return `<span class="step">${label}</span> — <b>${card.name}</b> can only be played during your own Main or Battle Phase. Click it again to deselect.`;
      return `<span class="step">${label}</span> — <b>${card.name}</b>: Realms are Main-speed — only playable during Main Phase 1 or 2. Click it again to deselect.`;
    }
    if(card.type==='Realm') return `<span class="step">${label}</span> — <b>${card.name}</b> selected. It has no target — click it <b>again</b> to play it (this replaces whichever Realm is currently active).`;
    const m = mech(card.name);
    const re = m.riteEffect || {};
    if(re.drawCard) return `<span class="step">${label}</span> — <b>${card.name}</b> selected. It has no target — click it <b>again</b> to cast it and draw a card.`;
    if(re.returnGrade1FromVoid) return `<span class="step">${label}</span> — <b>${card.name}</b> selected — click a <b style="color:#ffd76b">highlighted</b> Grade 1 Vessel in your Void (open it below the board) to cast it and return that Vessel to hand.`;
    if(re.reattuneColumn) return `<span class="step">${label}</span> — <b>${card.name}</b> selected — pick the new colour in the sidebar panel, then click one of your devoted columns to apply it.`;
    if(riteEffectWantsBoardZone(m)) return `<span class="step">${label}</span> — <b>${card.name}</b> selected — click a <b style="color:#7ee787">highlighted</b> Vessel on either board to cast it against that target.`;
    return `<span class="step">${label}</span> — <b>${card.name}</b> selected. Click it again to deselect.`;
  }
  // Placement is free once a column is attuned — devotion was already spent attuning it.
  // The only reason a card can't be placed now is a colour/grade mismatch with every attuned column.
  if(!p.columns.some(c=>c.colour===card.colour && c.grade>=card.grade)){
    return `<span class="step">${label}</span> — <b>${card.name}</b> is <b>${card.colour} Grade ${card.grade}</b>, but no column is devoted to that colour at grade ${card.grade} or higher. Devote a matching column (Devotion Phase) to unlock it, or pick a different card. No zones will light up for this card.`;
  }
  return `<span class="step">${label}</span> — <b>${card.name}</b> selected — placement is free. Click or drop it on a <b style="color:#7ee787">green "PLACE HERE"</b> zone to summon it. Click the card again to deselect.`;
}

function pendingEffectInstruction(pe){
  const sourceName = `<b>${pe.sourceName}</b>`;
  if(pe.kind==='damageAnyVessel') return `<span class="step">Effect Pending</span> — ${sourceName}: click any Vessel on either board to deal ${pe.amount} damage to it.`;
  if(pe.kind==='debuffTargetVessel') return `<span class="step">Effect Pending</span> — ${sourceName}: click any Vessel on either board to apply ${pe.atk>=0?'+':''}${pe.atk}/${pe.def>=0?'+':''}${pe.def} until end of turn.`;
  if(pe.kind==='stunTargetVessel') return `<span class="step">Effect Pending</span> — ${sourceName}: click any Vessel on either board to stun it (it can't attack next turn).`;
  if(pe.kind==='bounceTargetEnemyVessel') return `<span class="step">Effect Pending</span> — ${sourceName}: click an <b>enemy</b> Vessel to return it to their hand.`;
  if(pe.kind==='bounceAnyVessel') return `<span class="step">Effect Pending</span> — ${sourceName}: click any Vessel on either board to return it to its owner's hand.`;
  if(pe.kind==='permBuffTargetVessel') return `<span class="step">Effect Pending</span> — ${sourceName}: click any Vessel on either board to apply ${pe.atk>=0?'+':''}${pe.atk}/${pe.def>=0?'+':''}${pe.def} <b>permanently</b>.`;
  if(pe.kind==='returnFromVoid') return `<span class="step">Effect Pending</span> — ${sourceName}: click a <b style="color:#ffd76b">highlighted</b> Grade 1 Vessel in your Void (open it below the board) to return it to hand.`;
  if(pe.kind==='reattuneColumn'){
    return pe.stage==='selectColour'
      ? `<span class="step">Effect Pending</span> — ${sourceName}: pick the new colour in the sidebar panel.`
      : `<span class="step">Effect Pending</span> — ${sourceName}: click one of your own devoted columns to change it to ${pe.selectedColour}.`;
  }
  if(pe.kind==='redirectAttack') return `<span class="step">Deflect</span> — ${sourceName}: click a <b>different</b> Vessel you control to redirect the attack onto it.`;
  if(pe.kind==='moveFriendlyAdjacent'){
    return pe.stage==='selectSource'
      ? `<span class="step">Effect Pending (optional)</span> — ${sourceName}: click one of your own Vessels with an empty adjacent column to move it, or click <b>Skip</b>.`
      : `<span class="step">Effect Pending</span> — ${sourceName}: click the empty column next to the selected Vessel to move it there, or click <b>Skip</b>.`;
  }
  if(pe.kind==='discardFromEffect') return `<span class="step">Effect Pending</span> — ${sourceName}: click a card in your hand to discard it.`;
  return `<span class="step">Effect Pending</span> — resolve the effect from ${sourceName}.`;
}

function updateBigInstruction(){
  const p = cur();
  const phase = PHASES[state.phaseIdx];
  const el = document.getElementById('bigInstruction');
  let msg = '';
  if(state.gameOver){
    msg = `Game over — click <b>Restart Game</b> to play again.`;
  } else if(state.pendingEffect){
    msg = pendingEffectInstruction(state.pendingEffect);
  } else if(state.pendingAttack){
    msg = `<span class="step">Attack Declared</span> — respond to the Deflect prompt above (play it, or resolve the attack as-is).`;
  } else if(net.isOnline && net.connected && state.current!==net.mySeat){
    msg = `<span class="step">${PHASE_LABELS[phase]}</span> — Waiting for <b>${p.name}</b> to act…`;
  } else if(phase==='Devotion'){
    msg = p.devotion<=0
      ? `<span class="step">Devotion Phase</span> — All ${p.devotionTotal} devotion spent this turn. Click <b>Next Phase</b> to draw your card.`
      : `<span class="step">Devotion Phase</span> — ${p.name} has spent <b>${p.devotionTotal-p.devotion} of ${p.devotionTotal}</b> devotion this turn (<b>${p.devotion} left</b>) — devote as many columns (or bump one further) as you can afford. Pick a colour in the sidebar, then click a column — or click <b>Next Phase</b> when you're done.`;
  } else if(phase==='Draw'){
    msg = `<span class="step">Draw Phase</span> — resolved automatically. Click <b>Next Phase</b> to continue to Main Phase 1.`;
  } else if(isMainPhase(phase)){
    const label = PHASE_LABELS[phase];
    if(state.selectedCardId!==null){
      const card = p.hand.find(c=>c.id===state.selectedCardId);
      msg = explainCardSelection(card);
    } else {
      const anyAttuned = p.columns.some(c=>c.colour);
      msg = anyAttuned
        ? `<span class="step">${label}</span> — Click a card in your hand to select it, then click a highlighted zone to place it. Only columns devoted to that card's colour (grade or higher) light up.`
        : `<span class="step">${label}</span> — No columns devoted yet, so nothing can be placed this turn. Click <b>Next Phase</b> to continue (devote next turn).`;
    }
  } else if(phase==='Battle'){
    if(state.selectedAttackerZone){
      msg = `<span class="step">Battle Phase</span> — Attacker selected. Click a <b style="color:#ffd76b">yellow "ATTACK"</b> zone on the enemy board, or "Attack directly" if they have no front-row Vessels.`;
    } else {
      const hasAttackers = p.front.some(v=>v && !v.sick && !v.attacked && !v.stunned);
      msg = hasAttackers
        ? `<span class="step">Battle Phase</span> — Click one of your <b style="color:#7ee787">green</b> front-row Vessels to select it as an attacker.`
        : `<span class="step">Battle Phase</span> — No Vessels available to attack. Click <b>Next Phase</b> to continue.`;
    }
  } else if(phase==='End'){
    msg = p.hand.length>6
      ? `<span class="step">End Phase</span> — Hand cap is 6, you have ${p.hand.length}. Click cards in your hand to discard down to 6 before ending your turn.`
      : `<span class="step">End Phase</span> — Click <b>End Turn</b> to pass to ${curOpp().name}.`;
  }
  el.innerHTML = msg;
}

function renderStickyHud(){
  const p = cur();
  const phase = PHASES[state.phaseIdx];
  const hud = document.getElementById('stickyHud');
  hud.innerHTML = `
    <div class="hudName">${p.name} <span class="hudPhase">· ${PHASE_LABELS[phase]}</span></div>
    <div class="hudBadges">
      <div class="badge hpBadge"><span class="badgeIcon">HP</span>${p.hp}</div>
      <div class="badge devBadge" title="${p.devotionTotal-p.devotion} of ${p.devotionTotal} devotion spent on columns this turn"><span class="badgeIcon">D</span>${p.devotion}/${p.devotionTotal} devotion</div>
      <div class="badge essenceBadge" title="${p.essenceTotal-p.essence} of ${p.essenceTotal} Attune spent playing cards this turn"><span class="badgeIcon">A</span>${p.essence}/${p.essenceTotal} Attune</div>
      <div class="badge deckBadge"><span class="badgeIcon">≡</span>${p.deck.length} deck</div>
      <div class="badge deckBadge"><span class="badgeIcon">✋</span>${p.hand.length}/6 hand</div>
    </div>`;
}

function renderRealmZone(){
  const el = document.getElementById('realmZone');
  if(!el) return;
  if(!state.realm){
    el.innerHTML = `<b>Realm Zone</b> — shared by both players, only one Realm can be active at a time. No Realm is currently active.`;
    return;
  }
  const owner = state.players[state.realm.ownerIdx];
  const ra = mech(state.realm.name).realmAura;
  const auraText = ra
    ? `${ra.buffColour} Vessels ${ra.buffMod.atk>=0?'+':''}${ra.buffMod.atk}/${ra.buffMod.def>=0?'+':''}${ra.buffMod.def}, ${ra.debuffColour} Vessels ${ra.debuffMod.atk>=0?'+':''}${ra.debuffMod.atk}/${ra.debuffMod.def>=0?'+':''}${ra.debuffMod.def} — applies to <b>both players'</b> Vessels of that colour.`
    : '';
  el.innerHTML = `<b>Realm Zone</b> — active: <b>${state.realm.name}</b> (played by ${owner.name}). ${auraText}`;
}

// The Deflect reaction prompt. Deliberately a standalone prompt rather than routed through the normal
// hand UI: renderHand() always shows the ACTIVE player's hand, but Deflect belongs to the DEFENDER, who
// isn't the active player and whose hand isn't on screen at all during the attacker's turn in this
// hotseat build. This reveals just the fact that Deflect is playable, not the rest of their hand.
function renderDeflectPrompt(){
  const el = document.getElementById('deflectPrompt');
  if(!el) return;
  const pa = state.pendingAttack;
  if(!pa || (state.pendingEffect && state.pendingEffect.kind==='redirectAttack')){ el.style.display='none'; return; }
  const defenderIdx = opp(state.current);
  const defender = state.players[defenderIdx];
  el.style.display='flex';
  if(aiOpponentActive() && defenderIdx===ai.seat){
    // The AI is the one being attacked — it decides Deflect itself (see aiDecideDeflect), so no
    // human-clickable buttons here, just a status line while it "thinks".
    el.innerHTML = `<span><b>${defender.name}</b> is being attacked! The AI is deciding how to respond…</span>`;
    return;
  }
  const deflectCard = defender.hand.find(c=>c.name==='Deflect');
  el.innerHTML = `<span><b>${defender.name}</b> is being attacked!</span>
    ${deflectCard && defender.essence>=deflectCard.cost
      ? `<button onclick="offerDeflect(${deflectCard.id})">Play Deflect (${deflectCard.cost} essence) — redirect to a different Vessel</button>`
      : ''}
    <button onclick="declineDeflect()">Resolve Attack As-Is</button>`;
}

function renderRiteOfferPrompt(){
  const el = document.getElementById('riteOfferPrompt');
  if(!el) return;
  const ro = state.pendingRiteOffer;
  if(!ro){ el.style.display='none'; return; }
  el.style.display='flex';
  const p = cur();
  if(!ro.accepted){
    const playable = p.hand.filter(c=>c.type==='Rite' && canPlayCard(state.current, c));
    el.innerHTML = `<span>Use a Rite for this combat? (${playable.map(c=>c.name).join(', ')})</span>
      <button onclick="acceptRiteOffer()">Yes — Use a Rite</button>
      <button onclick="declineRiteOffer()">No — Resolve Attack</button>`;
  } else {
    el.innerHTML = `<span>Click a Rite in hand, then its target. Cast as many as you like.</span>
      <button onclick="resolveAttackNowFromOffer()">Resolve Attack Now</button>`;
  }
}

// "You still have something you can do this phase — proceed anyway?" prompt. Shown only when
// requestNextPhase() set state.pendingPhaseWarning (see its own checks); Proceed/Cancel route
// through confirmAdvancePhaseAnyway()/cancelAdvancePhase() so the rest of the UI stays locked
// (canPlayCard/selectCard/selectAttacker/zoneClick/enemyFaceClick/voidCardClick all check this flag)
// until the player explicitly answers.
function renderPhaseWarningPrompt(){
  const el = document.getElementById('phaseWarningPrompt');
  if(!el) return;
  const pw = state.pendingPhaseWarning;
  if(!pw){ el.style.display='none'; return; }
  el.style.display='flex';
  const msg = pw.reason==='attacker'
    ? `You still have a Vessel that can attack this turn. Proceed to the next phase anyway?`
    : `There are still cards that can be played. Do you wish to proceed to the next phase anyway?`;
  el.innerHTML = `<span>${msg}</span>
    <button onclick="confirmAdvancePhaseAnyway()">Proceed Anyway</button>
    <button onclick="cancelAdvancePhase()">Stay Here</button>`;
}

function render(){
  const p = cur();
  document.getElementById('turnInfo').textContent = `${p.name}'s Turn — Turn ${p.turnCount}, ${PHASE_LABELS[PHASES[state.phaseIdx]]}`;

  renderPhaseTracker();
  renderRealmZone();
  renderDeflectPrompt();
  renderRiteOfferPrompt();
  renderPhaseWarningPrompt();
  renderGraveyardOverlay();
  // Online: MY seat always renders in the near/self slot and the opponent always in the far/enemy
  // slot, regardless of whose turn it is — your screen layout never flips mid-game.
  const mySeat = net.isOnline ? net.mySeat : 0;
  const oppSeat = opp(mySeat);
  renderBoard(oppSeat, false, 'board-1'); // far board (enemy)
  renderBoard(mySeat, true, 'board-0');   // near board (self)
  renderHand();
  renderDevotionPanel();
  updateBigInstruction();
  renderStickyHud();

  const btn = document.getElementById('nextPhaseBtn');
  const phase = PHASES[state.phaseIdx];
  const notMyTurn = net.isOnline && net.connected && state.current!==net.mySeat;
  const aiTurn = aiOpponentActive() && state.current===ai.seat;
  if(state.pendingPhaseWarning){
    btn.textContent = `Resolve the phase-change prompt above…`;
    btn.disabled = true;
  } else if(state.pendingRiteOffer){
    btn.textContent = `Resolve the Rite offer…`;
    btn.disabled = true;
  } else if(state.pendingAttack){
    btn.textContent = `Waiting on Deflect response…`;
    btn.disabled = true;
  } else if(state.pendingEffect){
    btn.textContent = `Resolve pending effect…`;
    btn.disabled = true;
  } else if(aiTurn){
    btn.textContent = `AI is playing…`;
    btn.disabled = true;
  } else if(notMyTurn){
    btn.textContent = `Waiting for ${p.name}…`;
    btn.disabled = true;
  } else if(phase==='End'){
    btn.textContent = `End Turn → Pass to ${curOpp().name}`;
    btn.disabled = p.hand.length>6;
  } else {
    btn.textContent = `Next Phase →`;
    btn.disabled = false;
  }
  btn.onclick = requestNextPhase;

  const skipBtn = document.getElementById('skipEffectBtn');
  skipBtn.style.display = (state.pendingEffect && state.pendingEffect.optional) ? 'block' : 'none';

  // Offer the "Skip to End Phase" shortcut only when there's truly nothing left to do this turn:
  // in Main1/Battle/Main2, no pending anything, my actionable turn, no playable hand card, and
  // (in Battle) no eligible attacker either.
  const skipToEndBtn = document.getElementById('skipToEndBtn');
  const canSkipAhead = !state.gameOver && !state.pendingAttack && !state.pendingEffect &&
    !state.pendingRiteOffer && !state.pendingPhaseWarning && !notMyTurn && !aiTurn &&
    (phase==='Main1' || phase==='Battle' || phase==='Main2') &&
    !hasAnyPlayableHandCard(state.current) &&
    !(phase==='Battle' && hasAnyEligibleAttacker(state.current));
  skipToEndBtn.style.display = canSkipAhead ? 'block' : 'none';

  const hint = document.getElementById('hint');
  const hints = {
    Devotion: `Spend devotion on columns: each point raises one column by one Grade.`,
    Draw: `Draws 1 card automatically (starting player skips their first draw).`,
    Main1: `Click a hand card, then click a highlighted zone to place it.`,
    Battle: `Click a non-sick, non-spent front-row Vessel, then click a target.`,
    Main2: `Click a hand card, then click a highlighted zone to place it.`,
    End: `Discard down to 6 if needed, then End Turn.`,
  };
  hint.textContent = hints[phase] || '';
  fitToViewport();
  scheduleAi();
  renderTurnGuide(); // last: its anchors (devotion picker, hand, battlefield, etc.) must already be painted
}

// Scales #fitWrap (everything except the fixed overlays/HUD) down to whatever the actual screen
// needs so it always fits without scrolling, on any monitor/resolution — instead of the fixed
// pixel sizing being tuned for one specific screen. Recomputed on every render() and on resize.
const FIT_MIN_SCALE = 0.55; // below this, text/cards get hard to read — allow scrolling for the rest instead
const MOBILE_BREAKPOINT = 700; // matches the @media (max-width:700px) rule — below this the CSS restacks the layout instead of us scaling it
function fitToViewport(){
  if(document.body && document.body.classList.contains('mobile')){ const w=document.getElementById('fitWrap'); if(w) w.style.transform='none'; return; }
  const wrap = document.getElementById('fitWrap');
  const hud = document.getElementById('stickyHud');
  if(!wrap || typeof window.innerHeight!=='number' || typeof wrap.scrollHeight!=='number') return; // not a real browser (e.g. test harness) — skip safely
  if(typeof window.innerWidth==='number' && window.innerWidth<=MOBILE_BREAKPOINT){
    // The mobile media query has already restacked everything to fit at full size — scaling a
    // reflowed layout on top of that would just re-break it, so skip the transform entirely and
    // let the page scroll normally (vertical page scroll, plus horizontal swipe on the board row).
    wrap.style.transform = 'none';
    document.documentElement.style.overflowY = 'auto';
    document.body.style.overflowY = 'auto';
    return;
  }
  wrap.style.transform = 'none'; // measure natural, unscaled size first
  const naturalHeight = wrap.scrollHeight;
  const naturalWidth = wrap.scrollWidth;
  if(!naturalHeight || !naturalWidth) return;
  const hudHeight = (hud && typeof hud.offsetHeight==='number' && hud.offsetHeight>0) ? hud.offsetHeight : 52;
  const availableHeight = window.innerHeight - hudHeight - 14;
  const availableWidth = window.innerWidth - 14;
  const rawScale = Math.min(1, availableHeight/naturalHeight, availableWidth/naturalWidth);
  if(!isFinite(rawScale) || rawScale<=0) return;
  const scale = Math.max(rawScale, FIT_MIN_SCALE);
  wrap.style.transform = `scale(${scale})`;
  const scrollNeeded = scale===FIT_MIN_SCALE && rawScale<FIT_MIN_SCALE;
  document.documentElement.style.overflowY = scrollNeeded ? 'auto' : 'hidden';
  document.body.style.overflowY = scrollNeeded ? 'auto' : 'hidden';
}
let fitResizeTimer = null;
if(typeof window.addEventListener==='function'){
  window.addEventListener('resize', ()=>{
    clearTimeout(fitResizeTimer);
    fitResizeTimer = setTimeout(fitToViewport, 120);
  });
  // Phone/tablet rotation: 'resize' usually fires too, but some mobile browsers fire it late or
  // inconsistently right after a rotation, so orientationchange gets its own explicit re-fit —
  // with a slightly longer delay since the browser is still settling the new viewport dimensions.
  window.addEventListener('orientationchange', ()=>{
    clearTimeout(fitResizeTimer);
    fitResizeTimer = setTimeout(fitToViewport, 200);
  });
}

// --- AI opponent engine: a heuristic (non-ML), rules-based bot. Entirely inert unless ai.active is
// true (see startAiGame). Paced via a debounce timer off the end of render() (scheduleAi) so each
// decision is visible rather than instant, and each step just does ONE action then relies on the
// render() its own action triggers to schedule the next step — no synchronous loops driving the game.
function scheduleAi(){
  if(!aiOpponentActive() || state.gameOver) return;
  const defenderIsAiWaitingOnAttack = !!state.pendingAttack && opp(state.current)===ai.seat;
  const aiRedirectPending = !!state.pendingEffect && state.pendingEffect.kind==='redirectAttack' && state.pendingEffect.playerIdx===ai.seat;
  const aiTurnActive = state.current===ai.seat;
  if(!aiTurnActive && !defenderIsAiWaitingOnAttack && !aiRedirectPending) return;
  clearTimeout(aiTimer);
  aiTimer = setTimeout(aiStep, 650);
}

function aiStep(){
  if(state.gameOver || !aiOpponentActive()) return;
  // A Deflect decision can be waiting on the AI even while it's the human's turn (the human is the
  // attacker) — check this FIRST, independent of whose turn state.current says it is.
  //
  // offerDeflect() deliberately leaves state.pendingAttack set while the AI picks a redirect target
  // (it's still the record of what's being redirected — see resolvePendingEffectZoneClick's
  // redirectAttack branch, which reads pa.targetColIdx). That means this pendingAttack check alone
  // would still be true on every tick AFTER Deflect was already played, re-calling aiDecideDeflect()
  // a second time — but Deflect has already left the AI's hand by then, so deflectCard comes back
  // undefined and it falls through to declineDeflect(), which clears pendingAttack and resolves the
  // attack directly WITHOUT ever clearing the still-pending redirectAttack effect. That leaves the
  // game soft-locked forever on a redirect decision nothing can ever satisfy again (confirmed via a
  // stalled full-game AI-vs-AI simulation). The human path already guards against exactly this at
  // zoneClick() — this mirrors that same guard: once Deflect has been played, hand off to the
  // redirectAttack branch below instead of asking the "offer or decline Deflect" question again.
  if(state.pendingAttack && !(state.pendingEffect && state.pendingEffect.kind==='redirectAttack')){
    if(opp(state.current)===ai.seat) aiDecideDeflect();
    return; // either way, nothing else to do while an attack is staged
  }
  // Likewise, Deflect's own follow-up target pick belongs to whichever player played it (the AI, as
  // the defender), not to state.current (the attacker).
  if(state.pendingEffect && state.pendingEffect.kind==='redirectAttack' && state.pendingEffect.playerIdx===ai.seat){
    aiResolvePendingEffect();
    return;
  }
  if(state.current!==ai.seat) return; // not the AI's turn and nothing of the AI's is pending — nothing to do
  if(state.pendingEffect){ aiResolvePendingEffect(); return; }
  const phase = PHASES[state.phaseIdx];
  switch(phase){
    case 'Devotion': aiDoDevotion(); break;
    case 'Draw': nextPhase(); break; // the draw itself already happened when nextPhase() advanced INTO this phase
    case 'Main1': aiDoMain(); break;
    case 'Battle': aiDoBattle(); break;
    case 'Main2': aiDoMain(); break;
    case 'End': aiDoEnd(); break;
    default: nextPhase();
  }
}

// Devotion Phase: spend the pool attuning columns toward the highest-grade Vessels in hand that don't
// already have a home, one attune action per call (attuneColumn's own render() reschedules the next
// step). Moves on once nothing left in hand needs (or can afford) a new column.
function aiDoDevotion(){
  const p = cur();
  const vessels = p.hand.filter(c=>c.type==='Vessel').sort((a,b)=>b.grade-a.grade);
  for(const v of vessels){
    if(p.devotion<=0) break;
    if(p.columns.some(c=>c.colour===v.colour && c.grade>=v.grade)) continue; // already has a home

    // Picking a target column by raw cost alone made the AI repeatedly overwrite the SAME already-
    // invested column with whatever colour the next hand card needed — e.g. a 3 Blue column gets
    // reattuned straight to 1 White for one card, throwing away the Grade progress it just built,
    // instead of spreading colours across its 5 columns the way a human player would. Cost alone can't
    // see that: switching an existing column's colour to Grade 1 costs the same 1 devotion as attuning
    // a never-touched column, so ties always fell to whichever column the loop reached first (column
    // 1). Fix: rank candidate columns by what they'd cost the board, not just this turn —
    //   1) a column already of this colour (just needs a Grade bump) — never wastes anything,
    //   2) a never-attuned column — free to claim, nothing lost,
    //   3) only if every column is taken by some other needed colour, reattune one — and then pick
    //      the LOWEST-Grade one, so whatever gets overwritten is the least progress possible.
    let sameColourCol=-1, sameColourCost=Infinity;
    let emptyCol=-1, emptyCost=Infinity;
    let switchCol=-1, switchGrade=Infinity;
    for(let i=0;i<5;i++){
      const col = p.columns[i];
      const grade = attuneTargetGrade(state.current, i, v.colour);
      if(!canAttune(i, grade, v.colour)) continue;
      const cost = attuneCost(i, v.colour, grade);
      if(col.colour===v.colour){
        if(cost<sameColourCost){ sameColourCost=cost; sameColourCol=i; }
      }else if(!col.colour){
        if(cost<emptyCost){ emptyCost=cost; emptyCol=i; }
      }else{
        if(col.grade<switchGrade){ switchGrade=col.grade; switchCol=i; }
      }
    }
    const bestCol = sameColourCol>=0 ? sameColourCol : (emptyCol>=0 ? emptyCol : switchCol);
    if(bestCol>=0){
      attuneColumn(bestCol, v.colour, attuneTargetGrade(state.current, bestCol, v.colour));
      return;
    }
  }
  nextPhase();
}

// The column (if any) holding the strongest (by ATK+DEF) eligible Vessel for playerIdx. Pass
// casterIdx to also skip Vessels protected from that caster's Rites (Zephyr Tactician).
function aiStrongestVessel(playerIdx, casterIdx){
  const p = state.players[playerIdx];
  let best=-1, bestScore=-1;
  p.front.forEach((v,i)=>{
    if(!v) return;
    if(casterIdx!==undefined && isProtectedFromEnemyRite(playerIdx, i, casterIdx)) return;
    const eff = getEffectiveStats(playerIdx, i);
    const score = eff.atk + eff.def;
    if(score>bestScore){ bestScore=score; best=i; }
  });
  return best;
}

// Placement column for a hand Vessel: the first attuned, empty, matching column. Same rule canPlace
// already enforces for the human UI.
function aiFindPlacementColumn(card){
  const p = cur();
  if(p.essence < card.grade) return -1; // can't afford the Vessel itself — don't bother looking for a column
  for(let i=0;i<5;i++){
    if(!p.front[i] && canPlace(state.current, i, card)) return i;
  }
  return -1;
}

// A board-targeted Rite's effect is "beneficial" (a buff, meant for one of the caster's OWN Vessels)
// when its stat mod is non-negative on both axes, or it's an explicit permanent buff. Everything else
// (damage, true debuffs, bounces) targets the enemy instead. Second Wind and Reattune are skipped
// entirely here — both need extra staging (a Void click / a colour-then-column pick) beyond a single
// board-zone click, which is out of scope for this heuristic bot.
function aiRiteEffectIsBuff(re){
  if(re.permBuffTargetVessel) return true;
  if(re.debuffTargetVessel){
    const mod = re.debuffTargetVessel;
    return (mod.atk||0)>=0 && (mod.def||0)>=0;
  }
  return false;
}

// Main Phase: play the strongest placeable Vessel, or fall back to a useful board-targeted Rite
// (buffing the AI's own strongest Vessel, or hitting the enemy's strongest one), one action per call.
function aiDoMain(){
  const p = cur();
  const vessels = p.hand.filter(c=>c.type==='Vessel').sort((a,b)=>b.grade-a.grade);
  for(const v of vessels){
    const col = aiFindPlacementColumn(v);
    if(col>=0){
      state.selectedCardId = v.id;
      placeSelected(col);
      return;
    }
  }
  const rites = p.hand.filter(c=>c.type==='Rite' && canPlayCard(state.current, c));
  for(const r of rites){
    const m = mech(r.name);
    if(riteEffectWantsBoardZone(m)){
      const buff = aiRiteEffectIsBuff(m.riteEffect);
      const targetPlayerIdx = buff ? state.current : opp(state.current);
      const targetCol = aiStrongestVessel(targetPlayerIdx, buff?undefined:state.current);
      if(targetCol>=0 && riteZoneTargetValid(m.riteEffect, targetPlayerIdx, targetCol, state.current)){
        castRiteAtZone(r.id, targetPlayerIdx, targetCol);
        return;
      }
    } else if(m.riteEffect && m.riteEffect.drawCard){
      castSpellCard(r.id); // Foresight — no target, just cast it
      return;
    }
    // Second Wind (returnGrade1FromVoid) and Reattune (reattuneColumn) intentionally left unplayed by the AI.
  }
  nextPhase();
}

// Battle Phase: attack with every eligible (non-sick, non-spent, non-stunned) Vessel, one attack per
// call — direct if the enemy board is empty (or ignores Grade-1 blockers and only Grade-1s remain),
// otherwise into whichever enemy Vessel has the lowest effective DEF (best chance of destroying it).
function aiDoBattle(){
  const p = cur();
  const oppIdx = opp(state.current);
  const o = state.players[oppIdx];
  for(let i=0;i<5;i++){
    const v = p.front[i];
    if(!v || v.sick || v.attacked || v.stunned) continue;
    state.selectedAttackerZone = String(i);
    const ignoreG1 = mech(v.name).cannotBeBlockedByGrade1;
    if(!frontRowHasVessels(oppIdx, ignoreG1)){
      resolveAttack(null, true);
      return;
    }
    let target=-1, bestDef=Infinity;
    o.front.forEach((ev,j)=>{
      if(!ev) return;
      if(ignoreG1 && ev.grade===1) return;
      const eff = getEffectiveStats(oppIdx, j);
      if(eff.def<bestDef){ bestDef=eff.def; target=j; }
    });
    if(target>=0){
      resolveAttack(target, false);
      return;
    }
    state.selectedAttackerZone = null;
  }
  nextPhase();
}

// End Phase: discard down to the 6-card hand cap if needed (keeping higher-grade Vessels, discarding
// Rites/Realms and low-grade Vessels first), then pass the turn.
function aiDoEnd(){
  const p = cur();
  while(p.hand.length>6){
    let worst = p.hand[0];
    for(const c of p.hand){
      const worstScore = worst.type==='Vessel' ? worst.grade : -1;
      const cScore = c.type==='Vessel' ? c.grade : -1;
      if(cScore<worstScore) worst = c;
    }
    discardCard(worst.id);
  }
  nextPhase();
}

// A pending on-play effect (from a Vessel the AI just placed) that needs a board-zone target.
// Damage/debuff/stun/bounce effects go on the enemy's strongest Vessel; anything else (there's no
// permanent-buff-on-play Vessel in this deck list, but the fallback is harmless) targets the AI's own.
// redirectAttack (the AI's own Deflect) picks any other Vessel of the AI's to take the hit instead.
// moveFriendlyAdjacent is optional and simply skipped — repositioning isn't worth modeling here.
function aiResolvePendingEffect(){
  const pe = state.pendingEffect;
  if(!pe) return;
  const mine = pe.playerIdx;
  const enemy = opp(mine);

  if(pe.kind==='redirectAttack'){
    const pa = state.pendingAttack;
    const p = state.players[mine];
    const col = p.front.findIndex((v,i)=> v && (!pa || i!==pa.targetColIdx));
    if(col>=0) resolvePendingEffectZoneClick(mine, col);
    else { state.pendingEffect=null; state.pendingAttack=null; render(); }
    return;
  }
  if(pe.kind==='moveFriendlyAdjacent'){
    state.pendingEffect = null; render(); return;
  }
  if(pe.kind==='reattuneColumn'){
    if(pe.stage==='selectColumn'){
      const col = state.players[mine].columns.findIndex(c=>c.colour);
      if(col>=0){ resolvePendingEffectZoneClick(mine, col); return; }
    }
    state.pendingEffect = null; render(); return;
  }
  if(pe.kind==='discardFromEffect'){
    const p = state.players[mine];
    const card = p.hand[0];
    if(card) resolvePendingDiscard(card.id);
    else { state.pendingEffect=null; render(); }
    return;
  }

  const wantsEnemy = pe.kind==='damageAnyVessel' || pe.kind==='debuffTargetVessel' || pe.kind==='stunTargetVessel' || pe.kind==='bounceTargetEnemyVessel' || pe.kind==='bounceAnyVessel';
  const targetPlayerIdx = wantsEnemy ? enemy : mine;
  const col = aiStrongestVessel(targetPlayerIdx, mine);
  if(col>=0) resolvePendingEffectZoneClick(targetPlayerIdx, col);
  else { state.pendingEffect = null; render(); } // no legal target anywhere — nothing to do, don't stall the game
}

// Deflect decision, made when the AI is the one being attacked. Redirects onto a different Vessel of
// its own whenever it can afford Deflect and has somewhere else to send the attack; otherwise takes
// the hit as declared.
function aiDecideDeflect(){
  const pa = state.pendingAttack;
  if(!pa) return;
  const defenderIdx = opp(state.current);
  const defender = state.players[defenderIdx];
  const deflectCard = defender.hand.find(c=>c.name==='Deflect');
  const hasOtherTarget = !pa.directPlayer && defender.front.some((v,i)=>v && i!==pa.targetColIdx);
  if(deflectCard && defender.essence>=deflectCard.cost && hasOtherTarget){
    offerDeflect(deflectCard.id);
  } else {
    declineDeflect();
  }
}

// --- Lobby wiring: hotseat (default, no networking touched) vs host/join a peer-to-peer room. -----
function genRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I — easier to read aloud/type
  let s = '';
  for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function closeLobby(){
  const el = document.getElementById('lobbyOverlay');
  if(el) el.classList.add('hidden');
  // The board behind the lobby was already painted once at page load (see the unconditional startTurn()
  // call at the bottom of this script), so there's no upcoming render() to pick this up automatically —
  // paint the tutorial's first tip immediately rather than waiting on the player's next action.
  renderTurnGuide();
}

// Rolls a d6 to decide who takes the first turn (1-3 the human, 4-6 the AI), independent of which
// deck each side plays. Resets both players' turn/devotion counters back to a clean slate first,
// since startTurn() already ran once unconditionally at page load for Player 1 (see the very bottom
// of this script) — this re-does turn 1 fairly rather than always favouring whoever loaded first.
function rollForStartingPlayer(){
  const roll = 1 + Math.floor(Math.random()*6);
  const humanFirst = roll<=3;
  const firstSeat = humanFirst ? opp(ai.seat) : ai.seat;
  log(`Rolling a d6 to see who goes first... rolled a ${roll} — ${state.players[firstSeat].name} goes first!`);
  state.players.forEach((p,i)=>{
    p.isStartingPlayer = (i===firstSeat);
    p.turnCount = 0;
    p.devotion = 0;
    p.devotionTotal = 0;
    p.essence = 0;
    p.essenceTotal = 0;
  });
  state.current = firstSeat;
  startTurn();
}

// "Play vs AI": human is always Emberroot (seat 0), the AI is always Tidewind (seat 1) — see the ai
// state object above. Closes the lobby, rolls the d6 for who goes first, then lets scheduleAi() (called
// at the end of every render()) drive the AI's turns from there.
function startAiGame(){
  ai.active = true;
  ai.seat = 1;
  closeLobby();
  rollForStartingPlayer();
}
// Tutorial: vs the AI, but the human always goes first and the step-by-step guide is forced on.
function startTutorial(){
  ai.active = true;
  ai.seat = 1;
  closeLobby();
  const firstSeat = opp(ai.seat);
  state.players.forEach((p,i)=>{
    p.isStartingPlayer = (i===firstSeat);
    p.turnCount = 0; p.devotion = 0; p.devotionTotal = 0; p.essence = 0; p.essenceTotal = 0;
  });
  state.current = firstSeat;
  log(`Tutorial — you go first. Follow the tips on screen.`);
  turnGuideActive = true;
  turnGuideStepIdx = 0;
  startTurn();
}
function startOnlineGame(seat, roomCode){
  const statusEl = document.getElementById('lobbyStatus');
  if(typeof window.TrysteroJoinRoom !== 'function'){
    if(statusEl) statusEl.textContent = 'Networking library failed to load — check your internet connection and reload the page.';
    return;
  }
  net.mySeat = seat;
  if(statusEl){
    statusEl.textContent = seat===0
      ? `Room code: ${roomCode} — share it with your friend. Waiting for them to join…`
      : `Joining room ${roomCode}…`;
  }
  try{
    // The default single relay isn't reachable from every network/browser (ad-blockers, ISP
    // filtering, etc.) — supplying several well-known public Nostr relays gives peer discovery
    // more than one path to succeed.
    const room = window.TrysteroJoinRoom({
      appId:'enscra-prototype-v1',
      relayUrls: [
        'wss://relay.damus.io',
        'wss://nos.lol',
        'wss://relay.nostr.band',
        'wss://nostr.wine',
        'wss://relay.snort.social'
      ]
    }, roomCode);
    net.room = room;
    // Trystero's makeAction() returns an object ({send, onMessage}), not a destructurable
    // array, and onPeerJoin/onPeerLeave are plain properties you assign a handler to.
    const act = room.makeAction('act');
    net.sendAction = (msg) => act.send(msg);
    act.onMessage = (msg) => handleRemoteAction(msg);
    room.onPeerJoin = () => {
      net.isOnline = true;
      net.connected = true;
      maskOpponent(opp(seat));
      closeLobby();
      log(`Connected! You are ${state.players[seat].name}.`);
      render();
    };
    room.onPeerLeave = () => {
      net.connected = false;
      log(`Your opponent disconnected.`);
      render();
    };
    // Signaling (finding your opponent via public relays) can take a while — if nothing has
    // happened after 20s, say so instead of leaving the screen looking frozen forever.
    setTimeout(()=>{
      if(!net.connected && statusEl){
        statusEl.textContent += ' Still waiting — make sure your friend has this same file open and entered this exact code, then give it a bit longer.';
      }
    }, 20000);
  }catch(err){
    console.error('Trystero room join failed:', err);
    if(statusEl) statusEl.textContent = 'Could not start the connection: ' + (err && err.message ? err.message : err);
  }
}
(function wireLobby(){
  const $ = id => document.getElementById(id);
  const tap = fn => () => { playSfx('phase'); fn(); };
  const showScreen = id => { ['mmMain','mmPlayer'].forEach(x=>{ const el=$(x); if(el) el.hidden = (x!==id); }); };
  const joinInput = $('lobbyJoinCode');
  $('mmTutorialBtn') && $('mmTutorialBtn').addEventListener('click', tap(startTutorial));
  $('lobbyAiBtn') && $('lobbyAiBtn').addEventListener('click', tap(startAiGame));
  $('mmVsPlayerBtn') && $('mmVsPlayerBtn').addEventListener('click', tap(()=>showScreen('mmPlayer')));
  $('mmBackBtn') && $('mmBackBtn').addEventListener('click', tap(()=>showScreen('mmMain')));
  $('lobbyHotseatBtn') && $('lobbyHotseatBtn').addEventListener('click', tap(closeLobby));
  $('lobbyHostBtn') && $('lobbyHostBtn').addEventListener('click', tap(()=>startOnlineGame(0, genRoomCode())));
  $('lobbyJoinBtn') && $('lobbyJoinBtn').addEventListener('click', tap(()=>{
    const code = (joinInput && joinInput.value || '').trim().toUpperCase();
    const statusEl = $('lobbyStatus');
    if(!code){ if(statusEl) statusEl.textContent = 'Enter a room code first.'; return; }
    startOnlineGame(1, code);
  }));
  if(joinInput) joinInput.addEventListener('keydown', e=>{ if(e.key==='Enter') $('lobbyJoinBtn').click(); });
})();

document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') hideCardZoom(); });

// --- Long-press-to-expand a card (task: "longpress a card to expand it, short pressing just selects
// it like a mouse click") -------------------------------------------------------------------------
// Works for both mouse and touch via the Pointer Events API, so it's a single code path for both.
// A short press/click is left completely untouched (selectCard/zoneClick/etc. still fire normally via
// their own onclick handlers) — this only ADDS the long-press behaviour on top, by opening the
// existing card-zoom overlay (zoomCard(), the same one the 🔍 button already opens) and then, if a
// long press actually fired, swallowing the click that follows pointerup so a long-press doesn't also
// select/place the card underneath it.
const LONG_PRESS_MS = 450;
const LONG_PRESS_MOVE_TOLERANCE = 10; // px of drift before we treat it as a drag/scroll, not a hold
let longPressTimer = null;
let longPressCardId = null;
let longPressStartX = 0, longPressStartY = 0;
let longPressFired = false; // true for the brief window between a successful long-press and its trailing click

function findCardIdFromEvent(e){
  if(typeof e.target.closest!=='function') return null;
  if(e.target.closest('#cardZoomOverlay')) return null; // already in the zoomed view — nothing to long-press into
  if(e.target.closest('.zoomBtn')) return null; // the 🔍 button already opens the zoom itself
  if(e.target.closest('.kw')) return null; // a glossary keyword handles its own tap/click — don't also start a card long-press under it
  const el = e.target.closest('[id^="cardEl-"]');
  if(!el) return null;
  const id = parseInt(el.id.slice('cardEl-'.length), 10);
  return Number.isNaN(id) ? null : id;
}

function clearLongPressTimer(){
  if(longPressTimer!==null){ clearTimeout(longPressTimer); longPressTimer = null; }
  longPressCardId = null;
}

document.addEventListener('pointerdown', (e)=>{
  const id = findCardIdFromEvent(e);
  if(id===null) return;
  longPressStartX = e.clientX; longPressStartY = e.clientY;
  longPressCardId = id;
  longPressTimer = setTimeout(()=>{
    longPressTimer = null;
    if(longPressCardId!==id) return; // pointer moved to/became a different card in the meantime
    longPressFired = true;
    zoomCard(id);
  }, LONG_PRESS_MS);
});

document.addEventListener('pointermove', (e)=>{
  if(longPressTimer===null) return;
  const dx = e.clientX - longPressStartX, dy = e.clientY - longPressStartY;
  if(Math.sqrt(dx*dx + dy*dy) > LONG_PRESS_MOVE_TOLERANCE) clearLongPressTimer(); // drifted too far — this is a drag/scroll, not a hold
});

document.addEventListener('pointerup', clearLongPressTimer);
document.addEventListener('pointercancel', clearLongPressTimer);
document.addEventListener('dragstart', clearLongPressTimer); // don't fight with the existing Vessel drag-and-drop

// Capture phase so this runs BEFORE the card's own onclick (selectCard/zoneClick/etc.) gets a chance.
document.addEventListener('click', (e)=>{
  if(!longPressFired) return;
  longPressFired = false;
  e.preventDefault();
  e.stopPropagation();
}, true);

// Dismiss the glossary popover on any click elsewhere. Non-capture, bubble-phase listener: a .kw
// span's own onclick already called event.stopPropagation() before this ever runs, so clicking a
// keyword (or re-clicking the same one to move it) never immediately closes what it just opened.
document.addEventListener('click', ()=>{
  if(justOpenedGlossaryPopover){ justOpenedGlossaryPopover = false; return; } // this click is the SAME one that just opened it (see wrapKw) — don't immediately close what was just shown
  hideGlossaryPopover();
});

startTurn();
(()=>{ const btn = document.getElementById('sfxToggleBtn'); if(btn) btn.textContent = sfxEnabled.value ? '🔊 Sound' : '🔇 Sound'; })();
</script>

VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//tyxLED0O3fHwekb8AAADSAAAAEVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU=";
  let actx = null, hoverBuf = null, lastHoverSound = 0, lastSoundCard = null;
  function initHoverAudio(){
    if(actx) return;
    try{
      actx = new (window.AudioContext||window.webkitAudioContext)();
      fetch(HOVER_SFX).then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b)).then(buf=>{ hoverBuf = buf; }).catch(()=>{});
    }catch(e){ actx = null; }
  }
  document.addEventListener('pointerdown', initHoverAudio, true);
  document.addEventListener('keydown', initHoverAudio, true);
  function playHoverSound(cardEl){
    if(cardEl===lastSoundCard) return; lastSoundCard = cardEl;
    if(!actx || !hoverBuf || (typeof sfxEnabled==='object' && !sfxEnabled.value)) return;
    const now = performance.now();
    if(now - lastHoverSound < 45) return; // a fast sweep across cards still clicks per card, but never stacks into a buzz
    lastHoverSound = now;
    try{
      if(actx.state==='suspended') actx.resume();
      const src = actx.createBufferSource(); src.buffer = hoverBuf;
      const g = actx.createGain(); g.gain.value = 0.4;
      src.connect(g).connect(actx.destination); src.start();
    }catch(e){ /* a sound failure must never break the game */ }
  }
  document.addEventListener('mouseover', e=>{
    const el = e.target.closest && e.target.closest('.card.ecard');
    if(!el){ lastSoundCard = null; return; }
    if(el.closest('#cardZoomInner') || el.closest('#cardHoverPreview')) return;
    // same card re-rendered under the cursor (the game redraws often) shouldn't re-click
    if(lastSoundCard && !lastSoundCard.isConnected && lastSoundCard.id && lastSoundCard.id===el.id){ lastSoundCard = el; return; }
    playHoverSound(el);
  });
  function hide(){ box.classList.remove('show'); box.innerHTML=''; current=null; }
  document.addEventListener('mouseover', e=>{
    const el = e.target.closest && e.target.closest('.card.ecard');
    if(!el || el.classList.contains('hiddenCard') || el.closest('#cardZoomInner') || el.closest('#cardHoverPreview') || el.closest('#graveyardOverlay')){ if(current && !el) hide(); return; }
    if(el===current) return;
    current = el;
    const clone = el.cloneNode(true);
    clone.removeAttribute('id'); clone.classList.remove('selected'); clone.style.transform=''; clone.style.opacity='';
    box.innerHTML=''; box.appendChild(clone);
    const r = el.getBoundingClientRect();
    const w = 270, h = 389, pad = 14;
    let left = (r.left + r.width/2 < window.innerWidth/2) ? Math.min(window.innerWidth - w - pad, r.right + pad) : Math.max(pad, r.left - w - pad);
    let top = Math.max(pad, Math.min(window.innerHeight - h - pad, r.top + r.height/2 - h/2));
    box.style.left = left+'px'; box.style.top = top+'px';
    box.classList.add('show');
  });
  document.addEventListener('mouseout', e=>{ if(current && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.card.ecard')===current)) hide(); });
  document.addEventListener('mousedown', hide, true);
  window.addEventListener('scroll', hide, true);
  setInterval(()=>{ if(current && !current.isConnected) hide(); }, 250); // the game re-renders often — drop the preview if its card was replaced
})();

<script>
// Phone layout: rebuild the page into one fixed game screen (see #mobileLayout styles).
(function(){
  var coarse = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || navigator.maxTouchPoints>0;
  var small = Math.min(window.innerWidth, window.innerHeight) <= 600;
  if(!(coarse && small) && !/[?&]mobile/.test(location.search)) return;
  var $=function(id){return document.getElementById(id);};
  function el(tag,id,cls,html){ var e=document.createElement(tag); if(id) e.id=id; if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }

  var g=el('div','mGame'); var top=el('div','mTop'), field=el('div','mField'), plane=el('div','mPlane'), info=el('div','mInfo'), hand=el('div','mHand');
  var opp=el('div','mOpp'), mid=el('div','mMid'), me=el('div','mMe');
  plane.appendChild(opp); plane.appendChild(mid); plane.appendChild(me); field.appendChild(plane);
  [top,field,info,hand].forEach(function(x){ g.appendChild(x); });
  document.body.appendChild(g);

  // top bar: ☰ + whose turn
  var menuBtn=el('button','mMenuBtn',null,'☰'); menuBtn.setAttribute('aria-label','Menu');
  top.appendChild(menuBtn); top.appendChild($('turnInfo'));

  opp.appendChild($('board-1')); me.appendChild($('board-0'));
  hand.appendChild($('handWrap')); info.appendChild($('bigInstruction'));

  // middle of the mat: devotion chip, phase banner, next/skip
  var chip=el('button','mDevChip'); chip.hidden=true;
  var phaseLabel=el('div','mPhaseLabel');
  var phaseWrap=el('div','mPhaseWrap'), pips=el('div','mPhasePips'); phaseWrap.appendChild(phaseLabel); phaseWrap.appendChild(pips);
  mid.appendChild(chip); mid.appendChild(phaseWrap);
  ['nextPhaseBtn','skipEffectBtn','skipToEndBtn','realmZoneWrap'].forEach(function(id){ mid.appendChild($(id)); });

  // ☰ drawer: phases, then game options
  var drawer=el('div','mDrawer'), bg=el('div','mDrawerBg');
  drawer.appendChild(el('h4',null,null,'Turn phases'));
  drawer.appendChild($('phaseStepsList'));
  drawer.appendChild(el('h4',null,null,'Game'));
  var btns=el('div','mDrawerBtns'); drawer.appendChild(btns);
  var logBtn=el('button',null,null,'📜 Log');
  logBtn.onclick=function(e){ e.stopPropagation(); closeDrawer(); document.body.classList.add('showLog'); };
  btns.appendChild(logBtn);
  // board size toggle (remembered between games)
  var sizeBtn=el('button','mBoardSizeBtn');
  function applyBoardSize(large){
    document.body.classList.toggle('boardLarge',large);
    sizeBtn.innerHTML='🔍 Board size: <b>'+(large?'Large':'Normal')+'</b>';
  }
  var bigBoard=true; try{ bigBoard=localStorage.getItem('enscraBoardLarge')!=='0'; }catch(e){} // Large by default
  applyBoardSize(bigBoard);
  sizeBtn.onclick=function(e){ e.stopPropagation(); bigBoard=!bigBoard; applyBoardSize(bigBoard);
    try{ localStorage.setItem('enscraBoardLarge', bigBoard?'1':'0'); }catch(e){}
    requestAnimationFrame(function(){ render(); }); };
  btns.appendChild(sizeBtn);
  btns.appendChild($('sfxToggleBtn'));
  var help=$('economyHelpBtn'); help.textContent='❓ How to Play'; btns.appendChild(help);
  var oldStatusBtns=$('status').querySelector('div');
  var menuReturn=oldStatusBtns.lastElementChild; menuReturn.textContent='⌂ Main Menu'; btns.appendChild(menuReturn);
  document.body.appendChild(bg); document.body.appendChild(drawer);
  function closeDrawer(){ document.body.classList.remove('drawerOpen'); }
  menuBtn.onclick=function(e){ e.stopPropagation(); document.body.classList.toggle('drawerOpen'); };
  bg.onclick=closeDrawer;
  help.addEventListener('click',closeDrawer);

  // devotion / colour popup (the existing picker moves inside it)
  var pop=el('div','devPopup'); var card=el('div',null,'dpCard');
  var title=el('div',null,'dpTitle'), sub=el('div',null,'dpSub'), pts=el('div',null,'dpPts');
  var foot=el('div',null,'dpFoot'), viewBtn=el('button',null,null,'View board'), doneBtn=el('button',null,'primary','Done →'), cancelBtn=el('button',null,null,'Cancel');
  foot.appendChild(viewBtn); foot.appendChild(cancelBtn); foot.appendChild(doneBtn);
  card.appendChild(title); card.appendChild(pts); card.appendChild(sub); card.appendChild($('devotionPicker')); card.appendChild(foot);
  pop.appendChild(card); document.body.appendChild(pop);
  var dismissedKey=null;
  function popKey(){ return state.current+'-'+(cur().turnCount)+'-'+state.phaseIdx; }
  viewBtn.onclick=function(){ dismissedKey=popKey(); render(); };
  doneBtn.onclick=function(){ playSfx('phase'); dismissedKey=popKey(); requestNextPhase(); };
  cancelBtn.onclick=function(){ state.selectedCardId=null; state.reattuneStaging=null; render(); };
  chip.onclick=function(){
    if(state.selectedAttuneColour){ state.selectedAttuneColour=null; }
    else if(state.reattuneStaging){ state.reattuneStaging=null; }
    else { dismissedKey=null; }
    render();
  };

  ['log','deflectPrompt','riteOfferPrompt','phaseWarningPrompt'].forEach(function(id){ document.body.appendChild($(id)); });
  document.addEventListener('click',function(e){ if(document.body.classList.contains('showLog') && !$('log').contains(e.target) && e.target!==logBtn) document.body.classList.remove('showLog'); });
  $('bigInstruction').addEventListener('click',function(){ this.classList.toggle('expanded'); });

  // ---- Card inspect: tapped cards fly to the centre; hand cards get a Play button there ----
  var zOv=$('cardZoomOverlay'), zIn=$('cardZoomInner');
  var zAct=el('div','mZoomActions'), zPlay=el('button','mZoomPlay','primary'), zBack=el('button','mZoomBack',null,'Back to hand');
  zAct.appendChild(zPlay); zAct.appendChild(zBack); zOv.appendChild(zAct);
  var zSrc=null, zPlayFn=null, zBusy=false, lastCardEl=null, zFade=null; // zFade: the close fade, cancelled after so the buttons aren't left hidden
  document.addEventListener('pointerdown',function(e){ var c=e.target.closest&&e.target.closest('.card.ecard'); if(c && !c.closest('#cardZoomOverlay')) lastCardEl=c; },true);
  function flyRect(from,to){ return {dx:(from.left+from.width/2)-(to.left+to.width/2), dy:(from.top+from.height/2)-(to.top+to.height/2), s:from.width/Math.max(1,to.width)}; }
  var baseZoom=zoomCard, baseHide=hideCardZoom;
  zoomCard=function(id, src, playFn){
    baseZoom(id);
    zPlayFn=playFn||null; zOv.classList.toggle('hasPlay', !!zPlayFn);
    zSrc = src || (lastCardEl && lastCardEl.isConnected ? lastCardEl : null);
    var card=zIn.querySelector('.card.ecard');
    if(zSrc && card && zIn.animate){
      var f=flyRect(zSrc.getBoundingClientRect(), card.getBoundingClientRect());
      zSrc.style.visibility='hidden';
      zIn.animate([{transform:'translate('+f.dx+'px,'+f.dy+'px) scale('+f.s+')'},{transform:'none'}],{duration:300,easing:'cubic-bezier(.2,.85,.25,1)'});
    }
    zOv.animate && zOv.animate([{backgroundColor:'rgba(0,0,0,0)'},{backgroundColor:'rgba(0,0,0,.78)'}],{duration:260});
    zAct.animate && zAct.animate([{opacity:0,transform:'translateY(10px)'},{opacity:0,offset:.5},{opacity:1,transform:'none'}],{duration:380});
  };
  hideCardZoom=function(after){
    if(zBusy) return;
    var card=zIn.querySelector('.card.ecard'), src=zSrc; zSrc=null;
    function done(){ zBusy=false; if(zFade){ zFade.cancel(); zFade=null; } baseHide(); zOv.classList.remove('hasPlay'); if(src) src.style.visibility=''; if(typeof after==='function') after(); }
    if(src && src.isConnected && card && zIn.animate){
      zBusy=true;
      var f=flyRect(src.getBoundingClientRect(), card.getBoundingClientRect());
      var fade=zAct.animate([{opacity:1},{opacity:0}],{duration:120,fill:'forwards'}); zFade=fade;
      zIn.animate([{transform:'none'},{transform:'translate('+f.dx+'px,'+f.dy+'px) scale('+f.s+')'}],{duration:230,easing:'cubic-bezier(.5,0,.75,.4)'}).onfinish=done;
      zOv.animate([{backgroundColor:'rgba(0,0,0,.78)'},{backgroundColor:'rgba(0,0,0,0)'}],{duration:230});
    } else done();
  };
  zBack.onclick=function(e){ e.stopPropagation(); hideCardZoom(); };
  zPlay.onclick=function(e){ e.stopPropagation(); var fn=zPlayFn; zPlayFn=null; var src=zSrc; zSrc=null; if(src) src.style.visibility=''; baseHide(); zOv.classList.remove('hasPlay'); if(fn) fn(); };
  // tap the big card (not a keyword) to put it back
  zIn.addEventListener('click',function(e){ if(e.target.closest('.kw')||e.target.closest('button')) return; hideCardZoom(); });
  // hand tap: inspect first, play from the button (tapping an already-selected card still deselects it)
  $('handCards').addEventListener('click',function(e){
    var w=e.target.closest('.cardWrap'); if(!w || e.target.closest('.kw')) return;
    var c=w.querySelector('.card.ecard'); if(!c || c.classList.contains('selected')) return;
    var id=parseInt((c.id||'').replace('cardEl-',''),10); if(isNaN(id)) return;
    e.stopPropagation(); e.preventDefault();
    var act=w.getAttribute('onclick')||'', canAct=/selectCard\(/.test(act);
    var discard=/discard/i.test(($('handTitle')||{}).textContent||'');
    var cardObj=cardRegistry[id]||{};
    zPlay.textContent = discard ? 'Discard this card' : (cardObj.type==='Vessel' ? 'Play — pick a column' : 'Play this card');
    zPlay.disabled = parseFloat(w.style.opacity||'1')<1 && !discard;
    zoomCard(id, c, canAct ? function(){ selectCard(id); } : null);
  },true);
  document.body.classList.add('mobile');

  var baseRender=render;
  render=function(){
    baseRender.apply(this,arguments);
    var phase=PHASES[state.phaseIdx], p=cur();
    phaseLabel.textContent=PHASE_LABELS[phase]||'';
    pips.innerHTML=PHASES.map(function(ph,i){ return '<i class="'+(i<state.phaseIdx?'done':i===state.phaseIdx?'now':'')+'" title="'+(PHASE_LABELS[ph]||ph)+'"></i>'; }).join('');
    var rz=$('realmZoneWrap'); if(rz) rz.classList.toggle('noRealm', !state.realm);
    document.querySelectorAll('#mGame .badge.deckBadge').forEach(function(b){ var t=b.textContent.trim(); var n=(t.match(/\d+/)||[''])[0]; b.setAttribute('data-n', n+(/hand/.test(t)?' hand':'')); });

    // hand sizing: fit the full width, overlap only as much as needed
    var hc=$('handCards'), col=document.querySelector('#mMe .col');
    if(hc && col){ var n=Math.max(1,hc.querySelectorAll('.cardWrap').length), avail=(hand.clientWidth-10)*0.9, cw=col.offsetWidth; // 0.9: room for the fan's tilt at the edges
      var land=innerWidth>innerHeight;
      var maxW=land ? Math.max(40,(hand.clientHeight-22)*795/1144) : cw*2.0;
      var side=land && document.body.classList.contains('boardLarge'), vis=side?0.5:0.7; // hand in the side column: overlap more, bigger cards
      var hw=Math.max(40, Math.min(maxW, avail/(vis*n+(1-vis))));
      var ov=n>1 ? Math.max(hw*(1-vis), (n*hw-avail)/(n-1)) : 0;
      hc.style.setProperty('--hw', hw+'px'); hc.style.setProperty('--ov', ov+'px');
      // fan the hand: slight rotation, edges dip lower
      var step=Math.min(side?2.5:4, (side?8:12)/Math.max(1,n-1)), midI=(n-1)/2;
      hc.querySelectorAll('.cardWrap').forEach(function(w,i){ var o=i-midI; w.style.setProperty('--r',(o*step).toFixed(2)+'deg'); w.style.setProperty('--y',(o*o*hw*0.015).toFixed(1)+'px'); }); }

    // popup: shows whenever the colour picker is live and we're not waiting on a column tap
    var picker=$('devotionPicker'), pickerOn=picker && picker.style.display!=='none';
    var isDev = phase==='Devotion';
    var waitingCol = (isDev && state.selectedAttuneColour) || !!state.reattuneStaging;
    var lobbyUp = !$('lobbyOverlay').classList.contains('hidden');
    var key=popKey();
    var show = pickerOn && !waitingCol && dismissedKey!==key && !lobbyUp && !state.gameOver && !(isDev && p.devotion<=0);
    if(isDev){
      title.textContent='Devotion';
      var left=p.devotion, tot=p.devotionTotal;
      pts.innerHTML=''; for(var i=0;i<tot;i++){ var d=document.createElement('span'); if(i>=left) d.className='used'; pts.appendChild(d); }
      pts.hidden=false;
      sub.textContent=left+' point'+(left===1?'':'s')+' to spend. Pick a colour, then tap one of your columns.';
      doneBtn.hidden=false; viewBtn.hidden=false; cancelBtn.hidden=true;
    } else {
      title.textContent='Pick a colour'; pts.hidden=true;
      sub.textContent='Choose the new colour, then tap the column to change.';
      doneBtn.hidden=true; viewBtn.hidden=true; cancelBtn.hidden=!(state.selectedCardId!=null);
    }
    pop.classList.toggle('open', !!show);

    // chip in the middle of the mat
    var myTurn=isMyActionableTurn();
    if(waitingCol && myTurn){ chip.hidden=false; chip.textContent=(state.selectedAttuneColour||state.reattuneStaging.colour)+' · tap a column ✕'; }
    else if(isDev && myTurn && dismissedKey===key && p.devotion>0){ chip.hidden=false; chip.textContent='◆ Devote'; }
    else chip.hidden=true;
  };
  render();
  window.addEventListener('resize',function(){ setTimeout(render,150); });
})();
</script>

</body>
</html>
